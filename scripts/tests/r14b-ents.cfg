// R14b: [entities] Weapons rewrite per option (srvdebug ents = what the game parsed), Random re-rolled on
// every restart, Instagib pickups, leaving the page restarts exactly once per change.
//   scripts/tests/r14b-run.sh r14b-ents.cfg ents q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvWeapons default
set cl_splitSrvInstagib 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 20
srvdebug health
echo "=== TEST default"
srvdebug ents
echo "=== TEST weapons random"
serveroptions
wait 5
set cl_splitSrvWeapons random
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons random"
serveroptions
wait 5
set cl_splitSrvWeapons random
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons gauntlet"
serveroptions
wait 5
set cl_splitSrvWeapons gauntlet
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons machinegun"
serveroptions
wait 5
set cl_splitSrvWeapons machinegun
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons shotgun"
serveroptions
wait 5
set cl_splitSrvWeapons shotgun
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons grenade"
serveroptions
wait 5
set cl_splitSrvWeapons grenade
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons rocket"
serveroptions
wait 5
set cl_splitSrvWeapons rocket
vstr k0b
wait 90
srvdebug ents
setviewpos 1772 -1376 -110 0
wait 30
screenshotJPEG r14b-rocket-only
wait 5
echo "=== TEST weapons lightning"
serveroptions
wait 5
set cl_splitSrvWeapons lightning
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons railgun"
serveroptions
wait 5
set cl_splitSrvWeapons railgun
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons plasma"
serveroptions
wait 5
set cl_splitSrvWeapons plasma
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons bfg"
serveroptions
wait 5
set cl_splitSrvWeapons bfg
vstr k0b
wait 90
srvdebug ents
echo "=== TEST weapons default"
serveroptions
wait 5
set cl_splitSrvWeapons default
vstr k0b
wait 90
srvdebug ents
echo "=== TEST open/leave without a change: no restart"
serveroptions
wait 5
vstr k0b
wait 30
echo "=== TEST instagib"
serveroptions
wait 5
set cl_splitSrvInstagib 1
vstr k0b
wait 90
srvdebug ents
wait 200
srvdebug ps
srvdebug health
echo "=== TEST instagib off"
serveroptions
wait 5
set cl_splitSrvInstagib 0
vstr k0b
wait 90
srvdebug ents
quit
