// R8: after r8-persist-a.cfg (new process): Dan's pad joins as P3 (pad 2 takes P2 first); Dan is pre-highlighted; all three settings are back.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-persist-b.cfg r8-vk-persist-b q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
wait 10
vstr k0a
profile_list
echo "=== TEST pad 2 joins first as Guest (P2)"
vstr join2
wait 20
vstr k2a
wait 300
echo "=== TEST pad 1 joins (P3): picker with Dan pre-highlighted"
vstr join1
wait 30
screenshotJPEG r8-p-3-prehighlight
wait 5
vstr k1a
wait 300
echo "=== TEST P3 = Dan: look speed 380, X fires, model as chosen"
p3 joy_yawSpeed
pbindlist 3
p3 model
p2 joy_yawSpeed
p2 model
status
splitplayers
echo "=== TEST X fires for P3 (ammo goes down)"
padinject 1 button PAD_X 1
wait 40
padinject 1 button PAD_X 0
wait 10
screenshotJPEG r8-p-4-p3
wait 5
set developer 0
quit
