// R19 duplicate devices and keys without a path, on the test device bus (r19-run.sh; player windows
// see the bus in reverse order).
//   1. device 5 has the same device path as device 0 (P1's): the coordinator does not open it.
//   2. devices 6 and 7 (two people) press A in the same frame: taken for one pad listed twice, until
//      they differ (7 presses X alone) -- then 7 holds A and joins as P2, exactly once.
//   3. device 9 has no device path (key "<guid>#n"); device 10, same model, no path either, is seen only
//      by the coordinator.  9 joins as P3, is unplugged and comes back after 10 in the list (a new
//      order key): matched by its GUID to P3, whose window is told the new key.
//   scripts/tests/r19-run.sh r19-dedupe.cfg dedupe -
set com_maxfps 60
set com_maxfpsUnfocused 60
set hA7 "padbus 7 button PAD_A 1;wait 60;padbus 7 button PAD_A 0;wait 20"
set hA9 "padbus 9 button PAD_A 1;wait 60;padbus 9 button PAD_A 0;wait 20"
padbus clear
wait 5
padbus 0 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&aaa&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 10
padbus 0 button PAD_A 1
wait 3
padbus 0 button PAD_A 0
wait 20
echo "=== TEST 1: device 5 = the same path as device 0 (P1's)"
padbus 5 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&aaa&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 30
padlist
echo "=== TEST 2: devices 6 and 7 press A in the same frame (two people)"
padbus 6 connect 030045e0e8d40000ea02000000007200 \?\HID#VID_045E&PID_02EA#6&one#{ec87f1e3-c13b-4100-b5f7-8b84d54260cb}
padbus 7 connect 030045e0e8d40000ea02000000007200 \?\HID#VID_045E&PID_02EA#6&two#{ec87f1e3-c13b-4100-b5f7-8b84d54260cb}
wait 30
padbus 6 button PAD_A 1;padbus 7 button PAD_A 1
wait 10
padlist
padbus 6 button PAD_A 0;padbus 7 button PAD_A 0
wait 10
echo "=== TEST 2: device 7 presses X alone (6 does not)"
padbus 7 button PAD_X 1
wait 20
padbus 7 button PAD_X 0
wait 10
padlist
echo "=== TEST 2: device 7 holds A, picks Guest: P2, once"
vstr hA7
wait 20
padbus 7 button PAD_A 1
wait 3
padbus 7 button PAD_A 0
wait 360
indepstatus
echo "=== TEST 3: devices 9 (no path) and 10 (no path, coordinator only); 9 holds A, picks Guest"
padbus 9 connect 0300c45bd2d40000c60e000000007200 -
padbus 10 connect 0300c45bd2d40000c60e000000007200 - coord
wait 30
vstr hA9
wait 20
padbus 9 button PAD_A 1
wait 3
padbus 9 button PAD_A 0
wait 360
indepstatus
padlist
echo "=== TEST 3: device 9 unplugged, plugged back (now after 10: a new order key)"
padbus 9 disconnect
wait 90
padbus 9 connect 0300c45bd2d40000c60e000000007200 -
wait 120
indepstatus
padlist
echo "=== TEST 3: device 9 taps LB (P3's window must see it)"
padbus 9 button PAD_LB 1
wait 3
padbus 9 button PAD_LB 0
wait 60
echo "=== TEST quit"
quit
