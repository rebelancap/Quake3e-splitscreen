// R14a: the right-stick cursor in the mod's menus is 1.25x cl_padCursorSpeed (cl_padModCursorScale).
// Main menu: corner, then 15 frames (0.25 s) at full push right (500 units/s x1.25 vs x1: the crosshair lands ~25 % further); again at scale 1.
//   PRE_ARGS=--noactivate scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r14a-cursor.cfg r14a-cursor - +set in_gamepad 0 +set developer 1 +set logfile 3
exec r10-keys.cfg
set com_maxfps 60
set cl_padCursorSpeed 500
padinject 0 connect xbox guid-pad0
wait 10
vstr k0up
wait 10
set cl_padModCursorScale 1.25
padinject 0 axis rx -1
padinject 0 axis ry -1
wait 90
padinject 0 axis ry 0
padinject 0 axis rx 1
wait 15
padinject 0 axis rx 0
wait 5
screenshotJPEG r14a-cursor-125
wait 5
set cl_padModCursorScale 1
padinject 0 axis rx -1
padinject 0 axis ry -1
wait 90
padinject 0 axis ry 0
padinject 0 axis rx 1
wait 15
padinject 0 axis rx 0
wait 5
screenshotJPEG r14a-cursor-100
wait 5
set cl_padModCursorScale 1.25
quit
