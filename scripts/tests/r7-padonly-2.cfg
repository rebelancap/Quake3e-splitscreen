// R7 item 4, part 2 (exec'd after the menu's spmap): play, pause, end game, main menu, EXIT -> YES quits.
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
wait 200
echo "=== TEST in game (single player q3dm1)"
splitplayers
screenshotJPEG r7-p-4-ingame
wait 5
echo "=== TEST play: run forward, turn, fire"
viewpos
padinject 0 axis ly -1
padinject 0 axis rx 0.6
padinject 0 axis rt 1
wait 60
padinject 0 axis ly 0
padinject 0 axis rx 0
padinject 0 axis rt 0
wait 10
viewpos
screenshotJPEG r7-p-5-played
wait 5
echo "=== TEST Start: pause overlay (full screen, P1 alone)"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 20
screenshotJPEG r7-p-6-pause
wait 5
echo "=== TEST up (End game), A, down, A: back to the main menu"
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
screenshotJPEG r7-p-7-endgame
wait 5
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 200
screenshotJPEG r7-p-8-back-at-main
wait 5
echo "=== TEST up from SINGLE PLAYER wraps to EXIT, A"
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 20
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 40
screenshotJPEG r7-p-9-exit-confirm
wait 5
echo "=== TEST left onto YES, A: the menu queues quit"
padinject 0 button PAD_DPAD_LEFT 1
wait 2
padinject 0 button PAD_DPAD_LEFT 0
wait 20
screenshotJPEG r7-p-10-yes
wait 5
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 30
set developer 0
echo "=== TEST script done; the menu's quit runs next (if the game is still running, the quit failed)"
