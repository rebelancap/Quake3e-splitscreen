// R13: player 2's window, part 2 (after its menu's spmap): its own match with a bot
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
wait 400
echo "=== TEST child: in its own match"
status
indepstatus
screenshotJPEG r13-c2-game
wait 5
echo "=== TEST child: play; aim assist (cl_aimAssistDebug 1 lines 'AA P1')"
set cl_aimAssistDebug 1
padinject 0 axis ly -1
padinject 0 axis rx 0.5
wait 60
padinject 0 axis rx 0
padinject 0 axis ly 0
wait 2
set cl_aimAssistDebug 0
padinject 0 axis rt 1
wait 30
padinject 0 axis rt 0
echo "=== TEST child: pause overlay has the Window volume row"
vstr k0st
wait 20
screenshotJPEG r13-c2-pause
wait 5
vstr k0st
wait 10
echo "=== TEST child: its own profile file is the only thing it writes"
profile_save 1
profile_list
echo "=== TEST child: R14b Server options page of its own match (pause page row 6)"
vstr k0st
wait 10
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 20
screenshotJPEG r13-c2-server
wait 5
set cl_splitSrvBots 3
vstr k0b
wait 300
srvdebug ps
set cl_splitSrvBots 0
wait 30
wait 400
