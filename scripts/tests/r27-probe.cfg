// R27 probe: raw UrT g_gear behaviour, set from the console (not the page): FFA, 2 local players with their own
// gear; SR-8 / knife / LR300 "only" letter lists, live (no change) and after both are killed; Default; map_restart.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r27-probe.cfg r27-probe ut4_casa +set g_gametype 0
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 2
set cl_splitSrvWaveRespawns 0
set cl_splitSrvGear default
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 150
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 200
team free
wait 30
vstr k0b
wait 50
p2 team free
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
wait 300
echo "=== TEST default gear"
srvdebug ps
echo "=== TEST SR8only: set g_gear FGHIJKLMNacefghijklmOPQ"
set g_gear "FGHIJKLMNacefghijklmOPQ"
wait 20
srvdebug ps
wait 150
srvdebug ps
echo "=== TEST SR8only: both kill"
kill
p2 kill
wait 100
wait 100
wait 100
wait 100
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST knifeonly: set g_gear FGHIJKLMNZacefghijklmOPQ"
set g_gear "FGHIJKLMNZacefghijklmOPQ"
wait 20
srvdebug ps
wait 150
srvdebug ps
echo "=== TEST knifeonly: both kill"
kill
p2 kill
wait 100
wait 100
wait 100
wait 100
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST LRonly: set g_gear FGHIJKMNZacefghijklmOPQ"
set g_gear "FGHIJKMNZacefghijklmOPQ"
wait 20
srvdebug ps
wait 150
srvdebug ps
echo "=== TEST LRonly: both kill"
kill
p2 kill
wait 100
wait 100
wait 100
wait 100
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST default: set g_gear "
set g_gear ""
wait 20
srvdebug ps
wait 150
srvdebug ps
echo "=== TEST default: both kill"
kill
p2 kill
wait 100
wait 100
wait 100
wait 100
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST map_restart with SR8 only"
set g_gear "FGHIJKLMNacefghijklmOPQ"
map_restart 0
wait 300
wait 300
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST end"
quit
