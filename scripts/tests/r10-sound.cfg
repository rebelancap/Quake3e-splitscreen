// R10: sound with 1 vs 8 local players on a busy map (6 bots, everyone firing): sound starts per frame
// (s_show 1), "played once" de-dups (printed while s_show is on) and active channels (s_show 2 'total').
// scripts/tests/r10-run.sh vk r10-sound.cfg sound q3dm17 ; scripts/tests/r10-sound-count.sh work/r10-vk-sound.log
set com_maxfps 60
set com_maxfpsUnfocused 60
set bot_nochat 1
addbot sarge 3
addbot grunt 3
addbot anarki 3
addbot bones 3
addbot doom 3
addbot hunter 3
wait 200
give all
wait 10
weapon 5
+attack
wait 60
echo "=== SOUND 1 player starts"
s_show 1
wait 120
echo "=== SOUND 1 player channels"
s_show 2
wait 60
s_show 0
-attack
addplayer 2
addplayer 3
addplayer 4
addplayer 5
addplayer 6
addplayer 7
addplayer 8
wait 600
p2 give all
p3 give all
p4 give all
p5 give all
p6 give all
p7 give all
p8 give all
wait 10
p2 weapon 8
p3 weapon 5
p4 weapon 8
p5 weapon 5
p6 weapon 8
p7 weapon 5
p8 weapon 8
+attack
p2 +attack
p3 +attack
p4 +attack
p5 +attack
p6 +attack
p7 +attack
p8 +attack
wait 60
echo "=== SOUND 8 players starts"
s_show 1
wait 120
echo "=== SOUND 8 players channels"
s_show 2
wait 60
s_show 0
echo "=== SOUND end"
quit
