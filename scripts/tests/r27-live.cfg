// R27: is the UrT Weapons row live? FFA, 2 local players; both walk and fire for ~3 s, then idle ~10 s (well past
// spawn), then Weapons = SR-8 only, Negev only, Pistols only, Default, each sampled without any respawn
// (srvdebug ps "ut slots"): no change (UrT re-gears on a userinfo update at most a player who has not moved since
// spawning, r27-urt); then Negev only and both killed: both spawn with the Negev. Evidence work/r27-live.log.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r27-live.cfg r27-live ut4_casa +set g_gametype 0
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 2
set cl_splitSrvWaveRespawns 0
set cl_splitSrvGear default
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 150
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 200
team free
wait 30
vstr k0b
wait 50
p2 team free
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
wait 300
echo "=== TEST default gear, then walk + fire"
srvdebug ps
padinject 0 axis ly -1
padinject 1 axis ly -1
padinject 0 axis rt 1
padinject 1 axis rt 1
wait 200
wait 200
padinject 0 axis ly 0
padinject 1 axis ly 0
padinject 0 axis rt 0
padinject 1 axis rt 0
srvdebug ps
wait 300
wait 300
wait 300
wait 300
echo "=== TEST SR-8 only, alive ~13 s after spawn, no respawn"
set cl_splitSrvGear sr8
wait 60
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST Negev only, no respawn"
set cl_splitSrvGear negev
wait 60
srvdebug ps
echo "=== TEST Pistols only, no respawn"
set cl_splitSrvGear pistols
wait 60
srvdebug ps
echo "=== TEST Default, no respawn"
set cl_splitSrvGear default
wait 60
srvdebug ps
echo "=== TEST Negev only, both kill"
set cl_splitSrvGear negev
wait 40
kill
p2 kill
wait 200
wait 200
srvdebug ps
set cl_splitSrvGear default
wait 40
echo "=== TEST end"
quit
