// R8: corrupted profile files load with defaults and warnings; odd names are sanitised; names differing only by case collide.
// scripts/tests/r8-robust-setup.sh; scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-robust.cfg r8-vk-robust q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
profile_list
echo "=== TEST addplayer 2 junk: warnings, defaults kept for the bad values, only the valid lines applied"
addplayer 2 junk
wait 300
p2 joy_yawSpeed
p2 joy_pitchSpeed
p2 joy_aimCurve
p2 joy_invertPitch
p2 joy_turnBoost
p2 joy_deadzone
pbindlist 2
p2 model
p2 color1
status
echo "=== TEST odd characters are sanitised (colour codes, symbols, 20 characters)"
profile_save 2 "^1B@d N*me!!   with spaces and a very long tail"
profile_list
echo "=== TEST names differing only by case collide; 'guest' and symbol-only names are refused"
profile_save 2 JUNK
profile_save 2 bd nme WITH spaces a
profile_save 2 guest
profile_save 2 "!!!"
profile_load 2 JuNk
echo "=== TEST addplayer 3 junk: in use by P2 -> P3 joins as Guest"
addplayer 3 junk
wait 300
status
profile_list
set developer 0
quit
