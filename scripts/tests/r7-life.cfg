// R7: lifecycle with overlays open: map_restart, vid_restart, dropplayer, pad unplug, map change.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r7-life.cfg r7-vk-life q3dm1 +set in_gamepad 0 +set developer 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
padinject 1 button PAD_A 1
wait 60
padinject 1 button PAD_A 0
wait 300
padinject 2 button PAD_A 1
wait 60
padinject 2 button PAD_A 0
wait 300
echo "=== TEST overlays open: P1 pause, P2 Controls, P3 capture prompt"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 6
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 6
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 10
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 10
padinject 2 button PAD_DPAD_DOWN 1
wait 2
padinject 2 button PAD_DPAD_DOWN 0
wait 6
padinject 2 button PAD_DPAD_DOWN 1
wait 2
padinject 2 button PAD_DPAD_DOWN 0
wait 6
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 10
padinject 2 button PAD_DPAD_UP 1
wait 2
padinject 2 button PAD_DPAD_UP 0
wait 6
padinject 2 button PAD_DPAD_UP 1
wait 2
padinject 2 button PAD_DPAD_UP 0
wait 6
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 10
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 10
screenshotJPEG r7-l-1-three-overlays
wait 5
echo "=== TEST map_restart 0"
map_restart 0
wait 200
splitplayers
screenshotJPEG r7-l-2-after-map_restart
wait 5
echo "=== TEST vid_restart"
vid_restart
wait 200
splitplayers
screenshotJPEG r7-l-3-after-vid_restart
wait 5
echo "=== TEST dropplayer 3 with its capture prompt up"
dropplayer 3
wait 100
splitplayers
echo "=== TEST P2 unplugs with its overlay open (holding d-pad down), plugs back"
padinject 1 button PAD_DPAD_DOWN 1
wait 30
padinject 1 disconnect
wait 30
padinject 1 connect xbox
wait 10
padlist
screenshotJPEG r7-l-4-p2-replugged
wait 5
echo "=== TEST map change with P1 and P2 overlays open"
devmap q3dm17
wait 400
splitplayers
screenshotJPEG r7-l-5-after-mapchange
wait 5
echo "=== TEST close both with Start; nothing stuck: P2 runs, then stands"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
p2 viewpos
padinject 1 axis ly -1
wait 40
padinject 1 axis ly 0
wait 30
p2 viewpos
wait 60
p2 viewpos
echo "=== TEST P1 viewpos stable (no stuck keys)"
viewpos
wait 60
viewpos
echo "=== TEST P1 End game -> main menu"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 6
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 6
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 200
splitplayers
screenshotJPEG r7-l-6-main-menu
wait 5
set developer 0
quit
