// R12 aim assist, baseq3/UrT local game: pad 0 = P1 (shooter), pad 1 = P2 (the target, its own assist off).
// scripts/tests/r12-run.sh q3 r12-aim.cfg aim q3dm7 +set r12home "setviewpos 1850 -1475 -128 80"
// UrT: scripts/tests/r12-run.sh urt r12-aim.cfg aim ut4_casa +set g_gametype 3 +set r12team1 "team red" +set r12team2 "p2 team blue"
// (r12team1 / r12team2: commands run after P1 claims its pad / after P2 joined)
// r12home: a command that puts P1 on open floor (run before each level), e.g. on q3dm7
// +set r12home "setviewpos 1850 -1475 -128 80"
// r12mate: a third player on P1's team placed in front of it (no target), see the UrT line in STATUS
// Each section places P2 in front of P1 (aimassist_testplace: P1 turns to face it, P2 is teleported
// with the cheat setviewpos and slides a little further away) and logs "AA P1 ..." every frame (cl_aimAssistDebug 1):
//   A<l> slowdown sweep: P1 turns across P2 with a fixed right stick (0.5 = 61.25 deg/s)
//   B<l> P2 strafes, P1 gives no input at all (rotational must be exactly 0)
//   C<l> P2 strafes, P1 holds a tiny look input (0.2 = 1.25 deg/s): rotational follows P2
//   D<l> P1 strafes itself (left stick), P2 stands: rotational from P1's own motion
//   E    flick (full right stick for 6 frames) while P2 strafes: rotation off ~150 ms
//   F    P2 behind a wall: candidate traced, no line of sight, nothing applied
//   G    P2 dead: no candidate
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
set cg_drawFPS 1
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 5
vstr k0y
wait 10
vstr r12team1
addplayer 2
wait 200
vstr k1y
wait 60
vstr r12team2
wait 30
set p2_joy_aimAssist 0
splitplayers
aimassist_ents
set cl_aimAssistDebug 1

set secA "aimassist_testplace 2 300 12;wait 60;echo === TEST A slowdown sweep;padinject 0 axis rx 0.5;wait 45;padinject 0 axis rx 0;wait 15"
set secB "aimassist_testplace 2 300 0;wait 60;echo === TEST B target strafes, P1 sticks idle;padinject 1 axis lx 1;wait 30;padinject 1 axis lx 0;wait 15"
set secC "aimassist_testplace 2 300 0;wait 60;echo === TEST C target strafes, P1 tiny look input;padinject 0 axis rx 0.2;padinject 1 axis lx 1;wait 45;padinject 1 axis lx 0;padinject 0 axis rx 0;wait 15"
set secDb "aimassist_testplace 2 300 0;wait 60;echo === TEST D P1 strafes (left), target still;padinject 0 axis lx -1;wait 20;padinject 0 axis lx 0;wait 15;set cl_aimAssistDebug 0;padinject 0 axis lx 1;wait 20;padinject 0 axis lx 0;wait 15;set cl_aimAssistDebug 1"

echo "=== LEVEL 0 (Off)"
set p1_joy_aimAssist 0
vstr r12home
wait 40
vstr secA
vstr secB
vstr secC
vstr secDb
echo "=== LEVEL 1 (Low)"
set p1_joy_aimAssist 1
vstr r12home
wait 40
vstr secA
vstr secB
vstr secC
vstr secDb
echo "=== LEVEL 2 (Standard)"
set p1_joy_aimAssist 2
vstr r12home
wait 40
vstr secA
vstr secB
vstr secC
vstr secDb

echo "=== TEST E flick (Standard)"
aimassist_testplace 2 300 0
wait 60
padinject 1 axis lx 1
wait 6
padinject 0 axis rx 1
wait 6
padinject 0 axis rx 0.2
wait 24
padinject 0 axis rx 0
padinject 1 axis lx 0
wait 15

echo "=== TEST F behind a wall (Standard)"
aimassist_testplace 2 0 0 wall
wait 60
padinject 0 axis rx 0.2
wait 20
padinject 0 axis rx 0
wait 10

echo "=== TEST screenshots: glyph + marker on the scoreboard"
aimassist_testplace 2 300 0
wait 60
set p2_joy_aimAssist 1
wait 30
screenshotJPEG r12-glyph
wait 5
padinject 0 button PAD_BACK 1
wait 10
screenshotJPEG r12-scores
wait 5
padinject 0 button PAD_BACK 0
wait 10
set p2_joy_aimAssist 0
set cl_aimAssistDebug 0

echo "=== TEST Controls row (local) and host row"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r12-controls-local
wait 5
vstr k0b
vstr k0b
wait 10
splitsettings
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r12-host
wait 5
echo "=== TEST host forbids: P1 Controls row greyed, no assist, marker gone"
set cl_aimAssistAllow 0
vstr k0b
wait 5
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 10
screenshotJPEG r12-controls-forbidden
wait 5
vstr k0b
vstr k0b
wait 10
set cl_aimAssistDebug 1
aimassist_testplace 2 300 0
wait 60
padinject 0 axis rx 0.2
padinject 1 axis lx 1
wait 15
padinject 0 axis rx 0
padinject 1 axis lx 0
set cl_aimAssistAllow 1
wait 30

echo "=== TEST T teammate in front (r12mate, team games)"
set cl_aimAssistDebug 1
vstr r12mate
set cl_aimAssistDebug 0
wait 10

echo "=== TEST G target dead"
p2 kill
wait 5
aimassist_ents
padinject 0 axis rx 0.2
wait 10
padinject 0 axis rx 0
set cl_aimAssistDebug 0
aimassist_stats
wait 10
quit
