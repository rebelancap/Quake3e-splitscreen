// R25: Warmup / Swap roles on the page (Urban Terror Team Survivor, 2 local players on opposite teams).
// The page with the selection on Round time (screenshot r25-page), then Warmup: right x2 = 5 s on the pad, Swap
// roles On from the console; while the page is open the game keeps g_warmup / g_swaproles (screenshot
// r25-page-warmup shows "On leaving: restarts the map (warmup)"); leaving restarts the map once with g_warmup 5
// and g_swaproles 1.  Round time 1, Max rounds 1: the match ends after 1 round, then (swap roles) the teams
// are swapped for the second half.  Then Warmup Off (g_warmup 0) and Swap roles Default, leave: restart
// without warmup.  Pad presses after the setup are written out (padinject lines), not vstr: UrT's cgame fills
// the command buffer and a late vstr is dropped (Cbuf_NestedAdd overflowed).
// Timestamps: games.log -> work/r25-warmup-games.log.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r25-warmup.cfg r25-warmup ut4_casa +set g_gametype 4
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 3
set cl_splitSrvWaveRespawns 0
set cl_splitSrvRoundTime 1
set cl_splitSrvMaxRounds 1
set cl_splitSrvSuddenDeath 0
set cl_splitSrvSwapRoles -1
set cl_splitSrvSpawnProtection -1
set cl_splitSrvWarmup -1
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
echo "=== TEST teams: P1 red, P2 blue"
team red
wait 30
vstr k0b
wait 50
p2 team blue
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
srvdebug ps
wait 100
srvdebug ps
wait 100
