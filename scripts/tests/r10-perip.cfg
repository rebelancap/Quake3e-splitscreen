// R10: 5 local players on our own listen server with sv_maxclientsPerIP 3 (the default): the pre-R10 exe
// refuses the 5th ("Too many connections."), R10 lets it in (127.x.x.x is exempt).
// EXE_DIR=work/r10-baseline scripts/tests/r10-run.sh vk r10-perip.cfg perip-before q3dm1 ; scripts/tests/r10-run.sh vk r10-perip.cfg perip q3dm1
set sv_maxclientsPerIP 3
addplayer 2
addplayer 3
addplayer 4
addplayer 5
wait 600
splitplayers
quit
