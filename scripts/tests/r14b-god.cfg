// R14b: god mode quick check (sub-part of r14b-ps.cfg): P1 rails P2 with god on, after P2's respawn, and off.
//   scripts/tests/r14b-run.sh r14b-god.cfg god q3dm7 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set p2respawn "p2 kill;wait 120;p2 +attack;wait 5;p2 -attack;wait 40"
set cl_splitSrvWeapons default
set cl_splitSrvInstagib 0
set cl_splitSrvSpawnWeapons all
set cl_splitSrvGod 0
set cl_splitSrvBots 0
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
kill
wait 120
+attack
wait 5
-attack
wait 40
echo "=== TEST god mode P2: P1 rails P2"
set cl_splitSrvGod 2
wait 30
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
centerview
wait 30
weapon 7
wait 60
srvdebug ps
+attack
wait 3
-attack
wait 30
srvdebug ps
screenshotJPEG r14b-god-rail
wait 5
echo "=== TEST god mode P2 after a respawn"
vstr p2respawn
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
wait 100
srvdebug ps
+attack
wait 3
-attack
wait 30
srvdebug ps
echo "=== TEST god mode off: rail hurts again"
set cl_splitSrvGod 0
wait 30
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
wait 100
srvdebug ps
+attack
wait 3
-attack
wait 30
srvdebug ps
screenshotJPEG r14b-god-off
wait 5
set cl_splitSrvSpawnWeapons mg
quit
