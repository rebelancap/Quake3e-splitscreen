// R28: upstream sync, no local server (r28-run.sh remote: dedicated baseq3 server on the LAN IP).
// P1 connects; P2 joins (P1's cgame restarts in place for the 2-player layout: collision map must stay,
// com_sv_running 0); P1 jumps (prediction traces the client collision map); P2 dropped: P1 must keep
// predicting/colliding for ~5 s (the map is cleared only with the last cgame); P2 again, vid_restart with
// both up (shutdown order: last cgame clears, then Hunk_Clear(h_low)), disconnect, vid_restart in the menu.
set com_maxfps 60
set com_maxfpsUnfocused 60
set rconPassword r9test
echo "=== TEST R28 connect P1"
vstr r9connect
wait 600
splitplayers
viewpos
echo "=== TEST R28 P2 joins (P1 cgame restarts in place)"
addplayer 2
wait 300
splitplayers
meminfo
echo "=== TEST R28 P1 jump with P2 up"
viewpos
+moveup
wait 12
viewpos
-moveup
wait 90
viewpos
echo "=== TEST R28 drop P2, P1 keeps going"
dropplayer 2
wait 60
splitplayers
viewpos
+moveup
wait 12
viewpos
-moveup
wait 90
viewpos
+forward
wait 60
-forward
viewpos
wait 90
viewpos
screenshotJPEG r28-remote-afterdrop
wait 5
echo "=== TEST R28 P2 again, vid_restart with two cgames"
addplayer 2
wait 300
splitplayers
vid_restart
wait 400
splitplayers
meminfo
viewpos
+moveup
wait 12
viewpos
-moveup
wait 90
viewpos
screenshotJPEG r28-remote-vid
wait 5
echo "=== TEST R28 disconnect"
disconnect
wait 120
echo "=== TEST R28 vid_restart in the menu"
vid_restart
wait 200
echo "=== TEST R28 end"
rcon status
quit
