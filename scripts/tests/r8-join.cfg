// R8: join-time profile picker, New profile on the on-screen keyboard, guests, greyed profile, pad pre-highlight.
// rm -rf work/q3home/profiles work/q3home/baseq3/profiles
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-join.cfg r8-vk-join q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
// 60 fps fixed (archived: remove com_maxfps* from q3config afterwards).
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect playstation guid-pad2
padinject 3 connect xbox guid-pad3
wait 10
echo "=== TEST pad 0 any button -> P1 as Guest (no profiles yet)"
vstr k0a
wait 10
profile_list
echo "=== TEST two profiles from the console; P1 ends up as Cleo"
profile_save 1 Bob
profile_save 1 Cleo
profile_list
echo "=== TEST pad 1 holds A -> held slot P2 + picker in its cell (Guest / Bob / Cleo greyed / New profile)"
vstr join1
wait 30
splitplayers
status
screenshotJPEG r8-j-1-picker
wait 5
echo "=== TEST up -> New profile..., A -> keyboard; type A (shift), d, a"
vstr k1up
vstr k1a
wait 10
vstr k1l3
vstr k1dn
vstr k1a
vstr k1l3
vstr k1rt
vstr k1rt
vstr k1a
wait 10
screenshotJPEG r8-j-2-keyboard
wait 5
vstr k1lf
vstr k1lf
vstr k1a
echo "=== TEST Start = done -> profile Ada created, P2 connects as Ada"
vstr k1st
wait 240
status
splitplayers
profile_list
screenshotJPEG r8-j-3-joined
wait 5
echo "=== TEST pad 2 and pad 3 join as guests (Guest is highlighted for a new pad: A)"
vstr join2
wait 20
vstr k2a
wait 240
vstr join3
wait 20
vstr k3a
wait 300
status
splitplayers
echo "=== TEST guests' look speeds are independent: P3 200, P4 default 320 (stick 0.75, standard curve)"
p3 joy_yawSpeed 200
set in_padDebug 2
padinject 2 axis rx 0.75
padinject 3 axis rx 0.75
wait 70
padinject 2 axis rx 0
padinject 3 axis rx 0
set in_padDebug 0
wait 10
p3 joy_yawSpeed
p4 joy_yawSpeed
echo "=== TEST P4 changes its speed to 500, leaves, rejoins as Guest -> back to 320"
p4 joy_yawSpeed 500
p4 joy_yawSpeed
dropplayer 4
wait 30
vstr join3
wait 20
vstr k3a
wait 300
p4 joy_yawSpeed
p3 joy_yawSpeed
echo "=== TEST pad 1 (Ada) leaves and rejoins: Ada pre-highlighted"
dropplayer 2
wait 30
vstr join1
wait 30
screenshotJPEG r8-j-4-prehighlight
wait 5
vstr k1a
wait 300
status
profile_list
screenshotJPEG r8-j-5-four
wait 5
set developer 0
quit
