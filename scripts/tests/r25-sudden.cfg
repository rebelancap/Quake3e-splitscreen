// R25: Sudden death On (Urban Terror Team Survivor, 2 local players on opposite teams): Round time 0.5 min (a console
// value below the page's 1 min minimum, fine within one map: UrT's game init would reset it to 3),
// Max rounds 2; rounds 1 and 2 are drawn (time up), so the tied match gets a third round, in which P2 dies
// (p2 kill) and red wins the match.  Timestamps: games.log -> work/r25-sudden-games.log.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r25-sudden.cfg r25-sudden ut4_casa +set g_gametype 4
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 3
set cl_splitSrvWaveRespawns 0
set cl_splitSrvRoundTime 0.5
set cl_splitSrvMaxRounds 2
set cl_splitSrvSuddenDeath 1
set cl_splitSrvSwapRoles -1
set cl_splitSrvSpawnProtection -1
set cl_splitSrvWarmup -1
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
echo "=== TEST teams: P1 red, P2 blue"
team red
wait 30
vstr k0b
wait 50
p2 team blue
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
srvdebug ps
echo "=== TEST rounds 1, 2 (drawn), 3"
