// R24: Urban Terror: the Server options page with the selection on Respawn time, then Wave respawns (screenshots),
// Reset to defaults; one player. Quake 3: r24-q3.cfg. Evidence renamed to work/r24-urtpage.log, r24-page.jpg, r24-page-wave.jpg.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r24-page.cfg r24-urtpage ut4_casa +set g_gametype 3
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 3
set cl_splitSrvWaveRespawns -1
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
vstr k0b
wait 30
echo "=== TEST respawn cvars"
srvdebug ps
echo "=== TEST page: selection on Respawn time"
serveroptions
wait 20
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 20
screenshotJPEG r18-r24-page-respawn
wait 10
echo "=== TEST Respawn time right x2 = 5 s (live while the page is open)"
vstr k0rt
vstr k0rt
wait 20
cl_splitSrvRespawnTime
srvdebug ps
vstr k0dn
wait 20
screenshotJPEG r18-r24-page-wave
wait 10
vstr k0rt
vstr k0rt
wait 20
echo "=== TEST Wave respawns right x2 = Off"
srvdebug ps
wait 10
echo "=== TEST Reset to defaults: Respawn time 3, Wave respawns Default"
vstr k0dn
vstr k0dn
vstr k0a
wait 20
cl_splitSrvRespawnTime
cl_splitSrvWaveRespawns
vstr k0b
wait 30
srvdebug ps
quit
