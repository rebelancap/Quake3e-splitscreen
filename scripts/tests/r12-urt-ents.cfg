// R12 UrT conventions probe: player entities (eType / eFlags / team) alive, dead, spectating.
// scripts/tests/r12-run.sh urt r12-urt-ents.cfg ents ut4_casa +set g_gametype 3 +set bot_enable 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 5
vstr k0y
wait 10
echo "=== TEST P1 spectator (before a team)"
aimassist_ents
team red
wait 30
vstr k0st
wait 10
addplayer 2
wait 200
vstr k1y
wait 60
echo "=== TEST P2 spectator"
aimassist_ents
p2 aimassist_ents
p2 team blue
wait 30
vstr k1b
wait 10
vstr k1b
wait 10
addbot boa 3 red
addbot cheetah 3 blue
wait 400
splitplayers
echo "=== TEST alive"
aimassist_ents
p2 aimassist_ents
screenshotJPEG r12-ents-alive
wait 5
echo "=== TEST P2 killed"
p2 kill
wait 2
aimassist_ents
wait 30
aimassist_ents
wait 120
aimassist_ents
p2 aimassist_ents
screenshotJPEG r12-ents-dead
wait 5
echo "=== TEST setviewpos"
setviewpos 0 0 0 0
wait 30
viewpos
p2 viewpos
aimassist_testplace 2 300 0
wait 60
aimassist_ents
quit
