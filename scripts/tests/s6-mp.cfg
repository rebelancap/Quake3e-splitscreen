// S6 with Team Arena's script-driven mouse menus (fs_game missionpack).
// GAME=missionpack scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe s6-mp.cfg s6-vk-mp q3dm1 +set fs_game missionpack +set in_gamepad 0 +set developer 1
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
padinject 1 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 300
splitplayers
echo "=== TEST P2 Start: Team Arena in-game menu in P2's cell"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 60
splitplayers
meminfo
screenshotJPEG s6-mp-1-p2menu
wait 5
echo "=== TEST P2 moves its cursor (right stick) onto Player"
padinject 1 axis rx 0.7
wait 52
padinject 1 axis rx 0
padinject 1 axis ry 0.7
wait 3
padinject 1 axis ry 0
wait 10
screenshotJPEG s6-mp-2-cursor
wait 5
echo "=== TEST P2 RT clicks Player"
padinject 1 axis rt 1
wait 2
padinject 1 axis rt 0
wait 60
screenshotJPEG s6-mp-3-click
wait 5
splitplayers
echo "=== TEST P1 Start: P1's Team Arena menu in its cell"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 60
screenshotJPEG s6-mp-4-p1menu
wait 5
set developer 0
quit
