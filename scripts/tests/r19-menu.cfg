// R19: backdrop off / on (cl_splitIndepBackdrop) with its log lines and the fullscreen-detection report,
// then the Session mode row: "Independent (experimental)" with its help line (coordinator started with
// --independent; the row is set to Independent, then back -- which switches to Together, as the row does).
//   scripts/tests/r19-run.sh r19-menu.cfg menu -
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST backdrop off and on again (cl_splitIndepBackdrop)"
set cl_splitIndepBackdrop 0
wait 30
set cl_splitIndepBackdrop 1
wait 150
echo "=== TEST Splitscreen settings, Session mode row selected"
splitsettings
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 20
screenshotJPEG r13-session-row
wait 5
echo "=== TEST the row set to Independent (experimental) (already this mode: no switch)"
vstr k0rt
wait 20
cl_splitIndependent
screenshotJPEG r13-session-indep
wait 5
echo "=== TEST back to Together from the console (the archived test setting is 0 again)"
vstr k0b
set cl_splitIndependent 0
wait 30
cl_splitIndependent
wait 30
echo "=== TEST quit"
quit
