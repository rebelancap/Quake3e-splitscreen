// R7: aim model measurements (design 14.4), per-player isolation, rebind isolation.
// rm work/q3home/baseq3/splitpads.cfg first (clean per-player settings), then
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r7-aim.cfg r7-vk-aim q3dm1 +set in_gamepad 0 +set developer 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
padinject 1 button PAD_A 1
wait 60
padinject 1 button PAD_A 0
wait 300
padinject 2 button PAD_A 1
wait 60
padinject 2 button PAD_A 0
wait 300
splitplayers
set in_padDebug 2
echo "=== TEST defaults: P2 and P3 identical (standard curve, 320 deg/s, boost 1.5x/250ms, zoom 0.5)"
echo "=== TEST curve table: turn boost off for P2 so 100% shows the bare curve"
p2 joy_turnBoost 1
p2 joy_aimCurve linear
echo "=== TEST P2 curve linear stick 0.25"
padinject 1 axis rx 0.25
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve linear stick 0.5"
padinject 1 axis rx 0.5
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve linear stick 0.75"
padinject 1 axis rx 0.75
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve linear stick 1"
padinject 1 axis rx 1
wait 75
padinject 1 axis rx 0
wait 10
p2 joy_aimCurve standard
echo "=== TEST P2 curve standard stick 0.25"
padinject 1 axis rx 0.25
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve standard stick 0.5"
padinject 1 axis rx 0.5
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve standard stick 0.75"
padinject 1 axis rx 0.75
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve standard stick 1"
padinject 1 axis rx 1
wait 75
padinject 1 axis rx 0
wait 10
p2 joy_aimCurve dynamic
echo "=== TEST P2 curve dynamic stick 0.25"
padinject 1 axis rx 0.25
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve dynamic stick 0.5"
padinject 1 axis rx 0.5
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve dynamic stick 0.75"
padinject 1 axis rx 0.75
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST P2 curve dynamic stick 1"
padinject 1 axis rx 1
wait 75
padinject 1 axis rx 0
wait 10
echo "=== TEST isolation: P2 and P3 push rx 0.75 together, P2 curve linear / speed 200, P3 untouched"
p2 joy_aimCurve linear
p2 joy_yawSpeed 200
padinject 1 axis rx 0.75
padinject 2 axis rx 0.75
wait 75
padinject 1 axis rx 0
padinject 2 axis rx 0
wait 10
echo "=== TEST invert: P2 joy_invertPitch 1, both push ry -0.75 (stick up): P2 pitch sign flips, P3 not"
p2 joy_invertPitch 1
padinject 1 axis ry -0.75
padinject 2 axis ry -0.75
wait 40
padinject 1 axis ry 0
padinject 2 axis ry 0
wait 10
p2 joy_invertPitch 0
p2 centerview
p3 centerview
echo "=== TEST turn boost ramp at 100% (P2 standard, boost 1.5x over 250 ms), per frame"
p2 joy_aimCurve standard
p2 joy_yawSpeed 320
p2 joy_turnBoost 1.5
set in_padDebug 3
padinject 1 axis rx 1
wait 30
padinject 1 axis rx 0
wait 10
echo "=== TEST release resets the boost: push again"
padinject 1 axis rx 1
wait 8
padinject 1 axis rx 0
set in_padDebug 2
wait 10
echo "=== TEST zoom: P2 holds LT (+zoom) while pushing rx 0.75; P3 pushes without zoom"
padinject 1 axis lt 1
wait 20
padinject 1 axis rx 0.75
padinject 2 axis rx 0.75
wait 75
screenshotJPEG r7-aim-1-p2-zoomed
wait 5
padinject 1 axis rx 0
padinject 2 axis rx 0
padinject 1 axis lt 0
wait 10
echo "=== TEST smoothing on: first frames ramp in"
p2 joy_aimSmooth 1
set in_padDebug 3
padinject 1 axis rx 0.75
wait 4
padinject 1 axis rx 0
wait 4
set in_padDebug 2
p2 joy_aimSmooth 0
echo "=== TEST viewpos check: P2 standard 320 boost 1.5 at rx 0.5 for 60 frames (~1 s): expected about 0.5^2... (m=0.4375) -> 61 deg"
set in_padDebug 0
p2 viewpos
padinject 1 axis rx 0.5
wait 60
padinject 1 axis rx 0
p2 viewpos
wait 10
echo "=== TEST rebind only affects P2: P2 rebinds Fire to X via the menu, then P2 and P3 press X"
set in_padDebug 1
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 5
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 5
padinject 1 button PAD_X 1
wait 2
padinject 1 button PAD_X 0
wait 5
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 1 button PAD_X 1
padinject 2 button PAD_X 1
wait 60
screenshotJPEG r7-aim-2-p2-fires-on-X
wait 5
padinject 1 button PAD_X 0
padinject 2 button PAD_X 0
wait 10
pbindlist 2
pbindlist 3
echo "=== TEST crouch toggle for P3: press B, release: still crouched (+movedown latched); press again: up"
p3 joy_crouchToggle 1
padinject 2 button PAD_B 1
wait 2
padinject 2 button PAD_B 0
wait 30
p3 viewpos
padinject 2 button PAD_B 1
wait 2
padinject 2 button PAD_B 0
wait 30
p3 viewpos
echo "=== TEST run/walk (P2): joy_alwaysRun 1 full stick runs, gentle push walks; joy_alwaysRun 0 full stick walks; +speed (L3) then runs"
set in_padDebug 2
p2 joy_alwaysRun 1
padinject 1 axis ly 1
wait 40
padinject 1 axis ly 0.4
wait 40
padinject 1 axis ly 0
wait 10
p2 joy_alwaysRun 0
padinject 1 axis ly 1
wait 40
padinject 1 button PAD_L3 1
wait 40
padinject 1 button PAD_L3 0
padinject 1 axis ly 0
wait 10
p2 joy_alwaysRun 1
set in_padDebug 0
set developer 0
quit
