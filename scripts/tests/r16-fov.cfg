// R16: Field of view: the maintainer's basepath autoexec.cfg sets cg_fov 115; pad players (P1 and P2, Guest)
// must see with joy_fov (default 90 = the game's own default), not 115.
//   scripts/tests/r16-run.sh r16-fov.cfg fov q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
echo "=== TEST before any pad: cg_fov from the configs"
cg_fov
joy_fov
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
echo "=== TEST pads in: P1 / P2 FOV"
cg_fov
p2_cg_fov
joy_fov
p1_joy_fov
p2_joy_fov
splitplayers
screenshotJPEG r16-fov-views
wait 5
quit
