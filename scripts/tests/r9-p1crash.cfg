// R9: player 1 plays as a profile and the game is killed (not quit): q3config holds the profile's name;
// the next start restores player 1's own name from profiles/_p1q3config.cfg.
// scripts/tests/s6-run.sh <exe> r9-p1crash.cfg r9-vk-p1crash q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 4  (killed by the caller),
// then grep q3config.cfg, then a plain start (r9-p1crash-b.cfg)
set com_maxfps 60
padinject 0 connect xbox guid-pad0
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
profile_load 1 alice
wait 120
writeconfig q3config.cfg
echo "=== P1 is alice; waiting to be killed"
wait 100000
