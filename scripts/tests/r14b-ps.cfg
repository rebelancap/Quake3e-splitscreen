// R14b: [ps] levers and the "now" rows: spawn weapons (all / gauntlet), infinite ammo, self-damage off
// (rocket at the floor: health kept, position moved), god mode for P2 (a rail from P1; again after a
// respawn), player health (handicap), bots by the page (added, difficulty re-adds, kept on a map change,
// Off kicks), friendly fire / gravity / volume rows by pad, saved sets (save "a" by the on-screen
// keyboard, select, delete).
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles work/q3test/baseq3/serversettings
//   scripts/tests/r14b-run.sh r14b-ps.cfg ps q3dm7 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set dn3 "vstr k0dn;vstr k0dn;vstr k0dn"
set dn5 "vstr k0dn;vstr k0dn;vstr k0dn;vstr k0dn;vstr k0dn"
set p2respawn "p2 kill;wait 120;p2 +attack;wait 5;p2 -attack;wait 40"
set p1respawn "kill;wait 120;+attack;wait 5;-attack;wait 40"
set cl_splitSrvWeapons default
set cl_splitSrvInstagib 0
set cl_splitSrvSpawnWeapons mg
set cl_splitSrvInfiniteAmmo 0
set cl_splitSrvSelfDamage 1
set cl_splitSrvGod 0
set cl_splitSrvHealth 0
set cl_splitSrvBots 0
set cl_splitSrvBotSkill 2
set g_friendlyFire 0
set g_gravity 800
set s_volume 0.6
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
srvdebug ps
echo "=== TEST spawn weapons: all (P2 respawns)"
set cl_splitSrvSpawnWeapons all
wait 5
vstr p2respawn
srvdebug ps
echo "=== TEST spawn weapons: gauntlet only (P2 respawns)"
set cl_splitSrvSpawnWeapons gauntlet
wait 5
vstr p2respawn
srvdebug ps
screenshotJPEG r14b-gauntlet-only
wait 5
echo "=== TEST spawn weapons: all for P1 (respawn)"
set cl_splitSrvSpawnWeapons all
wait 5
vstr p1respawn
echo "=== TEST infinite ammo off: P1 fires the machinegun 60 frames"
weapon 2
wait 30
srvdebug ps
+attack
wait 60
-attack
wait 5
srvdebug ps
echo "=== TEST infinite ammo on: P1 fires 60 frames"
set cl_splitSrvInfiniteAmmo 1
wait 5
+attack
wait 60
-attack
wait 5
srvdebug ps
set cl_splitSrvInfiniteAmmo 0
echo "=== TEST self-damage on (control): P1 rocket at the floor"
weapon 5
set cl_pitchspeed 400
+lookdown
wait 40
-lookdown
wait 40
srvdebug ps
+attack
wait 3
-attack
wait 12
echo "=== TEST (15 frames after the shot: in the air)"
srvdebug ps
wait 48
srvdebug ps
echo "=== TEST self-damage off: P1 rocket at the floor"
set cl_splitSrvSelfDamage 0
wait 150
srvdebug ps
+attack
wait 3
-attack
wait 12
echo "=== TEST (15 frames after the shot: in the air)"
srvdebug ps
wait 60
srvdebug ps
set cl_splitSrvSelfDamage 1
centerview
wait 10
echo "=== TEST god mode P2: P1 rails P2"
set cl_splitSrvGod 2
wait 30
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
centerview
wait 30
weapon 7
wait 60
srvdebug ps
+attack
wait 3
-attack
wait 30
srvdebug ps
screenshotJPEG r14b-god-rail
wait 5
echo "=== TEST god mode P2 after a respawn"
vstr p2respawn
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
centerview
wait 100
+attack
wait 3
-attack
wait 30
srvdebug ps
echo "=== TEST god mode off: rail hurts again"
set cl_splitSrvGod 0
wait 30
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
centerview
wait 100
+attack
wait 3
-attack
wait 30
srvdebug ps
echo "=== TEST player health 50"
set cl_splitSrvHealth 50
wait 60
vstr p2respawn
srvdebug ps
set cl_splitSrvHealth 0
wait 60
srvdebug ps
echo "=== TEST rows by pad: bots 2 (row 9)"
serveroptions
wait 5
vstr dn5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0rt
vstr k0rt
wait 200
srvdebug ps
screenshotJPEG r14b-bots-row
wait 5
echo "=== TEST difficulty (row 10) -> 3: bots re-added"
vstr k0dn
vstr k0rt
wait 200
srvdebug ps
echo "=== TEST friendly fire (11), gravity (15), volume (16) by pad"
vstr k0dn
vstr k0rt
vstr dn3
vstr k0dn
vstr k0rt
vstr k0dn
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
g_friendlyFire
g_gravity
s_volume
screenshotJPEG r14b-rows
wait 5
echo "=== TEST save set 'a' (row 19) by the keyboard"
vstr dn3
vstr k0a
wait 5
vstr k0dn
vstr k0a
vstr k0st
wait 10
screenshotJPEG r14b-saved
wait 5
echo "=== TEST change gravity, then select set 'a' (row 18)"
set g_gravity 800
vstr k0up
vstr k0a
wait 5
screenshotJPEG r14b-select
wait 5
vstr k0a
wait 5
g_gravity
cl_splitSrvSet
echo "=== TEST leave: no restart expected (bots kept)"
vstr k0b
wait 30
echo "=== TEST map change by the page: bots kept"
serveroptions
wait 5
set cl_splitSrvMap q3dm17
vstr k0b
wait 400
srvdebug ps
echo "=== TEST delete set 'a' (row 20)"
serveroptions
wait 5
vstr k0up
vstr k0a
wait 5
vstr k0a
wait 5
screenshotJPEG r14b-delete-confirm
wait 5
vstr k0dn
vstr k0a
wait 5
echo "=== TEST bots Off: kicked"
set cl_splitSrvBots 0
wait 60
srvdebug ps
vstr k0b
wait 10
set s_volume 0.6
set g_gravity 800
set g_friendlyFire 0
quit
