// M2 pads (virtual): run with "+set in_gamepad 0 +set developer 1" after
// "+devmap q3dm1 +wait 300 +exec m2-pads.cfg" (scripts/tests/m1-run.sh).
// in_gamepad 0 keeps the real/virtual SDL pads of this box out of the test;
// padinject drives the same code path as SDL.  developer 1 makes the extra
// players' cgame prints (viewpos) reach the log as "[P<N>]".
// Screenshots: <fs_homepath>\baseq3\screenshots\m2-*.jpg
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set in_padDebug 1
set cl_splitJoinHint 1
echo "=== TEST start: one player, no pads"
padlist
pbindlist 1
echo "=== TEST connect 4 virtual pads (xbox, playstation, nintendo, xbox)"
padinject 0 connect xbox
padinject 1 connect playstation
padinject 2 connect nintendo
padinject 3 connect xbox
wait 20
padlist
screenshotJPEG m2-hint-p1
wait 5
echo "=== TEST pad 0 presses A -> P1 (shares keyboard/mouse)"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
screenshotJPEG m2-hint-p2-cross
wait 5
echo "=== TEST pad 1 (playstation) presses Cross -> P2"
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 400
echo "=== TEST pad 2 (nintendo) hint says B"
screenshotJPEG m2-hint-p3-nintendo
wait 5
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 400
echo "=== TEST grid layout (3 players) puts the hint in the empty cell"
set cl_splitFill 0
wait 300
screenshotJPEG m2-hint-p4-emptycell
wait 5
set cl_splitFill 1
wait 300
echo "=== TEST pad 3 presses A -> P4"
padinject 3 button PAD_A 1
wait 2
padinject 3 button PAD_A 0
wait 500
splitplayers
padlist
screenshotJPEG m2-4p-joined
wait 5
echo "=== TEST positions before sticks"
viewpos
p2 viewpos
p3 viewpos
p4 viewpos
echo "=== TEST sticks: P1 forward, P2 turns right, P3 back + turns left, P4 strafes right + looks up"
padinject 0 axis ly -1
padinject 1 axis rx 1
padinject 2 axis ly 1
padinject 2 axis rx -0.6
padinject 3 axis lx 1
padinject 3 axis ry -1
wait 60
padinject 0 axis ly 0
padinject 1 axis rx 0
padinject 2 axis ly 0
padinject 2 axis rx 0
padinject 3 axis lx 0
padinject 3 axis ry 0
wait 60
echo "=== TEST positions after sticks"
viewpos
p2 viewpos
p3 viewpos
p4 viewpos
screenshotJPEG m2-4p-sticks
wait 5
echo "=== TEST RT (+attack) held by P3 only"
padinject 2 axis rt 1
wait 120
screenshotJPEG m2-4p-p3-fires
wait 5
padinject 2 axis rt 0
wait 60
screenshotJPEG m2-4p-after-fire
wait 5
echo "=== TEST pbind 2 PAD_X weapnext: only P2 switches weapon (P1's X stays +button3)"
give shotgun
p2 give shotgun
wait 100
pbind 2 PAD_X "weapnext"
pbindlist 2
padinject 1 button PAD_X 1
padinject 0 button PAD_X 1
wait 2
padinject 1 button PAD_X 0
padinject 0 button PAD_X 0
wait 100
screenshotJPEG m2-4p-p2-weapnext
wait 5
echo "=== TEST pad 1 disconnects while P2 runs, turns, fires -> P2 idles, nothing stuck"
padinject 1 axis ly -1
padinject 1 axis rx 0.8
padinject 1 axis rt 1
wait 30
p2 viewpos
padinject 1 disconnect
wait 60
padlist
p2 viewpos
wait 100
p2 viewpos
screenshotJPEG m2-p2-padlost
wait 5
echo "=== TEST pad 1 reconnects (same guid) -> P2 has control again"
padinject 1 connect playstation
wait 10
padlist
padinject 1 axis rx -1
padinject 1 axis ly -1
wait 40
padinject 1 axis rx 0
padinject 1 axis ly 0
wait 20
p2 viewpos
screenshotJPEG m2-p2-restored
wait 5
echo "=== TEST pad 3 (P4) disconnects; a different pad presses B -> takes over P4"
padinject 3 disconnect
wait 20
padinject 4 connect xbox other-guid-4
wait 10
screenshotJPEG m2-hint-p4-anybutton
wait 5
padinject 4 button PAD_B 1
wait 2
padinject 4 button PAD_B 0
wait 10
padlist
echo "=== TEST pad 2 (P3) holds Back+Start -> P3 leaves, others keep their slots"
padinject 2 button PAD_BACK 1
padinject 2 button PAD_START 1
wait 350
padinject 2 button PAD_BACK 0
padinject 2 button PAD_START 0
wait 300
splitplayers
padlist
screenshotJPEG m2-p3-left
wait 5
echo "=== TEST rejoin: pad 2 presses A -> P3 again (lowest free)"
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 500
splitplayers
screenshotJPEG m2-p3-rejoined
wait 5
echo "=== TEST dropplayer 4 frees pad 4"
dropplayer 4
wait 100
padlist
echo "=== TEST done"
set developer 0  // developer prints at shutdown reopen (truncate) qconsole.log
wait 5
quit
