// M1 lifecycle: run after "+devmap q3dm1 +wait 300 +exec m1-life.cfg"
// (needs cheats for splitdebug; 'map q3dm17' near the end turns them off)
addbot sarge 3
wait 100
set p2_name Alice
set p3_name Bob
set p4_name Carol
addplayer
wait 300
addplayer
wait 300
addplayer
wait 400
echo "=== TEST status: 4 humans with distinct names"
status
splitplayers
echo "=== TEST rename only P2 (p2_name)"
set p2_name Alicia
wait 150
status
echo "=== TEST rename only P3 via p3 prefix"
p3 name Bobby
wait 150
status
echo "=== TEST clientkick P3 (slot 3 on the server)"
clientkick 3
wait 300
splitplayers
screenshotJPEG m1-life-kicked3
wait 5
echo "=== TEST addplayer after kick -> P3"
addplayer
wait 400
splitplayers
echo "=== TEST dropplayer 2 with four players"
dropplayer 2
wait 300
status
splitplayers
screenshotJPEG m1-life-dropped2
wait 5
echo "=== TEST addplayer -> new player is P2"
addplayer
wait 400
status
splitplayers
echo "=== TEST forced error inside P3's cgame"
splitdebug error 3
wait 300
splitplayers
screenshotJPEG m1-life-error3
wait 5
addplayer
wait 400
echo "=== TEST forced error parsing P4's packet"
splitdebug packeterror 4
wait 300
splitplayers
addplayer
wait 400
echo "=== TEST timeout of P2 (link frozen, cl_timeout 5)"
set cl_timeout 5
splitdebug freeze 2
wait 1200
splitplayers
screenshotJPEG m1-life-timeout2
wait 5
set cl_timeout 200
addplayer
wait 400
splitplayers
echo "=== TEST sound: announcer on map_restart played once (s_show 1)"
set s_show 1
echo "=== TEST map_restart 0"
map_restart 0
wait 300
set s_show 0
splitplayers
screenshotJPEG m1-life-maprestart
wait 5
echo "=== TEST vid_restart"
vid_restart
wait 400
splitplayers
screenshotJPEG m1-life-vidrestart
wait 5
echo "=== TEST map q3dm17 with 4 players"
map q3dm17
wait 700
status
splitplayers
screenshotJPEG m1-life-q3dm17
wait 5
echo "=== TEST devmap q3dm7 with 4 players"
devmap q3dm7
wait 700
status
splitplayers
screenshotJPEG m1-life-q3dm7
wait 5
echo "=== TEST quit with 4 attached"
quit
