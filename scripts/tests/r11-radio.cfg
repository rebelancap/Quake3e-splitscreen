// R11 UrT: how the radio menu (ui_radio, drawn by UrT's cgame) takes its keys -- P1 (pad 0) vs P2 (pad 1).
// scripts/tests/r11-run.sh vk r11-radio.cfg radio ut4_casa +set in_padDebug 1 +set cl_splitP1Input pad
set com_maxfps 60
set sv_cheats 1
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 5
vstr k0y
wait 5
team red
wait 20
vstr k0st
wait 20
addplayer 2
wait 300
splitappend exec r11-radio-b.cfg
