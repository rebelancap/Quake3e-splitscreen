// R9 frame-time comparison (Sunshine caps presented fps at 120 on this box, so timedemo is useless):
// com_speeds 1 for 600 frames with 1 view, then with 4 views; average the "all:" / "rf:" / "bk:" columns.
// scripts/tests/s6-run.sh <exe> r9-perf.cfg r9-vk-perf-<build> q3dm17 +set in_gamepad 0 +set logfile 3 +set com_maxfps 0 +set r_swapInterval 0
set com_maxfps 0
set com_maxfpsUnfocused 0
wait 120
echo "=== PERF 1 view"
com_speeds 1
wait 600
com_speeds 0
addplayer 2
wait 300
addplayer 3
wait 300
addplayer 4
wait 400
echo "=== PERF 4 views"
com_speeds 1
wait 600
com_speeds 0
echo "=== PERF end"
quit
