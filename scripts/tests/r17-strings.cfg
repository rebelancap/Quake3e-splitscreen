// R17: Splitscreen settings: HUD shape "4:3 Centered", Menu size default 1.00x, 0.50 .. 1.50 by 0.25;
// Controls: percent values without a space ("95%").
//   scripts/tests/r17-run.sh r17-strings.cfg strings q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST Menu size default"
cl_splitMenuSize
splitsettings
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r17-strings-host
wait 5
echo "=== TEST Menu size left x3: stops at 0.50"
vstr k0dn
vstr k0lf
vstr k0lf
vstr k0lf
wait 10
cl_splitMenuSize
screenshotJPEG r17-strings-size050
wait 5
echo "=== TEST Menu size right x6: stops at 1.50"
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
wait 10
cl_splitMenuSize
screenshotJPEG r17-strings-size150
wait 5
vstr k0lf
vstr k0lf
wait 5
cl_splitMenuSize
vstr k0b
wait 10
echo "=== TEST Controls page (percent values)"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 10
screenshotJPEG r17-strings-controls
wait 5
vstr k0st
wait 10
quit
