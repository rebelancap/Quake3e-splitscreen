// R19b: Together mode (no --independent) on the test device bus: a second device with the same device path
// as an open one is skipped ("pad: skipped duplicate listing of <key>"); a different path opens as before.
//   R13_FLAGS=--noactivate scripts/tests/r19-run.sh r19b-together.cfg together -
set com_maxfps 60
set com_maxfpsUnfocused 60
padbus clear
wait 5
padbus 0 connect 0300f57bc82d00000a31000000007200 \?\HID#VID_2DC8&PID_310A&COL01#8&ccc&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 20
echo "=== TEST device 5: the same path as device 0; device 6: another path"
padbus 5 connect 0300f57bc82d00000a31000000007200 \?\HID#VID_2DC8&PID_310A&COL01#8&ccc&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
padbus 6 connect 0300f57bc82d00000a31000000007200 \?\HID#VID_2DC8&PID_310A&COL01#8&eee&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 30
padlist
indepstatus
echo "=== TEST quit"
quit
