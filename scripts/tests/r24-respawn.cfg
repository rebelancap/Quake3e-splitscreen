// R24: Respawn time / Wave respawns rows (Urban Terror TDM, 2 local players on opposite teams).
// P2 is killed (p2 kill) and srvdebug ps is sampled every 25 frames at 125 fps (~0.2 s; each sample
// prints the server time): pm 3 = dead, 0 = alive; spawn = PERS_SPAWN_COUNT. P2 never presses fire.
// Phases: the maintainer's server values (g_respawndelay 8, waves 1, 15 s) with Respawn time Default;
// Respawn time 3 (live) twice; Wave respawns Off; Respawn time Default with waves off (g_respawndelay 8 alone);
// the page itself: r24-page.cfg. Evidence: work/r24-urt.log (renamed from r18-r24-urt.log).
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r24-respawn.cfg r24-urt ut4_casa +set g_gametype 3
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 0
set cl_splitSrvWaveRespawns -1
set g_respawndelay 8
set g_waverespawns 1
set g_redwave 15
set g_bluewave 15
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
echo "=== TEST teams: P1 red, P2 blue"
team red
wait 30
vstr k0b
wait 50
p2 team blue
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
echo "=== TEST waiting for both to spawn (waves 15 s)"
srvdebug ps
wait 100
srvdebug ps
wait 100
srvdebug ps
wait 100
