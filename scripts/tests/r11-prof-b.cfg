// R11 profiles across mods, part B (UrT): "Ada" joins as P2 -- feel from the shared file, binds = UrT's defaults
// (no q3ut4/profiles/ada.cfg yet); a UrT bind change is saved to q3ut4/profiles/ada.cfg.
set com_maxfps 60
addplayer 2 Ada
wait 200
splitplayers
cvarlist g_gametype
p2 joy_yawSpeed
pbindlist 2
pbind 2 PAD_MISC1 "ut_weapdrop"
wait 150
quit
