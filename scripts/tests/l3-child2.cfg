// L3: player 2's window for r13-two.cfg on Linux = r13-child2.cfg with two changes: ~/dev/q3data has no
// q3key, so a fresh UI opens on the CD KEY page (the maintainer's Windows install has one): pad A on the key field
// moves to ACCEPT, A again = accept (empty key) -> main menu; and the cell is 1280x335 (the usable area
// 1280x670 halved) and the stick-timed route to FIGHT misses there, so after A = Single Player its
// match is started from the console (map q3dm1 + a bot), then r13-child2b.cfg unchanged.
exec r8-keys.cfg
wait 200
echo "=== TEST child: CD KEY page (no q3key in the test data): A (field -> ACCEPT), A = accept"
vstr k0a
wait 20
vstr k0a
wait 30
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_padCursorSpeed 500
echo "=== TEST child: an archived change (marker cl_splitMenuColor 0 1 0) must never reach q3config-ss.cfg"
set cl_splitMenuColor "0 1 0"
wait 240
indepstatus
padlist
name
screenshotJPEG r13-c2-menu
wait 5
echo "=== TEST child: Start at its main menu = its own-window page"
vstr k0st
wait 20
screenshotJPEG r13-c2-window
wait 5
vstr k0b
wait 20
echo "=== TEST child: A = Single Player"
vstr k0a
wait 60
wait 20
screenshotJPEG r13-c2-sp
wait 5
echo "=== TEST child (Linux): its own match from the console (the pad-only stick route to FIGHT is UI code verified on Windows; its frame timing depends on the cell size)"
vstr k0b
wait 20
set l3next "wait 100;addbot ranger 1;exec r13-child2b.cfg"
map q3dm1
vstr l3next
