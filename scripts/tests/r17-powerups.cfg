// R17: Server options row "Power-ups" (On / Off): Off removes every power-up and holdable from the
// map's entities (restart on leaving) and greys Quad damage; On brings them back.
//   scripts/tests/r17-run.sh r17-powerups.cfg powerups q3dm7 +set cl_splitSrvPowerups 1      (missionpack: GAME=missionpack ... +set fs_game missionpack)
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvSet ""
set cl_splitSrvInstagib 0
set cl_splitSrvWeapons default
set cl_splitSrvQuad 1
set cl_splitSrvPowerups 1
set g_gravity 800
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST map's own pickups"
srvdebug ents
echo "=== TEST Power-ups -> Off (9 up from the top: above Quad damage)"
serveroptions
wait 10
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0rt
wait 10
cl_splitSrvPowerups
screenshotJPEG r17-powerups-off
wait 5
vstr k0dn
wait 10
screenshotJPEG r17-powerups-quadgrey
wait 5
echo "=== TEST leave: one map_restart, no power-ups / holdables"
vstr k0b
wait 150
srvdebug ents
srvdebug ps
echo "=== TEST Power-ups -> On again (8 up: the greyed Quad row is skipped)"
serveroptions
wait 10
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0rt
wait 10
vstr k0b
wait 150
srvdebug ents
quit
