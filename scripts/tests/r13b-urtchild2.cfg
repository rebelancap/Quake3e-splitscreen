// R13b UrT: P2's window for r13b-hb.cfg (Urban Terror, its big ut4_turnpike) -- a map load, a 25 s stall saying "loading" (limit 120 s: survives),
// then a 20 s silent stall (limit 15 s: the coordinator closes this window).
set com_maxfps 60
set com_maxfpsUnfocused 60
wait 120
echo "=== TEST child: load a map in this window"
set r13bnext "wait 300;screenshotJPEG r13-c2-map;wait 5;exec r13b-hbchild2b.cfg"
devmap ut4_turnpike
vstr r13bnext
