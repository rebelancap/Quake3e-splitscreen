// R14a: pad X (and Y) in the stock server browser while it refreshes = SPACE (stops the refresh).
//   PRE_ARGS=--noactivate scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r14a-browser.cfg r14a-browser - +set in_gamepad 0 +set developer 1 +set logfile 3
exec r10-keys.cfg
set com_maxfps 60
set ui_browserMaster 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0up
wait 10
echo "=== TEST main menu: MULTIPLAYER -> the server browser (Local) starts refreshing (no LAN server: it keeps asking)"
vstr k0dn
vstr k0a
wait 120
screenshotJPEG r14a-browser-refreshing
wait 5
echo "=== TEST X: SPACE stops the refresh"
vstr k0x
wait 30
screenshotJPEG r14a-browser-stopped
wait 5
echo "=== TEST X again (not refreshing): nothing is sent"
vstr k0x
wait 10
quit
