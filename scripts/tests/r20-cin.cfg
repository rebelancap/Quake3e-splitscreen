// R20 items 3 + 6 (main menu, Together): the first-launch hint, then any pad button skips a cinematic.
//   scripts/tests/r17-run.sh r20-cin.cfg cin -        (Quake 3; UrT: scripts/tests/r18-run.sh urt r20-cin.cfg urtcin -)
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSeenHint 0
echo "=== TEST main menu, no pad: no first-launch hint"
wait 20
screenshotJPEG r17-cin-nopad
wait 5
padinject 0 connect xbox guid-pad0
padinject 1 connect playstation guid-pad1
wait 20
echo "=== TEST main menu, pads connected, cl_splitSeenHint 0: the hint"
screenshotJPEG r17-cin-hint
wait 5
echo "=== TEST cinematic idlogo.RoQ: pad 1 (not P1's) presses B -> skipped, main menu"
cinematic idlogo.RoQ
wait 40
screenshotJPEG r17-cin-playing
wait 5
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 10
screenshotJPEG r17-cin-skipped
wait 5
echo "=== TEST cinematic again: pad 0 holds A 1.5 s (the press skips it; no join, no menu key after)"
cinematic idlogo.RoQ
wait 40
padinject 0 button PAD_A 1
wait 90
padinject 0 button PAD_A 0
wait 10
splitplayers
padlist
screenshotJPEG r17-cin-skipped2
wait 5
echo "=== TEST cinematic: a stick does not skip, a trigger does"
cinematic idlogo.RoQ
wait 40
padinject 0 axis lx 1
wait 10
padinject 0 axis lx 0
wait 10
echo "(still playing? state follows)"
screenshotJPEG r17-cin-stick
wait 5
padinject 0 axis rt 1
wait 5
padinject 0 axis rt 0
wait 10
screenshotJPEG r17-cin-trigger
wait 5
echo "=== TEST first game starts: hint done"
map q3dm7
wait 300
cl_splitSeenHint
disconnect
wait 60
echo "=== TEST main menu again: no hint"
screenshotJPEG r17-cin-after
wait 5
quit
