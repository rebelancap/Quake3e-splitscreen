// R20 item 2 reference: Together, 2 players top/bottom in the 1280x720 window, P1 at the same spot as
// r20-aspect.cfg (P1's cell = the top 1280x360).
//   R13_PREFIX=r20 R13_FLAGS=--noactivate scripts/tests/r13-run.sh r20-aspect-tog.cfg together q3dm7
set com_maxfps 60
set com_maxfpsUnfocused 60
set cg_fov 90
set cg_drawGun 0
set p2_cg_drawGun 0
addplayer 2
wait 300
splitplayers
cl_splitAspect
setviewpos 1850 -1475 -128 80
wait 60
echo "=== TEST Together shot"
screenshotJPEG r13-tog
wait 5
quit
