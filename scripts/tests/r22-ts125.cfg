// R22 TS no bots, P1 blue, P2/P3 red (the maintainer's 1.0.0 session) at com_maxfps 125, cl_maxpackets 80, look up/down: extra local players float / end up on top of the map in UrT (1.0.0 report).
// Run: R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt <cfg> <name> ut4_casa +set g_gametype 4|0.
// sv_dbgThink / cl_dbgView were temporary debug prints (per server usercmd / per rendered view) in the R22 investigation build; without them the cfg still samples srvdebug ps.
// 3 pads: P1 pad 0, P2/P3 join by holding A; all walk forward and jump; server prints THINK lines (sv_dbgThink).
exec r10-keys.cfg
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_maxpackets 80
set cl_splitJoinHold 300
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
wait 20
vstr k0a
wait 120
vstr k0b
wait 40
team blue
wait 200
vstr join1
vstr k1a
wait 600
vstr join2
vstr k2a
wait 600
splitplayers
p2 team red
p3 team red
wait 600
splitplayers
vstr k0b
vstr k1b
vstr k2b
wait 120
splitplayers
wait 1200
splitplayers
echo "=== TEST waiting for the round"
srvdebug ps
set cl_dbgView 30
wait 600
srvdebug ps
wait 600
srvdebug ps
wait 600
echo "=== TEST spawned"
srvdebug ps
set sv_dbgThink 1
set cl_dbgView 20
padinject 0 axis ly -1
padinject 0 axis lx 0.0
padinject 0 axis ry 0.5
padinject 1 axis ly -1
padinject 1 axis lx 0.0
padinject 1 axis ry 0.5
padinject 2 axis ly -1
padinject 2 axis lx 0.0
padinject 2 axis ry 0.5
vstr k0a
vstr k1a
vstr k2a
wait 70
