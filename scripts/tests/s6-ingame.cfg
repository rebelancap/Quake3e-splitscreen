// S6: per-player menus in game, driven by virtual pads.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe s6-ingame.cfg s6-vk-ingame q3dm1 +set in_gamepad 0 +set developer 1
// Fixed 60 fps (focused or not) so right-stick cursor travel per 'wait' is predictable.
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set in_padDebug 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_padCursorSpeed 500
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 300
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 300
splitplayers
echo "=== TEST positions before (P1, P2, P3)"
viewpos
p2 viewpos
p3 viewpos
echo "=== TEST P2 presses Start: menu in P2's cell only"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
splitplayers
echo "=== TEST P1 and P3 run forward while P2's menu is open (P2 pushes its left stick too)"
padinject 0 axis ly -1
padinject 2 axis ly -1
padinject 1 axis ly -1
wait 90
screenshotJPEG s6-g-1-p2menu-others-move
padinject 0 axis ly 0
padinject 2 axis ly 0
padinject 1 axis ly 0
wait 10
echo "=== TEST positions after (P1, P3 moved; P2 still)"
viewpos
p2 viewpos
p3 viewpos
echo "=== TEST P2 d-pad: down x2 from START"
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 20
screenshotJPEG s6-g-2-p2-dpad
wait 5
echo "=== TEST P2 right stick down onto SERVER INFO, RT clicks it"
padinject 1 axis ry 0.7
wait 33
padinject 1 axis ry 0
wait 10
screenshotJPEG s6-g-3-p2-cursor
wait 5
padinject 1 axis rt 1
wait 2
padinject 1 axis rt 0
wait 30
screenshotJPEG s6-g-4-p2-clicked-serverinfo
wait 5
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 30
echo "=== TEST P3 opens its menu at the same time and moves its own cursor"
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 30
padinject 2 axis rx 0.7
padinject 2 axis ry 0.7
wait 40
padinject 2 axis rx 0
padinject 2 axis ry 0
wait 10
splitplayers
screenshotJPEG s6-g-5-two-menus
wait 5
echo "=== TEST P2 cursor up onto START, RT: team menu"
padinject 1 axis ry -0.7
wait 27
padinject 1 axis ry 0
wait 10
padinject 1 axis rt 1
wait 2
padinject 1 axis rt 0
wait 30
screenshotJPEG s6-g-6-p2-teammenu
wait 5
echo "=== TEST P2 cursor down onto SPECTATE, RT: only P2 spectates"
padinject 1 axis ry 0.7
wait 33
padinject 1 axis ry 0
wait 10
screenshotJPEG s6-g-7-p2-spectate-hover
wait 5
padinject 1 axis rt 1
wait 2
padinject 1 axis rt 0
wait 120
splitplayers
status
screenshotJPEG s6-g-8-p2-spectating
wait 5
echo "=== TEST P3 closes its menu with Start; P3 runs again, nothing stuck"
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 20
p3 viewpos
padinject 2 axis ly -1
wait 60
padinject 2 axis ly 0
wait 30
p3 viewpos
wait 60
p3 viewpos
splitplayers
echo "=== TEST P1 Start: player 1's menu in P1's cell"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 30
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 20
screenshotJPEG s6-g-9-p1-menu-in-cell
wait 5
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 20
echo "=== TEST P2 opens its menu, up x2 from START = LEAVE ARENA, A: only P2 leaves"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 20
screenshotJPEG s6-g-10-p2-leave-hover
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 200
splitplayers
status
screenshotJPEG s6-g-11-p2-left
wait 5
viewpos
p3 viewpos
padlist
set developer 0
quit
