// R14a: player 1 as Guest is "Player 1" (not q3config's name); a profile gives its name; back to Guest =
// "Player 1"; at quit q3config-ss.cfg keeps player 1's own name.
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles
//   PRE_ARGS=--noactivate scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r14a-guest.cfg r14a-guest q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
exec r8-keys.cfg
set com_maxfps 60
echo "=== TEST before a pad: q3config name"
name
padinject 0 connect xbox
wait 10
vstr k0a
wait 30
echo "=== TEST P1 claimed by a pad as Guest: Player 1"
name
model
splitplayers
profile_save 1 Zed
wait 10
echo "=== TEST P1 on profile Zed"
name
profile_load 1 guest
wait 10
echo "=== TEST P1 back to Guest: Player 1"
name
screenshotJPEG r14a-guest-p1
wait 5
quit
