// R8: cancel at the picker (B), pad unplugged in the picker and on the keyboard, map_restart / vid_restart /
// map change with a picker and with a keyboard open; the keyboard typing into a mod menu (hold Y).
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-life.cfg r8-vk-life q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
echo "=== TEST pad 1 hold -> picker; B cancels: slot and cell gone"
vstr join1
wait 30
screenshotJPEG r8-l-1-picker
wait 5
vstr k1b
wait 30
splitplayers
screenshotJPEG r8-l-2-cancelled
wait 5
echo "=== TEST picker, then the pad is unplugged -> join cancelled"
vstr join1
wait 30
padinject 1 disconnect
wait 30
splitplayers
padinject 1 connect xbox guid-pad1
wait 10
echo "=== TEST picker -> New profile keyboard, type q, unplug -> join cancelled"
vstr join1
wait 30
vstr k1up
vstr k1a
vstr k1a
wait 10
padinject 1 disconnect
wait 30
splitplayers
profile_list
padinject 1 connect xbox guid-pad1
wait 10
echo "=== TEST picker open through map_restart 0, vid_restart, devmap q3dm17; then A joins as Guest"
vstr join1
wait 30
map_restart 0
wait 120
splitplayers
vid_restart
wait 120
splitplayers
screenshotJPEG r8-l-3-picker-vidrestart
wait 5
devmap q3dm17
wait 300
splitplayers
screenshotJPEG r8-l-4-picker-newmap
wait 5
vstr k1a
wait 300
status
splitplayers
echo "=== TEST P2 keyboard open (Profile -> Keep my settings) through map_restart 0, vid_restart, devmap q3dm1; then B"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
vstr k1dn
vstr k1a
vstr k1a
wait 10
map_restart 0
wait 120
vid_restart
wait 120
devmap q3dm1
wait 300
splitplayers
screenshotJPEG r8-l-5-keyboard-newmap
wait 5
vstr k1b
wait 10
vstr k1st
wait 10
echo "=== TEST mod menu keyboard: Game menu, SETUP, PLAYER; right-stick cursor + RT on the name field; hold Y; type q w e (inserted at the field's caret); Start"
vstr k1st
vstr k1dn
vstr k1a
wait 30
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 20
vstr k1a
wait 20
padinject 1 axis rx -1
padinject 1 axis ry -1
wait 100
padinject 1 axis ry 0
padinject 1 axis rx 0.5
wait 144
padinject 1 axis rx 0
padinject 1 axis ry 0.5
wait 88
padinject 1 axis ry 0
wait 5
padinject 1 axis rt 1
wait 3
padinject 1 axis rt 0
wait 10
padinject 1 button PAD_Y 1
wait 40
padinject 1 button PAD_Y 0
wait 10
vstr k1a
vstr k1rt
vstr k1a
vstr k1rt
vstr k1a
wait 10
screenshotJPEG r8-l-6-modkeyboard
wait 5
vstr k1st
wait 10
vstr k1b
wait 30
p2 name
vstr k1b
vstr k1b
vstr k1b
wait 30
status
splitplayers
set developer 0
quit
