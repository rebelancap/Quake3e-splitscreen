// R9: r_fbo 1 + r_bloom 1 with 1 and 4 scenes per frame (both renderers). Bloom intensity raised so it shows.
// scripts/tests/s6-run.sh <exe> r9-bloom.cfg r9-<vk|gl>-bloom q3dm17 +set in_gamepad 0 +set developer 1 +set logfile 3 +set r_fbo 1 +set r_bloom 1 +set r_bloom_threshold 0.4 +set r_bloom_intensity 1.0
set com_maxfps 60
wait 60
screenshotJPEG r9-bloom-1p
wait 5
addplayer 2
wait 200
screenshotJPEG r9-bloom-2p
wait 5
addplayer 3
wait 200
addplayer 4
wait 200
screenshotJPEG r9-bloom-4p
wait 5
r_bloom
r_fbo
quit
