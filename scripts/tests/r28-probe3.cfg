// R28 probe: 3 players, scripted devmap, no layout toggles.  r18-run.sh q3 r28-probe3.cfg r28-probe3 q3dm1 +set r28map2 "devmap q3dm2"
set com_maxfps 60
set com_maxfpsUnfocused 60
addplayer 2
wait 150
addplayer 3
wait 300
screenshotJPEG r18-r28-p3-a
wait 5
vstr r28map2
wait 400
screenshotJPEG r18-r28-p3-b
wait 300
screenshotJPEG r18-r28-p3-c
wait 5
splitplayers
quit
