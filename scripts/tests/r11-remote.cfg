// R11: on a remote server (r11-remote.sh: dedicated baseq3 server, sv_maxclientsPerIP 3) the join
// hint gets a second line, and the 4th local player's refusal reads "Player 4 could not join: this
// server allows only 3 players from one connection" in its cell for 10 s plus one line for P1.
set com_maxfps 60
set com_maxfpsUnfocused 60
set rconPassword r9test
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
padinject 3 connect xbox guid-pad3
wait 5
vstr k0y
echo "=== TEST connect P1 to the remote server"
vstr r9connect
wait 600
echo "=== TEST pad 1 touched: join hint with the online line"
vstr k1b
wait 30
screenshotJPEG r11-remote-hint
wait 5
echo "=== TEST pads 1-3 join as Guests; the 4th player is refused"
vstr join1
vstr k1a
wait 200
vstr join2
vstr k2a
wait 200
vstr join3
vstr k3a
wait 60
screenshotJPEG r11-remote-refused-1s
wait 5
wait 360
screenshotJPEG r11-remote-refused-8s
wait 5
wait 240
screenshotJPEG r11-remote-refused-12s
wait 5
splitplayers
rcon status
quit
