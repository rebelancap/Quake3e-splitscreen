// R16: Bots up to 20: sv_maxclients raised (one restart), 20 bots added one at a time, hunk enough on q3dm7.
//   scripts/tests/r16-run.sh r16-bots.cfg bots q3dm7 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvBots 0
set cl_splitSrvBotSkill 2
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST bots 20 (sv_maxclients 16: restart for room)"
sv_maxclients
serveroptions
wait 5
set cl_splitSrvBots 20
wait 5
vstr k0b
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
wait 60
echo "=== TEST after 40 s (short waits: an addbot queued behind one long wait would sit there)"
sv_maxclients
cl_splitSrvBots
srvdebug ps
meminfo
screenshotJPEG r16-bots-20
wait 5
echo "=== TEST bots off"
serveroptions
wait 5
set cl_splitSrvBots 0
vstr k0b
wait 120
srvdebug ps
quit
