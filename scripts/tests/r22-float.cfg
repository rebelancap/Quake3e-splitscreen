// R22: extra local players float / end up on top of the map in UrT (1.0.0 report).
// Run: R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt <cfg> <name> ut4_casa +set g_gametype 4|0.
// sv_dbgThink / cl_dbgView were temporary debug prints (per server usercmd / per rendered view) in the R22 investigation build; without them the cfg still samples srvdebug ps.
// 3 pads: P1 pad 0, P2/P3 join by holding A; all walk forward and jump; server prints THINK lines (sv_dbgThink).
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
wait 10
vstr k0a
wait 60
vstr k0b
wait 20
team red
wait 100
vstr join1
vstr k1a
wait 300
vstr join2
vstr k2a
wait 300
splitplayers
p2 team red
p3 team red
wait 300
splitplayers
vstr k0b
vstr k1b
vstr k2b
wait 60
splitplayers
echo "=== TEST spawned"
srvdebug ps
set sv_dbgThink 1
padinject 0 axis ly -1
padinject 1 axis ly -1
padinject 2 axis ly -1
wait 60
srvdebug ps
vstr k0a
vstr k1a
vstr k2a
wait 60
srvdebug ps
vstr k0a
vstr k1a
vstr k2a
wait 60
srvdebug ps
padinject 0 axis lx 0.5
padinject 1 axis lx 0.5
padinject 2 axis lx 0.5
vstr k0a
vstr k1a
vstr k2a
wait 60
srvdebug ps
wait 60
srvdebug ps
padinject 0 axis ly 0
padinject 1 axis ly 0
padinject 2 axis ly 0
padinject 0 axis lx 0
padinject 1 axis lx 0
padinject 2 axis lx 0
wait 60
echo "=== TEST still"
srvdebug ps
set sv_dbgThink 2
wait 3
set sv_dbgThink 0
screenshot r18-r22-float
wait 10
quit
