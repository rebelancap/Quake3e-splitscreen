// R20 item 4: a Single Player arena (spmap, g_gametype 2) with an extra local player.
//   scripts/tests/r17-run.sh r20-sp.cfg sp -     (r17-run passes sv_maxclients 16; R20 runs it with 8 too)
set com_maxfps 60
set com_maxfpsUnfocused 60
echo "=== TEST spmap q3dm1 (Single Player arena)"
spmap q3dm1
wait 400
g_gametype
sv_maxclients
status
echo "=== TEST addplayer 2 in the arena"
addplayer 2
wait 600
splitplayers
status
screenshotJPEG r17-sp-2p
wait 5
quit
