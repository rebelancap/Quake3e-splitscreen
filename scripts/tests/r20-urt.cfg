// R20 items 5 + 6 in Urban Terror (main menu): map downloads on, libcurl built in; a pad skips UrT's intro video.
//   scripts/tests/r18-run.sh urt r20-urt.cfg r20-urt -     (backs up / restores work/urthome's configs)
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
echo "=== TEST downloads"
cl_allowDownload
cl_urtDownloadDefault
cl_autodownload
padinject 0 connect xbox guid-pad0
wait 20
echo "=== TEST cinematic idlogo.RoQ (UrT's intro video): pad 0 presses A -> skipped"
cinematic idlogo.RoQ
wait 40
screenshotJPEG r18-r20urt-playing
wait 5
vstr k0a
wait 10
screenshotJPEG r18-r20urt-skipped
wait 5
padlist
quit
