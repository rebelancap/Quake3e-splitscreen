// L3: Independent mode under (fake) Gamescope -- run with GAMESCOPE_WAYLAND_DISPLAY=x:
//   GAMESCOPE_WAYLAND_DISPLAY=x L3_FLAGS=--independent scripts/tests/l3-run.sh vk l3-gamescope.cfg gamescope -
// --independent must fall back to Together with a console line; the host page's Session mode row says
// unavailable; a pad hold at the main menu opens no window; setting the row to Independent stays Together.
exec r8-keys.cfg
set com_maxfps 60
padinject 0 connect xbox
wait 10
vstr k0a
wait 20
echo "=== TEST gamescope: --independent fell back (see the indep line at start)"
indepstatus
splitsettings
wait 20
screenshotJPEG r13-host-gamescope
wait 5
vstr k0b
wait 10
echo "=== TEST gamescope: pad 1 holds A at the main menu: no window"
padinject 1 connect xbox
wait 10
vstr join1
wait 30
indepstatus
echo "=== TEST gamescope: Session mode -> Independent from the console: stays Together"
set cl_splitIndependent 1
wait 30
indepstatus
cl_splitIndependent
set cl_splitIndependent 0
wait 10
quit
