// R10: 8 virtual pads join one after another (hold A, pick Guest), the 8th makes a new profile on
// the on-screen keyboard in a 4x2 cell; padlist with 8; P7's pause overlay / Controls / mod menu in a
// 320x360 cell; auto-heal of P6 with a replugged pad; dropplayer 4 + rejoin by pad.
// rm -rf work/q3home/profiles work/q3home/baseq3/profiles
// scripts/tests/r10-run.sh vk r10-pads.cfg pads q3dm7      (and: gl)
// Join timing: grep "in game .* ms after" in the log (slot = end of the A hold).
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set cl_splitFill 1
set cg_drawFPS 1
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect playstation guid-pad2
padinject 3 connect xbox guid-pad3
padinject 4 connect nintendo guid-pad4
padinject 5 connect xbox guid-pad5
padinject 6 connect xbox guid-pad6
padinject 7 connect playstation guid-pad7
wait 10
echo "=== TEST pad 0 -> P1"
vstr k0a
wait 10
echo "=== TEST pads 1..6 hold A and pick Guest, back to back"
vstr join1
vstr k1a
vstr join2
vstr k2a
vstr join3
vstr k3a
vstr join4
vstr k4a
vstr join5
vstr k5a
vstr join6
vstr k6a
wait 120
splitplayers
echo "=== TEST pad 7 holds A: its picker in its future 4x2 cell over the 7-player layout"
vstr join7
wait 20
screenshotJPEG r10-p-picker8
wait 5
echo "=== TEST pad 7: New profile... on the keyboard (Eve), Start joins"
vstr k7up
vstr k7a
wait 10
vstr k7dn
vstr k7dn
vstr k7rt
vstr k7rt
vstr k7rt
vstr k7rt
vstr k7a
wait 10
screenshotJPEG r10-p-keyboard8
wait 5
vstr k7st
wait 120
splitplayers
padlist
screenshotJPEG r10-p-8
wait 5
echo "=== TEST P7 (pad 6) pause overlay in its 320x360 cell"
vstr k6st
wait 10
screenshotJPEG r10-p-p7-pause
wait 5
vstr k6dn
vstr k6dn
vstr k6a
wait 10
screenshotJPEG r10-p-p7-controls
wait 5
vstr k6b
vstr k6up
vstr k6up
echo "=== TEST P7 Game menu (its own mod menu in its cell)"
vstr k6dn
vstr k6a
wait 30
splitplayers
screenshotJPEG r10-p-p7-modmenu
wait 5
vstr k6b
wait 10
splitplayers
echo "=== TEST auto-heal: pad 5 (P6) unplugged, another pad plugged in takes over P6"
padinject 5 disconnect
wait 20
padlist
padinject 5 connect xbox guid-pad5b
wait 10
vstr k5x
wait 10
padlist
echo "=== TEST dropplayer 4 at 8, pad 3 rejoins (its last profile = Guest)"
dropplayer 4
wait 60
vstr join3
vstr k3a
wait 120
splitplayers
padlist
screenshotJPEG r10-p-rejoin
wait 5
echo "=== TEST 3x3 grid (fill 0): P7 pause overlay and P8's keyboard (Profile -> Rename) in 426x240 cells"
set cl_splitFill 0
wait 120
vstr k6st
wait 10
vstr k7st
vstr k7dn
vstr k7dn
vstr k7dn
vstr k7a
vstr k7dn
vstr k7a
wait 10
screenshotJPEG r10-p-grid-menus
wait 5
vstr k7b
vstr k7b
vstr k7b
vstr k6b
wait 10
set cl_splitFill 1
wait 60
echo "=== TEST end"
quit
