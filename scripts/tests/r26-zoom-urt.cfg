// R26 Urban Terror: pad look speed follows the zoom.  P1 on a virtual pad, sniper rifle (SR-8, gear Z),
// right stick held at 0.5 per zoom level (LT = ut_zoomin steps, LB = ut_zoomreset); in_padDebug 2 prints
// "P1 aim: ... zoom <speed factor> (fov <cur>/<unzoomed> z <magnification> sens <Zoom sensitivity>, cgame scale <cgame's
// sensitivity scale>) -> yaw <deg/s>".  One Zoom sensitivity per run (wrappers r26-zoom-urt-100 / -200 / -25.cfg), then zoomed + killed.
// Short holds, one sensitivity per run: one long run (all three) overflowed the command buffer about a minute in (not traced).
// Run: R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r26-zoom-urt-100.cfg r26-zoom-urt-100 ut4_casa +set g_gametype 0
exec r10-keys.cfg
set com_maxfps 125
set gear "FZAAAAA"
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
vstr k0b
wait 20
team free
wait 300
kill
wait 300
wait 300
set in_padDebug 2
vstr r26setsens
p1_joy_zoomSens
echo "=== TEST unzoomed"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 30
echo "=== TEST zoom 1"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
screenshotJPEG r18-r26-urt-zoom1
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 30
echo "=== TEST zoom 2"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 30
echo "=== TEST zoom 3"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
padinject 0 button PAD_LB 1
wait 3
padinject 0 button PAD_LB 0
wait 30
echo "=== TEST reset"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
echo "=== TEST zoomed (2 steps) then killed: full speed after respawn"
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 30
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 30
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
kill
wait 300
wait 300
echo "=== TEST respawned"
padinject 0 axis rx 0.5
wait 90
padinject 0 axis rx 0
wait 5
set in_padDebug 0
quit
