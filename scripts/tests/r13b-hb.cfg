// R13b (review fixes): the coordinator side of the hang-clock and child-pad-loss checks.
//   R13_PREFIX=r13b R13_CHILDARGS="+set developer 1 +exec r13b-hbchild@@.cfg" sh scripts/tests/r13-run.sh r13b-hb.cfg hb q3dm7
// UrT (big map in the child): R13_PREFIX=r13b R13_BASE=<UrT43 dir> R13_HOME=<repo>/work/urthome R13_GAMEDIR=q3ut4
//   R13_CHILDARGS="+set developer 1 +exec r13b-urtchild@@.cfg" sh scripts/tests/r13-run.sh r13b-hb.cfg urt - +set fs_basegame q3ut4
// P2 joins (Guest); P2's pad is unplugged here (no lostPad, no heal), another pad presses
// buttons (no heal into P2), P2's pad comes back (P2's again, a join hold makes no new window).
// The child (r13b-hbchild2.cfg) loads a map, stalls 25 s saying "loading" (must survive), then
// stalls 20 s silent (must be closed after 15 s).
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
wait 10
vstr k0a
padinject 1 connect xbox
wait 10
vstr join1
wait 20
vstr k1a
wait 300
indepstatus
echo "=== TEST item 4: P2's pad is unplugged (seen by the coordinator)"
padinject 1 disconnect
wait 10
padlist
padinject 2 connect xbox
wait 10
echo "=== TEST item 4: another pad presses buttons: no heal into P2's slot"
vstr k2a
vstr k2b
vstr k2x
wait 10
padlist
indepstatus
echo "=== TEST item 4: P2's pad comes back: P2's again; a join hold on it makes no new window"
padinject 1 connect xbox
wait 10
vstr join1
wait 60
padlist
indepstatus
echo "=== TEST item 2: the coordinator keeps running while P2 loads / stalls (see its log)"
wait 1800
indepstatus
wait 1800
echo "=== TEST item 2: after the silent stall"
indepstatus
screenshotJPEG r13-coord
wait 5
quit
