// R8: a named profile keeps look speed, a rebind and the model chosen in the mod's menu across a restart.
// rm -rf work/q3home/profiles work/q3home/baseq3/profiles
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-persist-a.cfg r8-vk-persist-a q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
// then r8-persist-b.cfg in a new process.
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
echo "=== TEST pad 1 joins as Guest (P2), keeps it as profile Dan"
vstr join1
wait 20
vstr k1a
wait 300
profile_save 2 Dan
echo "=== TEST P2 overlay: Controls, look speed horizontal +3 (380)"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1a
vstr k1rt
vstr k1rt
vstr k1rt
echo "=== TEST Button bindings: Fire -> X (swaps with RT)"
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
vstr k1a
vstr k1x
wait 10
screenshotJPEG r8-p-1-rebind
wait 5
vstr k1st
wait 10
echo "=== TEST mod menu: Game menu -> SETUP -> PLAYER -> cursor to MODEL, RT; cursor to the first face, RT; B saves the model"
vstr k1st
vstr k1dn
vstr k1a
wait 30
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 20
vstr k1a
wait 20
padinject 1 axis rx 1
padinject 1 axis ry 1
wait 100
padinject 1 axis rx 0
padinject 1 axis ry 0
wait 5
padinject 1 axis rt 1
wait 3
padinject 1 axis rt 0
wait 30
padinject 1 axis rx -1
padinject 1 axis ry -1
wait 100
padinject 1 axis rx 0.5
padinject 1 axis ry 0.5
wait 30
padinject 1 axis rx 0
padinject 1 axis ry 0
wait 5
padinject 1 axis rt 1
wait 3
padinject 1 axis rt 0
wait 20
screenshotJPEG r8-p-2-model
wait 5
vstr k1b
wait 20
p2 model
p2 headmodel
vstr k1st
wait 120
p2 joy_yawSpeed
pbindlist 2
profile_list
status
set developer 0
quit
