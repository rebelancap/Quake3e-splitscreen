// R7: Game menu row (mod menu in the cell and back), host Splitscreen page changing layout/join live.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r7-host.cfg r7-vk-host q3dm1 +set in_gamepad 0 +set developer 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set cl_splitFill 1
set cl_splitWidePlayer 0
set cl_splitVertical 0
set cl_splitMaxPlayers 4
set cl_splitP1Input pad
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
padinject 1 button PAD_A 1
wait 60
padinject 1 button PAD_A 0
wait 300
padinject 2 button PAD_A 1
wait 60
padinject 2 button PAD_A 0
wait 300
splitplayers
echo "=== TEST P2: Start, down, A = Game menu -> the mod's in-game menu in P2's cell"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 6
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 30
splitplayers
screenshotJPEG r7-h-1-p2-gamemenu
wait 5
echo "=== TEST P2: B at the mod menu top level returns to play"
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 30
splitplayers
p2 viewpos
padinject 1 axis ly -1
wait 40
padinject 1 axis ly 0
wait 10
p2 viewpos
echo "=== TEST P1: Start, down, A = Game menu -> stock menu in P1 cell; Start closes"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 6
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 30
splitplayers
screenshotJPEG r7-h-2-p1-gamemenu
wait 5
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 20
splitplayers
echo "=== TEST P1 host page: Start, down x3, A"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 6
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
