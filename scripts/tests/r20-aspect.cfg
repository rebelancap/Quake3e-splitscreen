// R20 item 2: an Independent tile renders like the Together cell of the same size.  Coordinator script
// (Independent): a pad-less window for P2 (addplayer 2) makes this window the top 1280x360 tile;
// P1 stands at a fixed spot and takes a shot; the child (r20-achild2.cfg) loads the same map and spot.
//   R13_PREFIX=r20 R13_CHILDARGS="+set developer 1 +exec r20-achild@@.cfg" scripts/tests/r13-run.sh r20-aspect.cfg tile q3dm7
// Together reference (same spot, P1's cell = top 1280x360 of the window):
//   R13_PREFIX=r20 R13_FLAGS=--noactivate scripts/tests/r13-run.sh r20-aspect-tog.cfg together q3dm7
set com_maxfps 60
set com_maxfpsUnfocused 60
set cg_fov 90
set cg_drawGun 0
echo "=== TEST addplayer 2: P2's window, this window becomes the top tile"
addplayer 2
wait 400
indepstatus
cl_splitAspect
setviewpos 1850 -1475 -128 80
wait 60
echo "=== TEST P1 tile shot"
screenshotJPEG r13-p1
wait 5
wait 900
indepstatus
echo "=== TEST quit"
quit
