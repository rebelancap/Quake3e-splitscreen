// R13b item 1 (child command line): run with a ~200-char homepath and a ~7400-char cl_splitChildArgs:
//   scripts/tests/r13b-long.sh
// 1) P2 joins: the child's line would exceed MAX_CMDLINE_CHARS -> no window, a red message;
// 2) 40 extra "+" commands -> over MAX_CONSOLE_LINES -> no window, a red message;
// 3) normal child args: P2's window boots from the long homepath with net_port 27981.
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
wait 10
vstr k0a
padinject 1 connect xbox
wait 10
echo "=== TEST item 1: P2 joins with a long cl_splitChildArgs: no window, a loud message"
vstr join1
wait 20
vstr k1a
wait 60
indepstatus
echo "=== TEST item 1: 40 more + commands: no window, a loud message"
set cl_splitChildArgs "+set developer 1 +set r13b01 1 +set r13b02 1 +set r13b03 1 +set r13b04 1 +set r13b05 1 +set r13b06 1 +set r13b07 1 +set r13b08 1 +set r13b09 1 +set r13b10 1 +set r13b11 1 +set r13b12 1 +set r13b13 1 +set r13b14 1 +set r13b15 1 +set r13b16 1 +set r13b17 1 +set r13b18 1 +set r13b19 1 +set r13b20 1 +set r13b21 1 +set r13b22 1 +set r13b23 1 +set r13b24 1 +set r13b25 1 +set r13b26 1 +set r13b27 1 +set r13b28 1 +set r13b29 1 +set r13b30 1 +set r13b31 1 +set r13b32 1 +set r13b33 1 +set r13b34 1 +set r13b35 1 +set r13b36 1 +set r13b37 1 +set r13b38 1 +set r13b39 1 +set r13b40 1"
vstr join1
wait 20
vstr k1a
wait 60
indepstatus
echo "=== TEST item 1: normal child args, long homepath: P2's window boots"
set cl_splitChildArgs "+set developer 1 +exec r13b-longchild@@.cfg"
vstr join1
wait 20
vstr k1a
wait 400
indepstatus
fs_homepath
net_port
screenshotJPEG r13-coord
wait 5
quit
