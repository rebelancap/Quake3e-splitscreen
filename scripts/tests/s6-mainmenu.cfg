// S6 part 1: player 1's pad on the main menu (no game running).
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe s6-mainmenu.cfg s6-vk-mainmenu - +set in_gamepad 0 +set developer 1
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set in_padDebug 1
set com_maxfps 125
echo "=== TEST main menu, pad 0 joins as P1 with A"
padinject 0 connect xbox
wait 20
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 30
screenshotJPEG s6-main-0-start
wait 5
echo "=== TEST d-pad down x2 (selection moves)"
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 30
screenshotJPEG s6-main-1-dpad-down2
wait 5
echo "=== TEST A enters the submenu"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 60
screenshotJPEG s6-main-2-submenu
wait 5
echo "=== TEST B backs out"
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 60
screenshotJPEG s6-main-3-back
wait 5
echo "=== TEST left stick held down repeats"
padinject 0 axis ly 1
wait 60
padinject 0 axis ly 0
wait 20
screenshotJPEG s6-main-4-stick-repeat
wait 5
echo "=== TEST right stick to the top-left corner"
padinject 0 axis rx -1
padinject 0 axis ry -1
wait 200
padinject 0 axis rx 0
padinject 0 axis ry 0
wait 10
screenshotJPEG s6-main-5-cursor-corner
wait 5
echo "=== TEST right stick right/down (partial push)"
padinject 0 axis rx 0.7
wait 327
padinject 0 axis rx 0
padinject 0 axis ry 0.7
wait 191
padinject 0 axis ry 0
wait 10
screenshotJPEG s6-main-6-cursor-moved
wait 5
echo "=== TEST RT clicks the item under the cursor (Setup)"
padinject 0 axis rt 1
wait 2
padinject 0 axis rt 0
wait 60
screenshotJPEG s6-main-7-clicked
wait 5
padlist
set developer 0
quit
