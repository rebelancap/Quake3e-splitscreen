// R10 test helpers for 8 virtual pads: 'vstr k<pad><btn>' taps a button (2 frames down, 8 idle); 'vstr join<pad>' holds A 1 s at 60 fps.
// buttons: a b x y st(start) bk(back) up dn lf rt(d-pad)
set k0a "padinject 0 button PAD_A 1;wait 2;padinject 0 button PAD_A 0;wait 8"
set k0b "padinject 0 button PAD_B 1;wait 2;padinject 0 button PAD_B 0;wait 8"
set k0x "padinject 0 button PAD_X 1;wait 2;padinject 0 button PAD_X 0;wait 8"
