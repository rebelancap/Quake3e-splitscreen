set k0st "padinject 0 button PAD_START 1;wait 2;padinject 0 button PAD_START 0;wait 8"
set k0bk "padinject 0 button PAD_BACK 1;wait 2;padinject 0 button PAD_BACK 0;wait 8"
set k0up "padinject 0 button PAD_DPAD_UP 1;wait 2;padinject 0 button PAD_DPAD_UP 0;wait 8"
set k0dn "padinject 0 button PAD_DPAD_DOWN 1;wait 2;padinject 0 button PAD_DPAD_DOWN 0;wait 8"
