// R13: Session mode switched in place from the host setting (Together start, no --independent).
// Run: R13_FLAGS=--noactivate R13_CHILDARGS="+set developer 1 +exec r13-tchild4.cfg" scripts/tests/r13-run.sh r13-mode.cfg mode -
// (the child leaves by its own Exit game ~8 s after it starts)
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
wait 10
vstr k0a
wait 20
indepstatus
echo "=== TEST Session mode -> Independent at the main menu: switches now (nobody else plays)"
set cl_splitIndependent 1
wait 300
indepstatus
splitsettings
wait 20
screenshotJPEG r13-host-indep
wait 5
vstr k0b
wait 10
padinject 1 connect xbox
wait 10
vstr join1
wait 20
vstr k1a
wait 240
indepstatus
echo "=== TEST Session mode -> Together while P2's window is open: pending"
set cl_splitIndependent 0
wait 30
indepstatus
splitsettings
wait 20
screenshotJPEG r13-host-pending
wait 5
vstr k0b
wait 900
echo "=== TEST after P2's window closed: Together again"
indepstatus
wait 60
echo "=== TEST Together: pad 1 holding A at the main menu opens no window"
vstr join1
wait 30
indepstatus
quit
