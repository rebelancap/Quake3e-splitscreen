// R7: run B of the restart check (see r7-persist-a.cfg): the same values come back for P2, nothing for P3.
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
padinject 1 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
padinject 1 button PAD_A 1
wait 60
padinject 1 button PAD_A 0
wait 300
echo "=== TEST after restart"
p2 joy_yawSpeed
p2 joy_aimCurve
p2 joy_crouchToggle
pbindlist 2
set developer 0
quit
