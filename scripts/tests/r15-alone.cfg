// R15: the client exe alone in a folder without SDL2.dll (SDL2 linked in statically): SDL starts,
// padlist shows SDL, a virtual pad connects and joins as player 2, one screenshot, quit.
//   EXE_DIR=work/r15-alone scripts/tests/r10-run.sh vk r15-alone.cfg alone q3dm1 +set in_gamepad 1
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padlist
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 150
padlist
splitplayers
screenshotJPEG r10-alone
wait 5
quit
