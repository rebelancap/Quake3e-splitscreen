// R14b: instagib preset: railguns only on the map, rail-only spawn with infinite slugs, 100 health, one hit kills.
//   scripts/tests/r14b-run.sh r14b-instagib.cfg instagib q3dm7 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set cl_splitSrvWeapons default
set cl_splitSrvInstagib 0
set cl_splitSrvSpawnWeapons mg
set cl_splitSrvGod 0
set cl_splitSrvBots 0
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
echo "=== TEST instagib on: one restart"
serveroptions
wait 5
set cl_splitSrvInstagib 1
wait 5
screenshotJPEG r14b-instagib-page
wait 5
vstr k0b
wait 200
srvdebug ents
srvdebug ps
echo "=== TEST P1 rails P2 once"
p2 setviewpos 2048 -1572 -128 154
setviewpos 1850 -1475 -128 -26
centerview
wait 60
srvdebug ps
+attack
wait 3
-attack
wait 10
srvdebug ps
screenshotJPEG r14b-instagib-kill
wait 5
echo "=== TEST instagib off"
serveroptions
wait 5
set cl_splitSrvInstagib 0
vstr k0b
wait 120
srvdebug ents
quit
