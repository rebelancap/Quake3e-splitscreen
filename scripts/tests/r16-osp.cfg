// R16: a mod with its own instagib cvar (OSP: "match_instagib"): the Instagib row uses it ("Uses the game's
// own instagib"), leaving sets it and restarts once; our preset stays off; Weapons / Spawn / Ammo /
// Player health greyed while it is on.
//   GAME=osp scripts/tests/r16-run.sh r16-osp.cfg osp q3dm7 +set fs_game osp +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvInstagib 0
set cl_splitSrvWeapons default
set cl_splitSrvModInstagib 0
set cl_splitSrvHealth 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST OSP's instagib cvar"
match_instagib
cl_splitSrvModInstagib
srvdebug ps
echo "=== TEST page: Instagib row on the game's own cvar"
serveroptions
wait 10
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r16-osp-row
wait 5
vstr k0rt
wait 10
cl_splitSrvModInstagib
cl_splitSrvInstagib
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r16-osp-grey
wait 5
echo "=== TEST leave: instagib 1 + one restart"
vstr k0b
wait 300
match_instagib
sv_splitInstagib
srvdebug ents
srvdebug ps
screenshotJPEG r16-osp-instagib
wait 5
echo "=== TEST off again"
serveroptions
wait 10
cl_splitSrvModInstagib
set cl_splitSrvModInstagib 0
vstr k0b
wait 300
match_instagib
srvdebug ps
quit
