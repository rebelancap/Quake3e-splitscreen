// R13 2 windows: the coordinator plays q3dm7 with bots; pad 1 holds A -> picker (Guest / Ada) -> Ada ->
// P2's own window (r13-child2.cfg drives it: pad-only to its own single-player match).
// Setup: work/q3home/profiles/ada.cfg = name "Ada".  Run:
//   scripts/tests/r13-run.sh r13-two.cfg two q3dm7          (R13_GL=1 for OpenGL)
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
addbot sarge 2
addbot grunt 2
wait 100
padinject 0 connect xbox
wait 10
vstr k0a
wait 20
padinject 1 connect xbox
wait 10
echo "=== TEST pad 1 holds A in game: the picker in the coordinator, then P2's window"
vstr join1
wait 20
screenshotJPEG r13-picker
wait 5
vstr k1dn
wait 10
screenshotJPEG r13-picker-ada
wait 5
vstr k1a
wait 200
indepstatus
profile_list
echo "=== TEST the coordinator keeps playing its match: P1 runs and turns"
viewpos
padinject 0 axis ly -1
padinject 0 axis rx 0.4
wait 90
padinject 0 axis ly 0
padinject 0 axis rx 0
wait 5
viewpos
screenshotJPEG r13-coord-play
wait 5
echo "=== TEST pad 1 in the coordinator is inert now (its window owns it): A, Start, sticks do nothing here"
vstr k1a
vstr k1st
padinject 1 axis ly -1
wait 30
padinject 1 axis ly 0
splitplayers
wait 2400
echo "=== TEST later: both games still run"
indepstatus
viewpos
status
screenshotJPEG r13-coord-late
wait 5
echo "=== TEST quit: P2's window closes with us"
quit
