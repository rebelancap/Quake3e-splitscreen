// R8: live profile switch (name, binds, feel; nothing stuck), greyed profile, Rename, Save as new (Guest), Delete, host Guest defaults.
// rm -rf work/q3home/profiles work/q3home/baseq3/profiles
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-switch.cfg r8-vk-switch q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
padinject 3 connect xbox guid-pad3
wait 10
vstr k0a
echo "=== TEST P2 joins as Guest, becomes Eve: look speed 500, Y fires"
vstr join1
wait 20
vstr k1a
wait 300
profile_save 2 Eve
p2 joy_yawSpeed 500
pbind 2 PAD_Y +attack
wait 90
status
echo "=== TEST live switch while P2 holds Y (firing): profile_load 2 guest -> Player 2, Y back to +button2, speed 320, fire released"
set in_padDebug 1
padinject 1 button PAD_Y 1
wait 20
profile_load 2 guest
wait 20
padinject 1 button PAD_Y 0
set in_padDebug 0
wait 30
status
p2 joy_yawSpeed
pbind 2 PAD_Y
echo "=== TEST switch back to Eve in the overlay: Start, Profile, Switch profile, Eve"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
vstr k1a
vstr k1dn
wait 5
screenshotJPEG r8-s-1-switch
wait 5
vstr k1a
wait 30
status
p2 joy_yawSpeed
pbind 2 PAD_Y
screenshotJPEG r8-s-2-profile-page
wait 5
echo "=== TEST pad 2 joins: Eve greyed (player 2)"
vstr join2
wait 30
screenshotJPEG r8-s-3-greyed
wait 5
vstr k2a
wait 300
echo "=== TEST P2 Rename (on its Profile page): Eve -> Ivy"
vstr k1a
wait 10
vstr k1x
vstr k1x
vstr k1x
vstr k1l3
vstr k1rt
vstr k1rt
vstr k1rt
vstr k1rt
vstr k1rt
vstr k1rt
vstr k1rt
vstr k1a
vstr k1l3
vstr k1dn
vstr k1dn
vstr k1lf
vstr k1lf
vstr k1lf
vstr k1lf
vstr k1a
vstr k1up
vstr k1up
vstr k1rt
vstr k1rt
vstr k1a
wait 5
screenshotJPEG r8-s-4-rename
wait 5
vstr k1st
wait 20
vstr k1st
wait 30
status
profile_list
echo "=== TEST P3 (Guest) sets speed 250, Save as new (keep my settings): Max"
p3 joy_yawSpeed 250
vstr k2st
vstr k2dn
vstr k2dn
vstr k2dn
vstr k2a
vstr k2dn
vstr k2a
wait 10
vstr k2l3
vstr k2dn
vstr k2dn
vstr k2rt
vstr k2rt
vstr k2rt
vstr k2rt
vstr k2rt
vstr k2rt
vstr k2a
vstr k2l3
vstr k2up
vstr k2lf
vstr k2lf
vstr k2lf
vstr k2lf
vstr k2lf
vstr k2lf
vstr k2a
vstr k2dn
vstr k2rt
vstr k2a
vstr k2st
wait 30
screenshotJPEG r8-s-5-saved
wait 5
status
profile_list
echo "=== TEST console delete of Ivy (in use by P2) is refused"
profile_delete Ivy
echo "=== TEST P3 deletes Max (its own) on its Profile page -> P3 goes on as Guest"
vstr k2dn
vstr k2a
wait 10
screenshotJPEG r8-s-6-deletelist
wait 5
vstr k2a
vstr k2dn
vstr k2a
wait 30
vstr k2st
wait 20
