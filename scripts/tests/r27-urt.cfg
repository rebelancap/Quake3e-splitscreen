// R27: Urban Terror Weapons row (g_gear): FFA, 2 local players (P1 gear GZJORAA = DE / SR-8 / UMP45 / HE / vest,
// P2 GLAORWA = DE / LR300 / - / HE / vest / helmet). The page: selection on Weapons, left x8 = SR-8 only (screenshot
// r27-weapons); g_gear held while the page is open, set when it is left (UrT may re-gear a player who has not moved
// since spawning at once, not always with the restriction); both killed: both spawn with the SR-8 (+ knife); Knives only; Default. Extra weapons in a
// sample are ground pickups of weapons dropped by earlier deaths (the home's games.log "Item:" lines).
// Then r27-urt2.cfg runs every other value. UrT weapon ids (srvdebug ps "ut slots", slot:id): 1 knife, 2 Beretta,
// 3 DE, 4 SPAS, 5 MP5K, 6 UMP45, 7 HK69, 8 LR300, 9 G36, 10 PSG-1, 11 HE, 12 flash, 13 smoke, 14 SR-8, 15 AK-103,
// 17 Negev, 19 M4, 20 Glock, 21 Colt, 22 MAC-11, 23 FR-F1, 24 Benelli, 25 P90, 26 Magnum.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r27-urt.cfg r27-urt ut4_casa +set g_gametype 0
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 2
set cl_splitSrvWaveRespawns 0
set cl_splitSrvGear default
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 150
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 200
team free
wait 30
vstr k0b
wait 50
p2 team free
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
wait 300
echo "=== TEST default gear"
srvdebug ps
echo "=== TEST page: selection on Weapons, left x8"
serveroptions
wait 20
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
vstr k0lf
vstr k0lf
vstr k0lf
vstr k0lf
vstr k0lf
vstr k0lf
vstr k0lf
vstr k0lf
wait 30
cl_splitSrvGear
echo "=== TEST page open: g_gear not changed yet (held until the page is left)"
srvdebug ps
screenshotJPEG r18-r27-weapons
wait 10
vstr k0b
wait 10
vstr k0b
wait 30
echo "=== TEST SR-8 only, before any respawn"
srvdebug ps
echo "=== TEST SR-8 only: both kill"
kill
p2 kill
wait 200
wait 200
srvdebug ps
wait 100
srvdebug ps
echo "=== TEST Knives only"
set cl_splitSrvGear knife
wait 40
echo "=== TEST Knives only: both kill"
kill
p2 kill
wait 200
wait 200
srvdebug ps
echo "=== TEST Default"
set cl_splitSrvGear default
wait 40
echo "=== TEST Default: both kill"
kill
p2 kill
wait 200
wait 200
srvdebug ps
exec r27-urt2.cfg
