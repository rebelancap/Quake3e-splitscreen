// R11 S5: UrT 4.3 on stock-path Quake3e, one keyboard player: main menu, map list, devmap, bots.
// scripts/tests/r11-run.sh vk r11-boot.cfg boot - +set bot_enable 1 +set cl_splitP1Input kbm    (and: gl)
set com_maxfps 60
screenshotJPEG r11-menu
wait 5
dir maps bsp
fs_referencedList
meminfo
devmap ut4_casa
wait 400
team red
wait 30
addbot boa 3 blue
addbot cheetah 3 red
addbot penguin 3 blue
wait 600
screenshotJPEG r11-casa
wait 5
status
meminfo
quit
