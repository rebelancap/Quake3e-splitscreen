// R23 round-start check (the maintainer's 2026-10-09 sequence): FFA with 3 players, map load into TS, P1 blue and spawned,
// P2/P3 red 2 s later (spectating until the round starts), then all move and jump for ~30 s; P1 kill -> second round, again.
// devmap: splitdebug cursor (the team / gear menu clicks) needs cheats.
// Run: R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urtauto r23-round.cfg <name> -
// R23: before 1.0.0.1, P2/P3's own view stayed on its pre-spawn spot (their cgame never re-read the server's player state); srvdebug ps samples the server side.
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set rtclick2 "padinject 2 axis rt 1;wait 3;padinject 2 axis rt 0;wait 10"
