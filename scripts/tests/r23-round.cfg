set g_gametype 0
devmap ut4_casa
wait 100
wait 100
wait 100
wait 100
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox 0300f57bc82d00000a31000000007200
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
wait 100
padinject 2 button PAD_A 1
wait 100
wait 50
padinject 2 button PAD_A 0
wait 40
vstr k2a
wait 100
wait 100
wait 100
wait 100
wait 100
wait 100
