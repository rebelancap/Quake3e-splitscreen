// R9: extra local players on a remote (dedicated, LAN-IP) server, design 4.3 / M4-T1/T2.
// Run with scripts/tests/r9-remote.sh (starts quake3e-ss.ded.x64.exe on <lan ip>:27970 with sv_pure 1, rconpassword r9test).
// Client: main menu start, connect, extras join one at a time; the 4th is refused by sv_maxclientsPerIP 3;
// then the cap is raised over rcon, map rotation, clientkick of one extra, killserver with 4 attached, reconnect.
set com_maxfps 60
set com_maxfpsUnfocused 60
set rconPassword r9test
echo "=== TEST connect P1 to the remote server"
vstr r9connect
wait 600
status
splitplayers
echo "=== TEST three extras at once (serialized); the 4th player is refused (sv_maxclientsPerIP 3)"
addplayer
addplayer
addplayer
wait 90
screenshotJPEG r9-remote-1-refused-1
wait 5
wait 90
screenshotJPEG r9-remote-1-refused-2
wait 5
wait 90
screenshotJPEG r9-remote-1-refused-3
wait 5
wait 90
screenshotJPEG r9-remote-1-refused-4
wait 5
wait 90
screenshotJPEG r9-remote-1-refused-5
wait 5
wait 90
screenshotJPEG r9-remote-1-refused-6
wait 5
splitplayers
rcon status
wait 30
echo "=== TEST sv_maxclientsPerIP 8 -> the 4th joins"
rcon sv_maxclientsPerIP 8
wait 30
addplayer
wait 300
splitplayers
rcon status
screenshotJPEG r9-remote-2-four
wait 5
echo "=== TEST pure server: every player's pak checksums (server log: no 'Unpure client')"
p2 cmd score
wait 30
echo "=== TEST server map rotation with 4 attached (rcon map q3dm7)"
rcon map q3dm7
wait 900
splitplayers
rcon status
screenshotJPEG r9-remote-3-mapchange
wait 5
echo "=== TEST clientkick of one extra (client 2)"
rcon clientkick 2
wait 60
screenshotJPEG r9-remote-4-kicked
wait 5
splitplayers
wait 300
echo "=== TEST it joins again"
addplayer
wait 300
splitplayers
rcon status
echo "=== TEST killserver with 4 attached -> main menu, no ERR_DROP cascade"
// the server's disconnect clears the command buffer: the rest runs from cl_splitTestOnDisconnect
set r9after1 "wait 300;splitplayers;screenshotJPEG r9-remote-5-killserver;wait 5;echo === TEST server back - r9-remote.sh restarts it - reconnect, extras join again;wait 600;vstr r9connect;wait 900;vstr r9after2"
set r9after2 "addplayer;addplayer;addplayer;wait 900;splitplayers;rcon status;screenshotJPEG r9-remote-6-reconnect;wait 5;echo === TEST end - quit (r9-remote.sh stops the server);quit"
set cl_splitTestOnDisconnect "vstr r9after1"
rcon killserver
wait 600
echo "=== FAIL still here after killserver"
quit
