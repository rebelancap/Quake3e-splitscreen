// R11 UrT: 4 players driven by virtual pads 0-3 (pad 0 = P1).  Each extra player's cgame pops
// its own team menu in its cell; P2/P3/P4 pick teams and gear there; P3 uses UrT pad binds
// (reload, sprint, radio menu, quick radio); lifecycle with 4 attached; meminfo.
// scripts/tests/r11-run.sh vk r11-4p.cfg 4p ut4_casa +set in_padDebug 1      (and: gl)
// Continues in r11-4p-b.cfg / -c.cfg (commands a cgame queues while a script waits run only
// after the script's remaining text, so each part ends with 'splitappend exec <next>').
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
set cg_drawFPS 1
exec r10-keys.cfg
set rtclick0 "padinject 0 axis rt 1;wait 3;padinject 0 axis rt 0;wait 10"
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set rtclick2 "padinject 2 axis rt 1;wait 3;padinject 2 axis rt 0;wait 10"
set rtclick3 "padinject 3 axis rt 1;wait 3;padinject 3 axis rt 0;wait 10"
echo "=== TEST meminfo 1 player"
meminfo
echo "=== TEST pad 0 takes P1; P1 red by command; Start closes P1's menu"
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect playstation guid-pad2
padinject 3 connect xbox guid-pad3
wait 5
vstr k0y
wait 10
team red
wait 30
vstr k0st
wait 30
echo "=== TEST players 2-4 join (addplayer); pads 1-3 take them over"
addplayer 2
wait 200
addplayer 3
wait 200
addplayer 4
wait 300
splitappend exec r11-4p-b.cfg
