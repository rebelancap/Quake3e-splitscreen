// R25: Round time / Max rounds (Urban Terror Team Survivor, 2 local players on opposite teams, nobody fires).
// Round time 1 min at the start; ~10 s into round 1 it goes to 0.5 min (a console value, quicker than the page's
// 1 min minimum; it holds within a map, UrT's game init resets g_roundtime below 1 to 3): round 1 still lasts 1 min (the game
// reads g_roundtime when a round starts: "Next round"), round 2 lasts 30 s; Max rounds 2 with Sudden death Off:
// two drawn rounds end the match.  Spawn protection 5 s (the cvar).  Timestamps: the home's games.log
// (InitRound / SurvivorWinner), copied to work/r25-round-games.log.  srvdebug ps samples ~every 0.8 s.
//   R18_URTHOME=<repo>/work/urttest scripts/tests/r18-run.sh urt r25-round.cfg r25-round ut4_casa +set g_gametype 4
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvRespawnTime 3
set cl_splitSrvWaveRespawns 0
set cl_splitSrvRoundTime 1
set cl_splitSrvMaxRounds 2
set cl_splitSrvSuddenDeath 0
set cl_splitSrvSwapRoles -1
set cl_splitSrvSpawnProtection 5
set cl_splitSrvWarmup -1
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
echo "=== TEST teams: P1 red, P2 blue"
team red
wait 30
vstr k0b
wait 50
p2 team blue
wait 60
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
srvdebug ps
echo "=== TEST round 1 (warmup first, then a 1 min round)"
