// S6 lifecycle with menus open, hunk use over 20 open/close cycles, forced ui error.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe s6-life.cfg s6-vk-life q3dm1 +set in_gamepad 0 +set developer 1
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 300
padinject 2 button PAD_A 1
wait 2
padinject 2 button PAD_A 0
wait 300
echo "=== TEST hunk before any extra menu"
meminfo
echo "=== TEST open/close P2's menu 20 times (Start / Start)"
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
echo "=== TEST hunk after 5 cycles"
meminfo
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
exec s6-cycle.cfg
echo "=== TEST hunk after 20 cycles"
meminfo
echo "=== TEST map_restart 0 with P2 and P3 menus open"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 30
splitplayers
map_restart 0
wait 200
splitplayers
screenshotJPEG s6-life-1-maprestart
wait 5
echo "=== TEST vid_restart with P2's menu open"
splitplayers
vid_restart
wait 300
splitplayers
screenshotJPEG s6-life-2-vidrestart
wait 5
echo "=== TEST P2 opens again after vid_restart (new instance)"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
splitplayers
screenshotJPEG s6-life-3-reopen
wait 5
echo "=== TEST forced error inside P2's menu: only P2's menu closes"
splitdebug uierror 2
wait 30
splitplayers
p2 viewpos
padinject 1 axis ly -1
wait 40
padinject 1 axis ly 0
wait 10
p2 viewpos
screenshotJPEG s6-life-4-uierror
wait 5
echo "=== TEST P2 Start after the failure: refused until the next level"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 20
splitplayers
echo "=== TEST P3 menu open, its pad unplugged and plugged back"
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 30
padinject 2 axis rt 1
wait 2
padinject 2 disconnect
wait 30
splitplayers
padinject 2 connect xbox virtual-pad-2
wait 10
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 20
splitplayers
echo "=== TEST dropplayer 3 with its menu open"
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 30
dropplayer 3
wait 30
splitplayers
screenshotJPEG s6-life-5-dropplayer
wait 5
echo "=== TEST map q3dm17 with P2's menu open (P2 failed earlier: new level resets)"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
splitplayers
devmap q3dm17
wait 400
splitplayers
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
splitplayers
screenshotJPEG s6-life-6-q3dm17-p2menu
wait 5
meminfo
echo "=== TEST map change with P2's menu open"
devmap q3dm7
wait 400
splitplayers
screenshotJPEG s6-life-7-q3dm7
wait 5
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 30
splitplayers
set developer 0
quit
