// R21: connect to the local "UrT server" (r21-dl.sh), which runs a map this home lacks;
// the client must download it over HTTP from sv_dlURL, reconnect by itself (the engine
// queues "connect" at the end of the command buffer) and join.  r21-dl2.cfg is appended
// behind that queued connect.
set com_maxfps 60
set com_maxfpsUnfocused 60
echo "=== TEST before connect"
cl_allowDownload
cl_autodownload
logfile
vstr r21connect
wait 120
screenshotJPEG r21-during
wait 5
wait 600
echo "=== TEST download done; r21-dl2.cfg runs after the engine's own reconnect"
splitappend exec r21-dl2.cfg
