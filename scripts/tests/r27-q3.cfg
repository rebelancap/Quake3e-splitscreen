// R27: Quake 3 (baseq3) regression: the Weapons row still rewrites weapon entities (unchanged by the UrT Weapons
// values): Default, then "Railguns only" with the page open, leaving it restarts the map once (srvdebug ents
// counts weapon_railgun only), back to Default (restart, the map's own weapons). Screenshot r27-q3-page (Weapons row).
//   scripts/tests/r18-run.sh q3 r27-q3.cfg r27-q3 q3dm7   (evidence renamed to work/r27-q3.log, r27-q3-page.jpg)
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvSet ""
set cl_splitSrvWeapons default
set cl_splitSrvInstagib 0
set cl_splitSrvGear sr8
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST default (cl_splitSrvGear sr8 is ignored outside UrT)"
srvdebug ents
srvdebug ps
echo "=== TEST page: Weapons = Railguns only, leave"
serveroptions
wait 20
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
set cl_splitSrvWeapons railgun
wait 20
screenshotJPEG r18-r27-q3-page
wait 10
vstr k0b
wait 10
vstr k0b
wait 120
srvdebug ents
echo "=== TEST back to Default"
serveroptions
wait 5
set cl_splitSrvWeapons default
vstr k0b
wait 10
vstr k0b
wait 120
srvdebug ents
echo "=== TEST end"
quit
