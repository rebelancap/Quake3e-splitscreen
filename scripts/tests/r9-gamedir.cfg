// R9: profiles re-read when the mod changes (game_restart): player 1 on a profile with a per-mod button.
// (from the main menu: game_restart while a level runs crashes upstream Quake3e too, see STATUS)
// scripts/tests/s6-run.sh <exe> r9-gamedir.cfg r9-vk-gamedir - +set in_gamepad 0 +set developer 1 +set logfile 3
set com_maxfps 60
padinject 0 connect xbox guid-pad0
wait 10
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
profile_load 1 alice
p1 joy_yawSpeed 345
pbind 1 PAD_Y "+attack"
wait 120
pbindlist 1
echo "=== TEST game_restart missionpack"
game_restart missionpack
wait 300
echo "=== after game_restart"
pbindlist 1
p1 joy_yawSpeed
name
pbind 1 PAD_Y "+button2"
wait 120
echo "=== TEST game_restart baseq3"
game_restart baseq3
wait 300
pbindlist 1
p1 joy_yawSpeed
quit
