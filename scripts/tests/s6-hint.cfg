// S6 part 3: join hint only for pads that were used (mode 1), timed hint (mode 2).
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe s6-hint.cfg s6-vk-hint q3dm1 +set in_gamepad 0 +set developer 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHint 1
echo "=== TEST three idle pads connected (like ViGEm / receivers): no hint"
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect xbox
padinject 0 axis lx 0.1
wait 60
screenshotJPEG s6-hint-1-idle
wait 5
echo "=== TEST pad 1 presses B (not the join button): hint appears"
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 30
screenshotJPEG s6-hint-2-pressed
wait 5
echo "=== TEST 12 s idle: hint gone"
wait 720
screenshotJPEG s6-hint-3-idle12s
wait 5
echo "=== TEST pad 1 presses B again, then A: joins as P1, hint gone"
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 20
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 30
screenshotJPEG s6-hint-4-joined
wait 5
echo "=== TEST mode 2: timed hint for 10 s after the level starts"
set cl_splitJoinHint 2
devmap q3dm1
wait 200
screenshotJPEG s6-hint-5-mode2-start
wait 5
wait 600
screenshotJPEG s6-hint-6-mode2-after
wait 5
set cl_splitJoinHint 1
set developer 0
quit
