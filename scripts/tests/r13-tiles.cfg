// R13 tiling: the coordinator at its main menu; pads 1-3 join (Guest) -> 2, 3, 4 windows; cl_splitWidePlayer;
// P4 picks Exit game in its own window; P3 is killed (taskkill, by r13-tiles.sh); quit closes P2.
// Children run r13-tchild<N>.cfg.  Run: scripts/tests/r13-tiles.sh
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox
wait 10
vstr k0a
wait 20
padinject 1 connect xbox
padinject 2 connect xbox
padinject 3 connect xbox
wait 10
echo "=== TEST 2 windows (pad 1 joins as Guest)"
vstr join1
wait 20
vstr k1a
wait 360
indepstatus
echo "=== TEST 3 windows: 2 on top, the last joined (P3) wide below"
vstr join2
wait 20
vstr k2a
wait 360
indepstatus
screenshotJPEG r13-3win
wait 5
echo "=== TEST cl_splitWidePlayer 2: P2 takes the wide bottom window"
set cl_splitWidePlayer 2
wait 360
indepstatus
set cl_splitWidePlayer 0
wait 360
echo "=== TEST 4 windows: 2x2 (P4's script leaves by its own Exit game ~15 s after it starts)"
vstr join3
wait 20
vstr k3a
wait 300
indepstatus
screenshotJPEG r13-4win
wait 5
echo "=== TEST pad 3 (P4's) in the coordinator does nothing while P4's window runs"
vstr k3a
vstr k3st
padlist
wait 900
echo "=== TEST after P4's Exit game: 3 windows"
indepstatus
wait 60
echo "=== TEST taskkill P3"
wait 400
echo "=== TEST after the taskkill: 2 windows"
indepstatus
padlist
echo "=== TEST pad 2 (P3's, freed) holds A again: picker; B cancels (no window)"
vstr join2
wait 20
indepstatus
vstr k2b
wait 20
indepstatus
echo "=== TEST quit: P2's window closes with us"
quit
