// R16: Server options page, new rows (Quad damage, Player speed, Weapon respawn), Reset to defaults
// (every row back, map kept), instagib greying (Weapons / Spawn / Ammo / Player health) and no
// handicap while instagib is on; Quad off removes item_quad.
//   scripts/tests/r16-run.sh r16-page.cfg page q3dm7 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvSet ""
set cl_splitSrvInstagib 0
set cl_splitSrvWeapons default
set cl_splitSrvSpawnWeapons mg
set cl_splitSrvInfiniteAmmo 0
set cl_splitSrvBots 0
set cl_splitSrvGod 0
set cl_splitSrvHealth 0
set cl_splitSrvQuad 1
set cl_splitSrvSpeed 100
set cl_splitSrvWeaponRespawn 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST game defaults"
g_speed
g_weaponrespawn
g_weaponTeamRespawn
srvdebug ents
echo "=== TEST page bottom: the new rows (selection on Player speed)"
serveroptions
wait 10
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 10
screenshotJPEG r16-page-speed
wait 5
echo "=== TEST Player speed right x5 = 150 % (live while the page is open)"
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
wait 10
cl_splitSrvSpeed
g_speed
echo "=== TEST Weapon respawn right x10 = 10 s (live)"
vstr k0dn
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
wait 10
cl_splitSrvWeaponRespawn
g_weaponrespawn
g_weaponTeamRespawn
echo "=== TEST Quad damage -> Off: pending restart"
vstr k0up
vstr k0up
vstr k0rt
wait 10
cl_splitSrvQuad
screenshotJPEG r16-page-quad
wait 5
echo "=== TEST leave: one map_restart, item_quad gone"
vstr k0b
wait 120
srvdebug ents
srvdebug ps
g_speed
echo "=== TEST instagib on: Weapons / Spawn / Ammo / Player health greyed (health 50 set first)"
serveroptions
wait 5
set cl_splitSrvHealth 50
wait 10
vstr k0b
wait 60
srvdebug ps
serveroptions
wait 5
set cl_splitSrvInstagib 1
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r16-instagib-grey
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r16-instagib-grey2
wait 5
vstr k0b
wait 200
echo "=== TEST instagib applied: no handicap"
srvdebug ps
echo "=== TEST Reset to defaults (natives changed first), the map stays"
set timelimit 15
set fraglimit 50
set g_gravity 400
set g_friendlyFire 1
set s_volume 0.5
set cl_splitSrvBotSkill 4
set cl_splitSrvSelfDamage 0
serveroptions
wait 5
set cl_splitSrvGametype 1
wait 5
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 10
screenshotJPEG r16-reset-row
wait 5
vstr k0a
wait 10
screenshotJPEG r16-reset-done
wait 5
echo "=== TEST after reset (page still open)"
cl_splitSrvInstagib
cl_splitSrvWeapons
cl_splitSrvSpawnWeapons
cl_splitSrvInfiniteAmmo
cl_splitSrvBots
cl_splitSrvBotSkill
cl_splitSrvSelfDamage
cl_splitSrvGod
cl_splitSrvHealth
cl_splitSrvQuad
cl_splitSrvSpeed
cl_splitSrvWeaponRespawn
cl_splitSrvGametype
cl_splitSrvMap
timelimit
fraglimit
capturelimit
g_friendlyFire
g_gravity
s_volume
g_speed
g_weaponrespawn
vstr k0b
wait 200
echo "=== TEST after leaving: restart (instagib off, quad on), map kept"
mapname
srvdebug ents
srvdebug ps
quit
