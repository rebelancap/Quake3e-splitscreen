// R10: layouts 5-8 (fill on/off, wide player), live transitions 1->8->1, lifecycle with 8 attached.
// scripts/tests/r10-run.sh vk r10-layouts.cfg layouts q3dm7     (and: gl)
// Screenshots: work/r10-<vk|gl>-l-*.jpg.  Look for "ERROR" / "ERR_DROP" / "restarting cgame" in the log.
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitAspect 1
set cl_splitVertical 0
set cl_splitFill 1
set cl_splitWidePlayer 0
set cg_drawFPS 1
set sv_cheats 1
echo "=== TEST 4 players"
addplayer 2
wait 120
addplayer 3
wait 120
addplayer 4
wait 180
splitplayers
screenshotJPEG r10-l-4
wait 5
echo "=== TEST 4 -> 5 (fill: rows 3 + 2)"
addplayer 5
wait 240
splitplayers
screenshotJPEG r10-l-5-fill
wait 5
echo "=== TEST 5, cl_splitWidePlayer 3 (P3 takes the first wide bottom cell)"
set cl_splitWidePlayer 3
wait 120
splitplayers
screenshotJPEG r10-l-5-fill-wide3
wait 5
set cl_splitWidePlayer 0
echo "=== TEST 5, fill off (3x2 with one black cell)"
set cl_splitFill 0
wait 120
splitplayers
screenshotJPEG r10-l-5-grid
wait 5
set cl_splitFill 1
wait 60
echo "=== TEST 5 -> 6 (3x2)"
addplayer 6
wait 240
splitplayers
screenshotJPEG r10-l-6
wait 5
echo "=== TEST 6 -> 7 (fill: rows 4 + 3)"
addplayer 7
wait 240
splitplayers
screenshotJPEG r10-l-7-fill
wait 5
echo "=== TEST 7, fill off (3x3, two black cells)"
set cl_splitFill 0
wait 120
splitplayers
screenshotJPEG r10-l-7-grid
wait 5
echo "=== TEST 7 -> 8, fill off (3x3, one black cell)"
addplayer 8
wait 240
splitplayers
screenshotJPEG r10-l-8-grid
wait 5
echo "=== TEST 8, fill on (4x2)"
set cl_splitFill 1
wait 120
splitplayers
screenshotJPEG r10-l-8-fill
wait 5
echo "=== TEST map_restart 0 with 8"
map_restart 0
wait 400
splitplayers
screenshotJPEG r10-l-8-maprestart
wait 5
echo "=== TEST vid_restart with 8"
vid_restart
wait 500
splitplayers
screenshotJPEG r10-l-8-vidrestart
wait 5
echo "=== TEST dropplayer 4 (a middle slot) at 8, then rejoin"
dropplayer 4
wait 120
splitplayers
screenshotJPEG r10-l-8-drop4
wait 5
addplayer 4
wait 240
splitplayers
screenshotJPEG r10-l-8-rejoin4
wait 5
echo "=== TEST transitions down 8 -> 1"
dropplayer 8
wait 90
splitplayers
dropplayer 7
wait 90
splitplayers
dropplayer 6
wait 90
splitplayers
dropplayer 5
wait 90
splitplayers
screenshotJPEG r10-l-down-4
wait 5
dropplayer 4
wait 90
dropplayer 3
wait 90
dropplayer 2
wait 120
splitplayers
screenshotJPEG r10-l-down-1
wait 5
echo "=== TEST transitions up 1 -> 8 quickly, then map change with 8"
addplayer 2
addplayer 3
addplayer 4
addplayer 5
addplayer 6
addplayer 7
addplayer 8
wait 900
splitplayers
echo "=== TEST map change with 8 (devmap q3dm17)"
devmap q3dm17
wait 900
splitplayers
screenshotJPEG r10-l-8-mapchange
wait 5
echo "=== TEST end"
quit
