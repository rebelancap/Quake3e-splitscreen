// R11 UrT 2 players, part 2 (see r11-2p.cfg)
echo "=== TEST pad 1 takes over P2"
padinject 1 connect xbox guid-pad1
wait 5
vstr k1y
wait 30
splitplayers
screenshotJPEG r11-2p-p2team
wait 5
echo "=== TEST P2 cursor on Blue, RT"
splitdebug cursor 2 497 331
wait 10
screenshotJPEG r11-2p-p2blue
wait 5
vstr rtclick1
wait 60
splitplayers
screenshotJPEG r11-2p-p2gear
wait 5
echo "=== TEST P2 opens primary"
splitdebug cursor 2 193 167
wait 10
vstr rtclick1
wait 30
screenshotJPEG r11-2p-p2primary
wait 5
echo "=== TEST P2 picks SPAS"
splitdebug cursor 2 213 276
wait 10
vstr rtclick1
wait 30
screenshotJPEG r11-2p-p2spas
wait 5
echo "=== TEST P2 closes its gear menu"
splitdebug cursor 2 533 379
wait 10
vstr rtclick1
wait 30
splitplayers
echo "=== TEST per-player colours"
p2 cg_rgb 255 0 0
p2 raceblue 1
cg_rgb 0 255 0
wait 120
p2 gear
p2 ui_gearPrimary
ui_gearPrimary
gear
dumpuser 0
dumpuser 1
echo "=== TEST wait for the round (warmup), both spawn"
wait 900
screenshotJPEG r11-2p-spawned
wait 5
p2 +scores
+scores
wait 20
screenshotJPEG r11-2p-scores
wait 5
p2 -scores
-scores
status
quit
