// R18 baseq3 zoom (+zoom, cg_zoomfov) with 2 players: no 2D scope overlay in baseq3, so nothing
// changes; shot with cl_splitOverlayBars 0 and 1 to show it.  Also the menu stays red in baseq3.
//   scripts/tests/r18-run.sh q3 r18-q3zoom.cfg q3zoom q3dm7   (no pads: P1 is keyboard/mouse)
set com_maxfps 60
set sv_cheats 1
addplayer 2
wait 200
+zoom
p2 +zoom
wait 60
set cl_splitOverlayBars 0
wait 3
screenshotJPEG r18-q3zoom-before
wait 5
set cl_splitOverlayBars 1
wait 3
screenshotJPEG r18-q3zoom-after
wait 5
-zoom
p2 -zoom
cl_splitMenuColor
set cl_splitOverlayBars 0
serveroptions
wait 20
screenshotJPEG r18-q3zoom-menu-bars0
wait 5
set cl_splitOverlayBars 1
wait 3
screenshotJPEG r18-q3zoom-menu
wait 5
quit
