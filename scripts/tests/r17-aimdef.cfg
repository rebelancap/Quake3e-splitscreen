// R17: aim assist defaults -- Guests and a new profile start Off; the host's "Allow aim assist" stays On.
// Needs a test home without saved Guest defaults (work/q3test/profiles/_guest.cfg absent).
//   scripts/tests/r17-run.sh r17-aimdef.cfg aimdef q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
echo "=== TEST engine defaults"
joy_aimAssist
cl_aimAssistAllow
joy_aimSlowLow
joy_aimRotLow
joy_aimSlowStandard
joy_aimRotStandard
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 120
echo "=== TEST P1 and P2 as Guests"
p1_joy_aimAssist
p2_joy_aimAssist
guest_joy_aimAssist
echo "=== TEST P2 keeps its settings as a new profile r17newbie (from the Guest values)"
profile_save 2 r17newbie
wait 10
set p2_joy_aimAssist 2
wait 5
profile_load 2 r17newbie
wait 10
echo "=== TEST P2 back on r17newbie: Off from the file"
p2_joy_aimAssist
wait 60
splitplayers
profile_load 2 guest
wait 10
profile_delete r17newbie
wait 10
quit
