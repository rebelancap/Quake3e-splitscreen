// R17: "Change player model" + LB / RB page turns for P1, P2 and P3 (3 players: P1 in a quarter cell,
// the maintainer's report: P1's LB/RB clicked the bottom right corner of its view). Developer log lines
// "P<n> model page: first portrait ..." name the page shown; "... cursor at x,y ... step k" the walk onto the arrow.
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles   (players must join as Guests)
//   scripts/tests/r17-run.sh r17-model.cfg model q3dm7   (maintainer-like: + +set r_customwidth 2560 +set r_customheight 1440)
exec r10-keys.cfg
set k0rb "padinject 0 button PAD_RB 1;wait 2;padinject 0 button PAD_RB 0;wait 8"
set k0lb "padinject 0 button PAD_LB 1;wait 2;padinject 0 button PAD_LB 0;wait 8"
set k1rb "padinject 1 button PAD_RB 1;wait 2;padinject 1 button PAD_RB 0;wait 8"
set k1lb "padinject 1 button PAD_LB 1;wait 2;padinject 1 button PAD_LB 0;wait 8"
set k2rb "padinject 2 button PAD_RB 1;wait 2;padinject 2 button PAD_RB 0;wait 8"
set k2lb "padinject 2 button PAD_LB 1;wait 2;padinject 2 button PAD_LB 0;wait 8"
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
wait 10
vstr k0a
vstr join1
vstr k1a
vstr join2
vstr k2a
wait 120
splitplayers
echo "=== TEST P1: Profile -> Change player model, RB twice, LB once"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 40
screenshotJPEG r17-model-p1-page
wait 5
vstr k0rb
wait 30
screenshotJPEG r17-model-p1-next
wait 5
vstr k0rb
wait 30
vstr k0lb
wait 30
vstr k0b
vstr k0b
vstr k0b
wait 20
echo "=== TEST P2: the same"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 5
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 40
vstr k1rb
wait 30
screenshotJPEG r17-model-p2-next
wait 5
vstr k1rb
wait 30
vstr k1lb
wait 30
vstr k1b
vstr k1b
vstr k1b
wait 20
echo "=== TEST P3: the same"
vstr k2st
vstr k2dn
vstr k2dn
vstr k2dn
vstr k2a
wait 5
vstr k2dn
vstr k2dn
vstr k2dn
vstr k2a
wait 40
vstr k2rb
wait 30
vstr k2lb
wait 30
vstr k2b
vstr k2b
vstr k2b
wait 20
quit
