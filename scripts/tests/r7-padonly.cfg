// R7 item 4, part 1: one pad only, launch -> main menu -> Single Player -> FIGHT (cursor + RT) -> FIGHT (d-pad + A).
// The maintainer's installed ui as-is. Part 2 (r7-padonly-2.cfg) runs after the menu's spmap (splitappend).
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r7-padonly.cfg r7-vk-padonly - +set in_gamepad 0 +set developer 1
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_padCursorSpeed 500
padinject 0 connect xbox
wait 10
echo "=== TEST any button on the pad: it is P1"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
screenshotJPEG r7-p-1-mainmenu
wait 5
echo "=== TEST Start at the main menu: host Splitscreen page full screen; B closes it"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 20
screenshotJPEG r7-p-1b-mainmenu-settings
wait 5
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 20
echo "=== TEST A: Single Player"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 60
echo "=== TEST right stick to the bottom-right corner, then left/up onto FIGHT, RT"
padinject 0 axis rx 1
padinject 0 axis ry 1
wait 90
padinject 0 axis rx 0
padinject 0 axis ry 0
wait 5
padinject 0 axis rx -0.5
wait 42
padinject 0 axis rx 0
padinject 0 axis ry -0.5
wait 20
padinject 0 axis ry 0
wait 10
screenshotJPEG r7-p-2-fight-hover
wait 5
padinject 0 axis rt 1
wait 2
padinject 0 axis rt 0
wait 60
echo "=== TEST difficulty: d-pad down x5 onto FIGHT, A"
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 10
screenshotJPEG r7-p-3-skill-fight
wait 5
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 30
echo "=== TEST the menu queued spmap; part 2 continues after it"
splitappend exec r7-padonly-2.cfg
