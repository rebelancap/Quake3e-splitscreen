// R26: pre-R26 profiles' "Look speed zoomed" (joy_zoomScale 0.1 .. 1) load as Zoom sensitivity (joy_zoomSens = 0.5 / old,
// 0.25 .. 2); a save writes joy_zoomSens.  The caller plants profiles r26a (0.25), r26b (0.5), r26c (1):
//   R18_PRE='mkdir -p profiles; for p in a:0.25 b:0.5 c:1; do printf "name \"r26${p%%:*}\"\njoy_zoomScale \"${p#*:}\"\n" > profiles/r26${p%%:*}.cfg; done'
//   R18_POST='cp profiles/r26saved.cfg <repo>/work/r26-oldprof-saved.cfg; rm -f profiles/r26*.cfg baseq3/profiles/r26*.cfg'
//   scripts/tests/r18-run.sh q3 r26-oldprof.cfg r26-oldprof q3dm17
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST r26a (joy_zoomScale 0.25) -> 2"
profile_load 1 r26a
p1_joy_zoomSens
echo "=== TEST r26b (joy_zoomScale 0.5, the old default) -> 1"
profile_load 1 r26b
p1_joy_zoomSens
echo "=== TEST r26c (joy_zoomScale 1) -> 0.5"
profile_load 1 r26c
p1_joy_zoomSens
profile_save 1 r26saved
wait 10
quit
