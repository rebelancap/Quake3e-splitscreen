// R13: player 2's own window (spawned by the coordinator with +exec r13-child2.cfg).  Pad-only from its
// main menu to a single-player match (same route as r7-padonly), then r13-child2b.cfg.
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_padCursorSpeed 500
echo "=== TEST child: an archived change (marker cl_splitMenuColor 0 1 0) must never reach q3config-ss.cfg"
set cl_splitMenuColor "0 1 0"
wait 240
indepstatus
padlist
name
screenshotJPEG r13-c2-menu
wait 5
echo "=== TEST child: Start at its main menu = its own-window page"
vstr k0st
wait 20
screenshotJPEG r13-c2-window
wait 5
vstr k0b
wait 20
echo "=== TEST child: A = Single Player"
vstr k0a
wait 60
echo "=== TEST child: right stick to the bottom-right corner, then onto FIGHT, RT (32:9 cell: 3 x 15 frames full left from the corner)"
padinject 0 axis rx 1
padinject 0 axis ry 1
wait 90
padinject 0 axis rx 0
padinject 0 axis ry 0
wait 5
padinject 0 axis rx -1
wait 15
padinject 0 axis rx 0
wait 5
padinject 0 axis rx -1
wait 15
padinject 0 axis rx 0
wait 5
padinject 0 axis rx -1
wait 15
padinject 0 axis rx 0
wait 5
padinject 0 axis ry -0.5
wait 20
padinject 0 axis ry 0
wait 10
screenshotJPEG r13-c2-fight
wait 5
padinject 0 axis rt 1
wait 2
padinject 0 axis rt 0
wait 60
echo "=== TEST child: difficulty: d-pad down x5 onto FIGHT, A"
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
screenshotJPEG r13-c2-skill
wait 5
vstr k0a
wait 30
splitappend exec r13-child2b.cfg
