// R14b: Urban Terror: the Server options page greys Instagib / Weapons / Spawn weapons / Infinite ammo /
// Self-damage / God mode and lists UrT's game types; map change to ut4_turnpike and bots work.
//   scripts/tests/r11-run.sh vk r14b-urt.cfg r14b-urt ut4_casa +set com_hunkMegs 1024 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvBots 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST UrT page (after closing UrT's team menu)"
vstr k0b
wait 30
serveroptions
wait 10
screenshotJPEG r11-r14b-urt-page
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 5
screenshotJPEG r11-r14b-urt-page2
wait 5
echo "=== TEST next map ut4_turnpike + 2 bots"
set cl_splitSrvMap ut4_turnpike
set cl_splitSrvBots 2
wait 5
vstr k0up
vstr k0up
wait 5
screenshotJPEG r11-r14b-urt-pending
wait 5
srvdebug ps
vstr k0b
wait 900
echo "=== TEST after the load"
mapname
bot_enable
srvdebug ps
screenshotJPEG r11-r14b-urt-turnpike
wait 5
set cl_splitSrvBots 0
wait 60
srvdebug ps
quit
