// R14a overlay size (cl_splitMenuSize, default 1.5): a full-screen page (P1 alone) and its scrolling host
// page, a quarter page (4 players), an eighth page and keyboard (8 players), then Menu size 1.0 / 2.5.
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles
//   scripts/tests/r10-run.sh vk r14a-menu.cfg menu q3dm7      (shots -> work/r10-vk-r14a-*.jpg)
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set cl_splitFill 1
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
padinject 3 connect xbox guid-pad3
padinject 4 connect xbox guid-pad4
padinject 5 connect xbox guid-pad5
padinject 6 connect xbox guid-pad6
padinject 7 connect xbox guid-pad7
wait 10
vstr k0a
wait 10
echo "=== TEST full-screen pause page (P1 alone), default size"
cl_splitMenuSize
vstr k0st
wait 20
screenshotJPEG r10-r14a-full
wait 5
echo "=== TEST host page: taller than the screen, scrolls (selection kept visible)"
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 10
screenshotJPEG r10-r14a-host-top
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r10-r14a-host-scrolled
wait 5
vstr k0b
vstr k0b
wait 10
echo "=== TEST 4 players: P2 pause page and P3 Controls in quarter cells"
vstr join1
vstr k1a
vstr join2
vstr k2a
vstr join3
vstr k3a
wait 100
vstr k1st
vstr k2st
vstr k2dn
vstr k2dn
vstr k2a
wait 20
screenshotJPEG r10-r14a-quarter
wait 5
set cl_splitMenuSize 2.5
wait 10
screenshotJPEG r10-r14a-quarter-size25
wait 5
set cl_splitMenuSize 1.5
wait 5
vstr k1b
vstr k2b
vstr k2b
wait 10
echo "=== TEST 8 players: P7 pause page, Controls (scrolls) and the keyboard in eighth cells"
vstr join4
vstr k4a
vstr join5
vstr k5a
vstr join6
vstr k6a
vstr join7
vstr k7a
wait 150
vstr k6st
vstr k7st
vstr k7dn
vstr k7dn
vstr k7a
wait 10
vstr k7up
wait 10
screenshotJPEG r10-r14a-eighth
wait 5
vstr k6dn
vstr k6dn
vstr k6dn
vstr k6a
wait 10
vstr k6dn
vstr k6a
wait 20
screenshotJPEG r10-r14a-eighth-kb
wait 5
echo "=== TEST Menu size 1.0 and 2.5 in the eighth cells"
set cl_splitMenuSize 1
wait 10
screenshotJPEG r10-r14a-eighth-size1
wait 5
set cl_splitMenuSize 2.5
wait 10
screenshotJPEG r10-r14a-eighth-size25
wait 5
set cl_splitMenuSize 1.5
splitplayers
quit
