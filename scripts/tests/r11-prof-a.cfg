// R11 profiles across mods, part A (baseq3): P2 creates profile "Ada", changes its look speed and a pad bind.
// Run by scripts/tests/r11-profiles.sh (shared homepath work/r11prof for baseq3 and UrT).
set com_maxfps 60
addplayer 2
wait 200
profile_save 2 Ada
wait 10
p2 joy_yawSpeed 380
pbind 2 PAD_X "+button2"
wait 150
profile_list
pbindlist 2
quit
