// R11 UrT: 2 players -- P2's own team/gear menu in its cell (pad 1 drives P2), team + gear differ from P1.
// scripts/tests/r11-run.sh vk r11-2p.cfg 2p ut4_casa +set cl_splitP1Input kbm
// Commands a cgame queues while a script waits land behind the script's remaining text,
// so the script stops after the join and continues in r11-2p-b.cfg (splitappend).
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
set cg_drawFPS 1
exec r10-keys.cfg
set rtclick1 "padinject 1 axis rt 1;wait 3;padinject 1 axis rt 0;wait 10"
screenshotJPEG r11-2p-p1menu
wait 5
echo "=== TEST P1 picks red by command"
team red
wait 60
splitplayers
echo "=== TEST addplayer 2 (P2's cgame should pop P2's own team menu)"
addplayer 2
wait 300
splitappend exec r11-2p-b.cfg
