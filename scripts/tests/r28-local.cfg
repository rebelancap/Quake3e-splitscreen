// R28: upstream sync (ec431ef9 hunk banks / CL_ShutdownVMs / CM_ClearMap) lifecycle on a local server.
// P1 + 2 extras, layout change (P1 cgame restarts in place, collision map must stay), P1 dropped into the
// air to show gravity + floor collision (viewpos z falls, then stops), map change, vid_restart, disconnect.
//   scripts/tests/r28-run.sh local      (q3: devmap q3dm1;  urt: r28-run.sh urtlocal, devmap ut4_turnpike)
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitWidePlayer 0
set cl_splitFill 1
set cl_splitVertical 0
// r28map2 is set on the command line ("devmap q3dm2" / a second UrT map)
echo "=== TEST R28 start"
meminfo
addplayer 2
wait 150
addplayer 3
wait 200
splitplayers
meminfo
wait 300
echo "=== TEST R28 layout change: P1 takes the wide cell"
set cl_splitWidePlayer 1
wait 120
splitplayers
echo "=== TEST R28 gravity after in-place restart"
viewpos
+moveup
wait 12
viewpos
-moveup
wait 90
viewpos
wait 60
viewpos
screenshotJPEG r18-r28-layout
wait 5
set cl_splitWidePlayer 0
wait 120
splitplayers
echo "=== TEST R28 map change with extras connected"
vstr r28map2
wait 400
splitplayers
meminfo
viewpos
+moveup
wait 12
viewpos
-moveup
wait 90
viewpos
screenshotJPEG r18-r28-map2
wait 5
echo "=== TEST R28 vid_restart"
vid_restart
wait 400
splitplayers
meminfo
screenshotJPEG r18-r28-vid
wait 5
echo "=== TEST R28 disconnect"
disconnect
wait 120
meminfo
echo "=== TEST R28 vid_restart in the menu"
vid_restart
wait 200
echo "=== TEST R28 end"
quit
