// R25: Quake 3 (baseq3, FFA, 2 local players): the round rows (Round time, Max rounds, Sudden death, Swap roles,
// Spawn protection) are greyed "(UrT only)"; Warmup = g_doWarmup + g_warmup, applied with one restart when the
// page is left.  The game's own setting here: g_doWarmup 1 (g_warmup 20).
//  A: page, selection on Warmup (screenshot r25-q3-page), right = Off, leave: restart with g_doWarmup 0 (no
//     warmup: CS_WARMUP stays empty).
//  B: Default from the console, leave: g_doWarmup back to the game's 1 (a 20 s warmup starts: CS_WARMUP -1 then
//     its end time).
//  C: page, right x2 = 5 s, selection on the last row so the page's note shows "On leaving: restarts the map
//     (warmup)" (r25-q3-page-pending), leave: restart with g_doWarmup 1 / g_warmup 5.  The script then ENDS
//     (no quit): the game's own end-of-warmup map_restart is queued behind any waiting script line (EXEC_APPEND),
//     so it can only run once the buffer is empty.  Run with +set logfile 2 (flushed log); the runner's caller
//     ends the game a few seconds after "=== TEST C: script done" (taskkill of its own process).
// Timestamps: games.log -> work/r25-q3-games.log.
//   scripts/tests/r18-run.sh q3 r25-q3.cfg r25-q3 q3dm17 +set logfile 2   (then end it after the marker)
exec r10-keys.cfg
set com_maxfps 125
set com_maxfpsUnfocused 125
set cl_splitSrvSet ""
set cl_splitSrvWarmup -1
set g_doWarmup 1
set g_warmup 20
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
wait 100
splitplayers
echo "=== TEST start: the game's own warmup settings (g_doWarmup 1, g_warmup 20)"
srvdebug ps
echo "=== TEST A: page, selection on Warmup; right = Off; leave"
serveroptions
wait 20
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
wait 20
screenshotJPEG r18-r25-q3-page
wait 10
padinject 0 button PAD_DPAD_RIGHT 1
wait 2
padinject 0 button PAD_DPAD_RIGHT 0
wait 8
wait 10
cl_splitSrvWarmup
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 8
wait 10
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
echo "=== TEST B: Warmup Default (console, page open); leave: the game's own g_doWarmup 1 back"
serveroptions
wait 20
set cl_splitSrvWarmup -1
wait 10
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 8
wait 10
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
wait 50
srvdebug ps
echo "=== TEST C: page, Warmup right x2 = 5 s, selection on the last row (the note)"
serveroptions
wait 20
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 8
padinject 0 button PAD_DPAD_RIGHT 1
wait 2
padinject 0 button PAD_DPAD_RIGHT 0
wait 8
padinject 0 button PAD_DPAD_RIGHT 1
wait 2
padinject 0 button PAD_DPAD_RIGHT 0
wait 8
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
