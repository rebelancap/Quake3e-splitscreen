// R19 pad ownership in Independent mode, on the test device bus (r19-run.sh; player windows see the
// bus in reverse order).  The maintainer's room: two identical pads G (devices 0, 1) and one other pad H
// (device 2) that the coordinator sees twice (device 3: coordinator-only, mirrors device 2's input).
// Then a pad that connects after the windows run (device 4, another G), and device 1 (P2's)
// unplugged and plugged back (it comes back at the end of the device list).
//   scripts/tests/r19-run.sh r19-pads.cfg pads -
set com_maxfps 60
set com_maxfpsUnfocused 60
set bA0 "padbus 0 button PAD_A 1;wait 3;padbus 0 button PAD_A 0;wait 10"
set bA1 "padbus 1 button PAD_A 1;wait 3;padbus 1 button PAD_A 0;wait 10"
set bA2 "padbus 2 button PAD_A 1;wait 3;padbus 2 button PAD_A 0;wait 10"
set bA4 "padbus 4 button PAD_A 1;wait 3;padbus 4 button PAD_A 0;wait 10"
set hA1 "padbus 1 button PAD_A 1;wait 60;padbus 1 button PAD_A 0;wait 20"
set hA2 "padbus 2 button PAD_A 1;wait 60;padbus 2 button PAD_A 0;wait 20"
set hA4 "padbus 4 button PAD_A 1;wait 60;padbus 4 button PAD_A 0;wait 20"
padbus clear
wait 5
padbus 0 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&aaa&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
padbus 1 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&bbb&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
padbus 3 connect 0300f57bc82d00000a31000000007200 \?\HID#VID_2DC8&PID_310A&COL02#8&ccc&0&0001#{4d1e55b2-f16f-11cf-88cb-001111000030} coord mirror 2
padbus 2 connect 0300f57bc82d00000a31000000007200 \?\HID#VID_2DC8&PID_310A&COL01#8&ccc&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 20
padbus list
padlist
echo "=== TEST P1: device 0 presses A"
vstr bA0
wait 20
echo "=== TEST P2: device 1 holds A, picks Guest"
vstr hA1
wait 20
vstr bA1
wait 360
indepstatus
echo "=== TEST P3: device 2 (the coordinator also sees it as device 3) holds A, picks Guest"
vstr hA2
wait 20
vstr bA2
wait 420
indepstatus
padlist
echo "=== TEST input: device 0 (P1) taps X, device 1 (P2) taps LB, device 2 (P3) taps RB"
padbus 0 button PAD_X 1
wait 3
padbus 0 button PAD_X 0
wait 30
padbus 1 button PAD_LB 1
wait 3
padbus 1 button PAD_LB 0
wait 30
padbus 2 button PAD_RB 1
wait 3
padbus 2 button PAD_RB 0
wait 60
screenshotJPEG r13-three
wait 5
echo "=== TEST late pad: device 4 (another G) connects while the windows run, holds A, picks Guest"
padbus 4 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&ddd&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 30
vstr hA4
wait 20
vstr bA4
wait 420
indepstatus
echo "=== TEST device 4 (the late pad) taps Y"
padbus 4 button PAD_Y 1
wait 3
padbus 4 button PAD_Y 0
wait 60
echo "=== TEST reconnect: device 1 (P2's) is unplugged, then plugged back (end of the device list)"
padbus 1 disconnect
wait 90
indepstatus
padbus 1 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&bbb&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
wait 90
indepstatus
padlist
echo "=== TEST device 1 taps LB after coming back (P2's window must see it)"
padbus 1 button PAD_LB 1
wait 3
padbus 1 button PAD_LB 0
wait 30
echo "=== TEST device 1 holds A (it plays in P2's window: no new window)"
vstr hA1
wait 200
indepstatus
screenshotJPEG r13-end
wait 5
echo "=== TEST quit"
quit
