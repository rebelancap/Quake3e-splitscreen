// R15 (R14b review fixes): god mode on a plain `map` game forces sv_cheats 1; turning god off
// clears it live (not at the next restart), also while a player is dead (no wait for the respawn).
// Started at the main menu:
//   scripts/tests/r14b-run.sh r15-godcheats.cfg r15-godcheats - +set logfile 4   (log work/r14b-r15-godcheats.log)
exec r10-keys.cfg
set com_maxfps 60
set cl_splitJoinHold 700
set cl_splitSrvGod 0
set cl_splitSrvBots 0
map q3dm7
wait 300
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 150
echo "=== TEST before god: cheats 0"
srvdebug ps
set cl_splitSrvGod all
wait 60
echo "=== TEST god on: cheats 1"
srvdebug ps
set cl_splitSrvGod 0
wait 60
echo "=== TEST god off: cheats 0 again"
srvdebug ps
echo "=== TEST god on again, P2 dies (kill), god off while P2 is dead: cheats 0 without a respawn"
set cl_splitSrvGod all
wait 60
p2 kill
wait 20
srvdebug ps
set cl_splitSrvGod 0
wait 60
srvdebug ps
quit
