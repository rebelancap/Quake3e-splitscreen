// R10: renderer per-frame budgets with 8 world views on a busy map: 8 local players + 6 bots,
// every local player firing rockets / plasma; r_speeds 1 prints a "frame:" line per frame with the
// shared-array use (entities, dlights, polys, drawsurfs, render command bytes).
// scripts/tests/r10-run.sh vk r10-caps.cfg caps q3dm17      (and: gl; and q3dm7)
// Then: grep '^frame:' work/r10-<r>-caps.log | sort -t, -k... -- see r10-caps-max.sh
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitFill 1
set cg_drawFPS 1
set bot_nochat 1
addbot sarge 3
addbot grunt 3
addbot anarki 3
addbot bones 3
addbot doom 3
addbot hunter 3
wait 60
addplayer 2
addplayer 3
addplayer 4
addplayer 5
addplayer 6
addplayer 7
addplayer 8
wait 600
splitplayers
echo "=== CAPS 8 views idle"
r_speeds 1
wait 60
r_speeds 0
give all
p2 give all
p3 give all
p4 give all
p5 give all
p6 give all
p7 give all
p8 give all
wait 10
weapon 5
p2 weapon 8
p3 weapon 5
p4 weapon 8
p5 weapon 5
p6 weapon 8
p7 weapon 5
p8 weapon 8
wait 30
+attack
p2 +attack
p3 +attack
p4 +attack
p5 +attack
p6 +attack
p7 +attack
p8 +attack
+left
p3 +right
p5 +left
p7 +right
wait 120
echo "=== CAPS 8 views firing"
r_speeds 1
wait 300
screenshotJPEG r10-caps-1
wait 5
wait 60
screenshotJPEG r10-caps-2
wait 5
wait 60
screenshotJPEG r10-caps-3
wait 5
r_speeds 0
-attack
p2 -attack
p3 -attack
p4 -attack
p5 -attack
p6 -attack
p7 -attack
p8 -attack
-left
p3 -right
p5 -left
p7 -right
echo "=== CAPS end"
quit
