// R12: aim assist on a remote server (r12-remote.sh: dedicated baseq3 server on the LAN IP, devmap q3dm7).
// P1 (pad 0, assist Standard) and P2 (pad 1) join; P2 is placed in front of P1 and strafes while P1
// sweeps across it, strafes, holds a tiny look input: every "AA P1" line must read off (not a local
// game) with slow 1.000 and rot 0.00; the userinfo name carries no marker; the Controls row is greyed.
set com_maxfps 60
set com_maxfpsUnfocused 60
set rconPassword r9test
exec r10-keys.cfg
set p1_joy_aimAssist 2
set guest_joy_aimAssist 2
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 5
vstr k0y
echo "=== TEST connect P1 to the remote server"
vstr r9connect
wait 600
echo "=== TEST P2 joins by pad"
vstr join1
vstr k1a
wait 200
splitplayers
set p2_joy_aimAssist 2
echo "=== TEST placement (cheat setviewpos on the devmap server)"
setviewpos 1850 -1475 -128 80
wait 60
aimassist_testplace 2 300 12
wait 60
set cl_aimAssistDebug 1
echo "=== TEST R1 slowdown sweep on a remote server"
padinject 0 axis rx 0.5
wait 45
padinject 0 axis rx 0
wait 10
echo "=== TEST R2 target strafes, P1 tiny look input"
aimassist_testplace 2 300 0
wait 60
padinject 0 axis rx 0.2
padinject 1 axis lx 1
wait 30
padinject 1 axis lx 0
padinject 0 axis rx 0
wait 10
echo "=== TEST R3 P1 strafes"
padinject 0 axis lx 1
wait 20
padinject 0 axis lx -1
wait 20
padinject 0 axis lx 0
wait 10
set cl_aimAssistDebug 0
aimassist_ents
echo "=== TEST Controls row greyed (P1 and P2)"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
vstr k1st
vstr k1dn
vstr k1dn
vstr k1a
wait 10
screenshotJPEG r12-remote-controls
wait 5
vstr k0b
vstr k0b
vstr k1b
vstr k1b
wait 10
screenshotJPEG r12-remote-noglyph
wait 5
padinject 0 button PAD_BACK 1
wait 10
screenshotJPEG r12-remote-scores
wait 5
padinject 0 button PAD_BACK 0
wait 10
splitplayers
quit
