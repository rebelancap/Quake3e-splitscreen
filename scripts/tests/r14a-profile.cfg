// R14a: Profile page "Change player model" (P2's stock model page in its cell, RB/LB turn pages) and
// "Handicap"; Controls page "Field of view" (P2's cgame sees p2_cg_fov) and the renamed outer deadzone row;
// both saved in a profile; player 1 as Guest gets the Guest FOV, its own cg_fov back at quit.
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles
//   scripts/tests/r10-run.sh vk r14a-profile.cfg profile q3dm7      (shots -> work/r10-vk-r14a-*.jpg)
exec r10-keys.cfg
set k1rb "padinject 1 button PAD_RB 1;wait 2;padinject 1 button PAD_RB 0;wait 8"
set k1lb "padinject 1 button PAD_LB 1;wait 2;padinject 1 button PAD_LB 0;wait 8"
set k0rb "padinject 0 button PAD_RB 1;wait 2;padinject 0 button PAD_RB 0;wait 8"
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
echo "=== TEST before pads: P1's own cg_fov"
cg_fov
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
echo "=== TEST P1 Guest: FOV = Guest default 90; P2 shadow"
cg_fov
p2_cg_fov
echo "=== TEST P2 Profile page: Change player model + Handicap rows"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 5
vstr k1dn
vstr k1dn
vstr k1dn
wait 10
screenshotJPEG r10-r14a-profile-page
wait 5
vstr k1a
wait 40
screenshotJPEG r10-r14a-model-page
wait 5
echo "=== TEST RB: next page of models"
vstr k1rb
wait 30
screenshotJPEG r10-r14a-model-next
wait 5
vstr k1lb
wait 20
model
p2_model
vstr k1st
wait 10
echo "=== TEST Handicap 90 for P2"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 5
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1rt
vstr k1rt
wait 5
p2_handicap
handicap
vstr k1b
vstr k1b
wait 5
echo "=== TEST Field of view 100 for P2 (Controls: up from the top = Reset, Buttons, Field of view)"
vstr k1st
vstr k1dn
vstr k1dn
vstr k1a
wait 5
vstr k1up
vstr k1up
vstr k1up
vstr k1rt
vstr k1rt
wait 10
screenshotJPEG r10-r14a-controls-fov
wait 5
vstr k1up
vstr k1up
vstr k1up
wait 5
screenshotJPEG r10-r14a-controls-deadzone
wait 5
vstr k1st
wait 20
p2_joy_fov
p2_cg_fov
cg_fov
screenshotJPEG r10-r14a-fov-views
wait 5
echo "=== TEST P1: Change player model in its own (top) cell, RB = next page"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 40
vstr k0rb
wait 30
screenshotJPEG r10-r14a-model-p1-next
wait 5
vstr k0st
wait 10
echo "=== TEST saved in a profile"
profile_save 2 Hank
wait 10
splitplayers
quit
