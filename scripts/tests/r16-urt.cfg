// R16: Urban Terror: Quad damage, Player speed (UrT ignores g_speed, see r16-urtspeed.cfg) and Weapon
// respawn greyed, g_speed untouched; Instagib uses UrT's own g_instagib ("Uses the game's own
// instagib"), leaving sets it and restarts once; Player health greyed while it is on.
//   PRE_ARGS=--noactivate scripts/tests/r11-run.sh vk r16-urt.cfg r16-urt ut4_casa +set com_hunkMegs 1024 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvBots 0
set cl_splitSrvSpeed 100
set cl_splitSrvModInstagib 0
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST UrT cvars"
g_instagib
g_speed
srvdebug ps
echo "=== TEST UrT page bottom (after closing UrT's team menu)"
vstr k0b
wait 30
serveroptions
wait 10
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 10
screenshotJPEG r11-r16-urt-bottom
wait 5
echo "=== TEST Player speed 150 % does not touch UrT's g_speed"
set cl_splitSrvSpeed 150
wait 30
g_speed
set cl_splitSrvSpeed 100
vstr k0b
wait 30
echo "=== TEST Instagib row (the game's g_instagib)"
serveroptions
wait 10
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r11-r16-urt-instagib-row
wait 5
vstr k0rt
wait 10
cl_splitSrvModInstagib
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r11-r16-urt-instagib-grey
wait 5
vstr k0b
wait 600
echo "=== TEST after the restart"
g_instagib
srvdebug ps
screenshotJPEG r11-r16-urt-instagib-game
wait 5
echo "=== TEST off again"
serveroptions
wait 10
set cl_splitSrvModInstagib 0
vstr k0b
wait 600
g_instagib
g_speed
quit
