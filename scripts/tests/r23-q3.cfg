// R23 baseq3 regression: 3 players on q3dm17 join with pads, move and jump (the UrT time shift must stay off outside UrT).
// Run: scripts/tests/r18-run.sh q3 r23-q3.cfg <name> q3dm17
exec r10-keys.cfg
set com_maxfps 125
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
wait 20
vstr k0a
wait 100
padinject 1 button PAD_A 1
wait 100
wait 50
padinject 1 button PAD_A 0
wait 40
vstr k1a
wait 100
wait 100
padinject 2 button PAD_A 1
wait 100
wait 50
padinject 2 button PAD_A 0
wait 40
vstr k2a
wait 100
wait 100
wait 100
splitplayers
srvdebug ps
echo "=== TEST all move and jump"
padinject 0 axis ly -1
padinject 1 axis ly -1
padinject 2 axis ly -1
padinject 0 axis rx 0.3
padinject 1 axis rx 0.3
padinject 2 axis rx 0.3
vstr k0a
vstr k1a
vstr k2a
wait 80
srvdebug ps
vstr k0a
vstr k1a
vstr k2a
wait 80
srvdebug ps
vstr k0a
vstr k1a
vstr k2a
wait 80
srvdebug ps
padinject 0 axis ly 0
padinject 1 axis ly 0
padinject 2 axis ly 0
padinject 0 axis rx 0
padinject 1 axis rx 0
padinject 2 axis rx 0
wait 60
srvdebug ps
screenshotJPEG r18-r23-q3
wait 10
quit
