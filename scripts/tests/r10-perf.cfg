// R10 frame-time comparison for 1, 4 and 8 views (presentation is capped at 120 Hz on this box,
// so compare the com_speeds columns, not fps): 600 frames of com_speeds 1 each, then 60 frames of
// r_speeds 1 at 8 views. sv_maxclientsPerIP 8 so the pre-R10 exe can have 8 local players too
// (archived: restore q3config afterwards).
// scripts/tests/r10-run.sh vk r10-perf.cfg perf q3dm17 +set com_maxfps 0 +set r_swapInterval 0
// EXE_DIR=work/r10-baseline scripts/tests/r10-run.sh vk r10-perf.cfg perf-before q3dm17 +set com_maxfps 0 +set r_swapInterval 0
// scripts/tests/r9-perf-avg.sh work/r10-vk-perf.log
// Linux: scripts/tests/linux-run.sh <vk|gl> r10-perf.cfg l2-perf-vk q3dm17 +set com_maxfps 0 +set r_swapInterval 0
// Screenshots r10-perf-1/-4/-8 show the cgames' own FPS counters per section.
set com_maxfps 0
set com_maxfpsUnfocused 0
set sv_maxclientsPerIP 8
set cg_drawFPS 1
wait 120
echo "=== PERF 1 view"
com_speeds 1
wait 600
com_speeds 0
screenshotJPEG r10-perf-1
wait 5
addplayer 2
addplayer 3
addplayer 4
wait 600
echo "=== PERF 4 views"
com_speeds 1
wait 600
com_speeds 0
screenshotJPEG r10-perf-4
wait 5
addplayer 5
addplayer 6
addplayer 7
addplayer 8
wait 900
splitplayers
echo "=== PERF 8 views"
com_speeds 1
wait 600
com_speeds 0
r_speeds 1
wait 60
r_speeds 0
screenshotJPEG r10-perf-8
wait 5
echo "=== PERF end"
quit
