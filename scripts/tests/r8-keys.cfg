// R8 test helpers: 'vstr k<pad><button>' taps a virtual pad button (press 2 frames, then 8 frames idle).
// buttons: a b x y st(start) bk(back) up dn lf rt(d-pad) l3 lb rb
set k0a "padinject 0 button PAD_A 1;wait 2;padinject 0 button PAD_A 0;wait 8"
