// M1 layouts: run after "+devmap q3dm1 +wait 300 +exec m1-layout.cfg"
// screenshots land in <fs_homepath>\baseq3\screenshots\m1-*.jpg
addbot sarge 3
addbot doom 3
wait 200
echo "=== TEST 2 players top/bottom"
addplayer
wait 2
screenshotJPEG m1-connecting
wait 400
p2 +forward
p2 +left
wait 60
p2 -left
wait 80
p2 -forward
splitplayers
screenshotJPEG m1-2p-topbottom
wait 5
echo "=== TEST 2 players side by side"
set cl_splitVertical 1
wait 200
splitplayers
screenshotJPEG m1-2p-sidebyside
wait 5
set cl_splitVertical 0
echo "=== TEST 3 players fill"
addplayer
wait 400
p3 +right
p3 +back
wait 70
p3 -right
p3 -back
splitplayers
screenshotJPEG m1-3p-fill
wait 5
echo "=== TEST 3 players fill, wide player 2"
set cl_splitWidePlayer 2
wait 200
splitplayers
screenshotJPEG m1-3p-fill-wide2
wait 5
set cl_splitWidePlayer 0
echo "=== TEST 3 players grid (fill 0)"
set cl_splitFill 0
wait 200
splitplayers
screenshotJPEG m1-3p-grid
wait 5
set cl_splitFill 1
echo "=== TEST 4 players"
addplayer
wait 400
p4 +left
p4 +forward
wait 40
p4 -left
wait 60
p4 -forward
splitplayers
vminfo
screenshotJPEG m1-4p
wait 5
echo "=== TEST obituary printed once"
p2 kill
wait 100
quit
