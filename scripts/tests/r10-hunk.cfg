// R10: hunk with 8 players: 10 cycles of 7 extra players joining (8 views) and leaving, on a big map;
// 'low permanent' / free of meminfo (=== HUNK markers) must be flat after the first cycle; at the
// default com_hunkMegs 128 (r10-run.sh passes it).
// scripts/tests/r10-run.sh vk r10-hunk.cfg hunk q3dm12 ; scripts/tests/r10-hunk-sum.sh work/r10-vk-hunk.log
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitFill 1
wait 30
echo "=== HUNK start"
meminfo
echo "=== CYCLE 1"
addplayer 2
addplayer 3
addplayer 4
addplayer 5
addplayer 6
addplayer 7
addplayer 8
wait 420
splitplayers
echo "=== HUNK 8 players, cycle 1"
meminfo
dropplayer 2
dropplayer 3
dropplayer 4
dropplayer 5
dropplayer 6
dropplayer 7
dropplayer 8
wait 120
echo "=== HUNK 1 player, cycle 1"
