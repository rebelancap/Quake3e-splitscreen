// R16: Urban Terror: does UrT's g_speed reach a playing player's playerState speed (Player speed row)?
//   PRE_ARGS=--noactivate scripts/tests/r11-run.sh vk r16-urtspeed.cfg r16-urtspeed ut4_casa +set g_gametype 0 +set com_hunkMegs 1024 +set logfile 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitSrvSpeed 100
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
vstr k0b
wait 20
team free
wait 30
team red
wait 600
echo "=== TEST speed 100 %"
g_gametype
g_speed
srvdebug ps
set cl_splitSrvSpeed 200
wait 60
echo "=== TEST speed 200 %"
g_speed
srvdebug ps
+forward
wait 60
srvdebug ps
wait 30
srvdebug ps
-forward
set cl_splitSrvSpeed 100
wait 60
echo "=== TEST speed back to 100 %, running"
srvdebug ps
+forward
wait 60
srvdebug ps
wait 30
srvdebug ps
-forward
quit
