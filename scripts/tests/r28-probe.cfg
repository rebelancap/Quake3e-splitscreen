// R28 probe: is the world frozen after a scripted devmap with only P1 (no extras)?  Health counts down 125->100
// when server time runs; screenshots before/after.  r18-run.sh q3 r28-probe.cfg r28-probe q3dm1 +set r28map2 "devmap q3dm2"
set com_maxfps 60
set com_maxfpsUnfocused 60
wait 120
screenshotJPEG r18-r28-p-a
wait 5
vstr r28map2
wait 400
screenshotJPEG r18-r28-p-b
wait 300
screenshotJPEG r18-r28-p-c
wait 5
echo "=== TEST R28 probe with 2 players"
addplayer 2
wait 300
vstr r28map2
wait 400
screenshotJPEG r18-r28-p-d
wait 300
screenshotJPEG r18-r28-p-e
wait 5
quit
