// R14b: Server options page by pad: the pause page row (above End game), the page (top / bottom with
// help lines), Change map with levelshots, the pending notice, leaving loads the map exactly once.
//   rm -rf work/q3test/profiles work/q3test/baseq3/profiles
//   scripts/tests/r14b-run.sh r14b-page.cfg page q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
set cl_splitSrvSet ""
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 100
echo "=== TEST P1 pause page"
vstr k0st
wait 10
screenshotJPEG r14b-pause
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 10
echo "=== TEST Server options page (top)"
screenshotJPEG r14b-page-top
wait 5
vstr k0up
wait 10
echo "=== TEST bottom (wrapped up)"
screenshotJPEG r14b-page-bottom
wait 5
vstr k0dn
vstr k0dn
wait 5
echo "=== TEST Change map list"
vstr k0a
wait 10
screenshotJPEG r14b-maps-current
wait 5
vstr k0dn
wait 10
screenshotJPEG r14b-maps-next
wait 5
vstr k0a
wait 10
echo "=== TEST pending notice (bottom of the page)"
cl_splitSrvMap
vstr k0up
vstr k0up
wait 10
screenshotJPEG r14b-page-pending
wait 5
echo "=== TEST leave: one map load (q3dm1 instead of the picked map: the test hunk is small)"
set cl_splitSrvMap q3dm1
vstr k0b
wait 10
vstr k0b
wait 300
echo "=== TEST after the load"
mapname
splitplayers
screenshotJPEG r14b-after-load
wait 5
quit
