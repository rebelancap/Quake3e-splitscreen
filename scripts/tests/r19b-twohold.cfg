// R19b: two people hold A in the same frame (Independent mode, test device bus): taken for one pad listed
// twice at first, undone when they let go at different times (150 ms) -- never put in a window's key list --
// then both join as separate players (P2, P3), each window with its own key only.
//   scripts/tests/r19-run.sh r19b-twohold.cfg twohold -
set com_maxfps 60
set com_maxfpsUnfocused 60
padbus clear
wait 5
padbus 0 connect 0300b155c82d00000b31000000007200 \?\HID#VID_2DC8&PID_310B&IG_00#8&aaa&0&0000#{4d1e55b2-f16f-11cf-88cb-001111000030}
padbus 6 connect 030045e0e8d40000ea02000000007200 \?\HID#VID_045E&PID_02EA#6&one#{ec87f1e3-c13b-4100-b5f7-8b84d54260cb}
padbus 7 connect 030045e0e8d40000ea02000000007200 \?\HID#VID_045E&PID_02EA#6&two#{ec87f1e3-c13b-4100-b5f7-8b84d54260cb}
wait 20
padbus 0 button PAD_A 1
wait 3
padbus 0 button PAD_A 0
wait 20
echo "=== TEST devices 6 and 7 hold A together (same frame), 6 lets go 20 frames before 7"
padbus 6 button PAD_A 1;padbus 7 button PAD_A 1
wait 60
padbus 6 button PAD_A 0
wait 20
padbus 7 button PAD_A 0
wait 20
indepstatus
padlist
echo "=== TEST device 6 picks Guest (P2 window): its keys must be device 6's only"
padbus 6 button PAD_A 1
wait 3
padbus 6 button PAD_A 0
wait 360
indepstatus
echo "=== TEST device 7 holds A again, picks Guest: P3, a separate window"
padbus 7 button PAD_A 1
wait 60
padbus 7 button PAD_A 0
wait 20
padbus 7 button PAD_A 1
wait 3
padbus 7 button PAD_A 0
wait 360
indepstatus
padlist
echo "=== TEST inputs: 6 taps LB, 7 taps RB"
padbus 6 button PAD_LB 1
wait 3
padbus 6 button PAD_LB 0
wait 30
padbus 7 button PAD_RB 1
wait 3
padbus 7 button PAD_RB 0
wait 60
echo "=== TEST quit"
quit
