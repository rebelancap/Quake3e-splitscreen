// M2 OpenGL sanity: run with "+set in_gamepad 0 +set developer 1 +set con_notifytime 0"
// after "+devmap q3dm1 +wait 300 +exec m2-gl.cfg"
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
padinject 0 connect xbox
padinject 1 connect playstation
wait 10
screenshotJPEG m2-gl-hint
wait 5
padinject 0 button PAD_A 1
padinject 0 button PAD_A 0
padinject 1 button PAD_A 1
padinject 1 button PAD_A 0
wait 500
splitplayers
padlist
viewpos
p2 viewpos
echo "=== TEST P2 runs forward + turns left and fires; P1 untouched"
padinject 1 axis ly -1
padinject 1 axis rx -1
padinject 1 axis rt 1
wait 80
padinject 1 axis ly 0
padinject 1 axis rx 0
screenshotJPEG m2-gl-2p-p2-moved
wait 5
padinject 1 axis rt 0
wait 20
viewpos
p2 viewpos
set developer 0
wait 5
quit
