// R17: Controls row "Cursor speed" (per player, 50-200 %) scales both right-stick cursors: the
// splitscreen overlay's dot and the game menu's red crosshair (which is also 1.4x now, R14a 1.25x).
// Each measure: 10 frames (1/6 s) at full push right; the overlay from the cell centre, the game
// menu's cursor from its top left corner; "splitcursor 1" prints the speeds and positions.
//   scripts/tests/r17-run.sh r17-cursor.cfg cursor q3dm7
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_padCursorSpeed 500
set cl_padModCursorScale 1.4
set r17ovl "vstr k0st;wait 10;padinject 0 axis rx 1;wait 10;padinject 0 axis rx 0;wait 5;splitcursor 1;vstr k0st;wait 10"
set r17game "vstr k0st;vstr k0dn;vstr k0a;wait 20;padinject 0 axis rx -1;padinject 0 axis ry -1;wait 90;padinject 0 axis ry 0;splitcursor 1;padinject 0 axis rx 1;wait 10;padinject 0 axis rx 0;wait 5;splitcursor 1;vstr k0st;wait 10"
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 60
echo "=== TEST defaults"
cl_padModCursorScale
p1_joy_cursorSpeed
echo "=== TEST Controls: Cursor speed row (up 4 from the top)"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0up
vstr k0up
vstr k0up
vstr k0up
wait 10
screenshotJPEG r17-cursor-row
wait 5
vstr k0st
wait 10
echo "=== TEST 100 %: overlay"
vstr r17ovl
echo "=== TEST 100 %: game menu"
vstr r17game
echo "=== TEST Cursor speed -> 200 % with the pad"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0up
vstr k0up
vstr k0up
vstr k0up
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
vstr k0rt
wait 10
screenshotJPEG r17-cursor-200
wait 5
vstr k0st
wait 10
echo "=== TEST 200 %: overlay"
vstr r17ovl
echo "=== TEST 200 %: game menu"
vstr r17game
echo "=== TEST 50 % (console)"
set p1_joy_cursorSpeed 0.5
splitcursor 1
set p1_joy_cursorSpeed 1
quit
