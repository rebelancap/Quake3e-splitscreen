// R7: engine pause overlay pages in a 3-player game, driven by virtual pads.
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r7-overlay.cfg r7-vk-overlay q3dm1 +set in_gamepad 0 +set developer 1
// 60 fps fixed (archived: remove com_maxfps* from q3config afterwards).
set cl_padModCursorScale 1	// R14a: the cursor timings below predate the 1.25x mod-menu cursor
set in_padDebug 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set cl_splitJoinHold 700
padinject 0 connect xbox
padinject 1 connect xbox
padinject 2 connect playstation
wait 10
echo "=== TEST pad 0: any button takes P1 (cl_splitP1Input pad)"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 10
echo "=== TEST pad 1: a short press does NOT join (hold needed)"
padinject 1 button PAD_A 1
wait 10
padinject 1 button PAD_A 0
wait 30
splitplayers
echo "=== TEST pad 1 holds A 1 s -> P2"
padinject 1 button PAD_A 1
wait 60
padinject 1 button PAD_A 0
wait 300
echo "=== TEST pad 2 holds Cross 1 s -> P3"
padinject 2 button PAD_A 1
wait 60
padinject 2 button PAD_A 0
wait 300
splitplayers
viewpos
p2 viewpos
p3 viewpos
echo "=== TEST P2 Start: pause overlay in P2's cell; P1 and P3 keep moving, P2 pushes its stick too"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 0 axis ly -1
padinject 2 axis ly -1
padinject 1 axis ly -1
wait 90
screenshotJPEG r7-o-1-p2-pause
wait 5
padinject 0 axis ly 0
padinject 2 axis ly 0
padinject 1 axis ly 0
wait 10
echo "=== TEST positions after (P1, P3 moved; P2 still)"
viewpos
p2 viewpos
p3 viewpos
echo "=== TEST P2's stick moved its overlay selection (menus take the stick): Start, Start to reopen at Resume"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 5
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
echo "=== TEST P2 down x2 -> Controls, A"
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 20
screenshotJPEG r7-o-2-p2-controls
wait 5
echo "=== TEST P2 right x3 on look speed horizontal (320 -> 380)"
padinject 1 button PAD_DPAD_RIGHT 1
wait 2
padinject 1 button PAD_DPAD_RIGHT 0
wait 5
padinject 1 button PAD_DPAD_RIGHT 1
wait 2
padinject 1 button PAD_DPAD_RIGHT 0
wait 5
padinject 1 button PAD_DPAD_RIGHT 1
wait 2
padinject 1 button PAD_DPAD_RIGHT 0
wait 5
echo "=== TEST P3 opens its overlay too (two overlays at once), goes to Controls"
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 10
padinject 2 axis ly 1
wait 40
padinject 2 axis ly 0
wait 10
screenshotJPEG r7-o-3-two-overlays
wait 5
echo "=== TEST P2 scrolls to the bottom (held d-pad repeats) -> Button bindings"
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 10
screenshotJPEG r7-o-4-p2-controls-bottom
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 20
screenshotJPEG r7-o-5-p2-buttons
wait 5
echo "=== TEST P2 on Fire (first row), A -> key capture prompt"
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 20
screenshotJPEG r7-o-6-p2-capture
wait 5
echo "=== TEST P2 presses X: Fire moves to X (X's gesture swaps to RT)"
padinject 1 button PAD_X 1
wait 2
padinject 1 button PAD_X 0
wait 20
screenshotJPEG r7-o-7-p2-rebound
wait 5
pbindlist 2
pbindlist 3
echo "=== TEST P2 B x3 back to play; P3 Start closes"
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 5
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 5
padinject 1 button PAD_B 1
wait 2
padinject 1 button PAD_B 0
wait 5
padinject 2 button PAD_START 1
wait 2
padinject 2 button PAD_START 0
wait 20
splitplayers
echo "=== TEST P1 Start -> pause with Splitscreen settings; down x3 -> settings"
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 20
screenshotJPEG r7-o-8-p1-pause
wait 5
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 5
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 5
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 5
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
screenshotJPEG r7-o-9-p1-host
wait 5
echo "=== TEST P1 B: back; down -> End game; A -> confirm page"
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 5
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 5
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
screenshotJPEG r7-o-10-p1-endgame-confirm
wait 5
padinject 0 button PAD_START 1
wait 2
padinject 0 button PAD_START 0
wait 10
echo "=== TEST P2 overlay cursor: right stick down a little (from the centre onto Controls), RT clicks it"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 1 axis ry 0.5
wait 10
padinject 1 axis ry 0
wait 10
screenshotJPEG r7-o-11a-p2-cursor
wait 5
padinject 1 axis rt 1
wait 2
padinject 1 axis rt 0
wait 20
screenshotJPEG r7-o-11b-p2-clicked
wait 5
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
echo "=== TEST P2 Start, up -> Leave game, A, down -> Leave game, A: only P2 leaves"
padinject 1 button PAD_START 1
wait 2
padinject 1 button PAD_START 0
wait 10
padinject 1 button PAD_DPAD_UP 1
wait 2
padinject 1 button PAD_DPAD_UP 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 20
screenshotJPEG r7-o-11-p2-leave-confirm
wait 5
padinject 1 button PAD_DPAD_DOWN 1
wait 2
padinject 1 button PAD_DPAD_DOWN 0
wait 5
padinject 1 button PAD_A 1
wait 2
padinject 1 button PAD_A 0
wait 200
splitplayers
status
screenshotJPEG r7-o-12-p2-left
wait 5
padlist
set developer 0
quit
