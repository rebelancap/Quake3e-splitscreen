// R18 UrT weapon zoom in splitscreen: 2 then 4 players (virtual pads 0-3; extras by addplayer, then
// their pad takes over), all with gear "GNJOXAA" (PSG-1; re-spawned with "kill" so the gear applies),
// gear menus closed with B, zoomed with ut_zoomin.  Each layout is shot twice: cl_splitOverlayBars 0
// (= before R18: the scope covers only the 4:3 area, the zoomed world shows beside it) and 1 (R18).
//   scripts/tests/r18-run.sh urt r18-zoom.cfg zoom ut4_turnpike +set g_gametype 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
set cg_drawFPS 1
set g_respawnDelay 1
exec r10-keys.cfg
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
padinject 3 connect xbox guid-pad3
wait 5
vstr k0y
wait 10
gear GNJOXAA
team free
wait 60
addplayer 2
wait 200
vstr k1y
wait 10
addplayer 3
wait 200
vstr k2y
wait 10
addplayer 4
wait 200
vstr k3y
wait 10
p2 team free
p3 team free
p4 team free
wait 300
vstr k0b
vstr k1b
vstr k2b
vstr k3b
wait 60
vstr k0b
vstr k1b
vstr k2b
vstr k3b
wait 60
p2 gear GNJOXAA
p3 gear GNJOXAA
p4 gear GNJOXAA
wait 30
p2 kill
p3 kill
p4 kill
wait 240
vstr k1a
vstr k2a
vstr k3a
wait 240
splitplayers
ut_weaptoggle primary
p2 ut_weaptoggle primary
p3 ut_weaptoggle primary
p4 ut_weaptoggle primary
wait 120
ut_zoomin
p2 ut_zoomin
p3 ut_zoomin
p4 ut_zoomin
wait 60
set cl_splitOverlayBars 0
wait 3
screenshotJPEG r18-zoom-4p-before
wait 5
set cl_splitOverlayBars 1
wait 3
screenshotJPEG r18-zoom-4p-after
wait 5
echo "=== TEST 2 players (top / bottom: 32:9 cells)"
dropplayer 4
wait 30
dropplayer 3
wait 60
set cl_splitOverlayBars 0
wait 3
screenshotJPEG r18-zoom-2p-before
wait 5
set cl_splitOverlayBars 1
wait 3
screenshotJPEG r18-zoom-2p-after
wait 5
echo "=== TEST 2 players side by side (tall 8:9 cells)"
set cl_splitVertical 1
wait 60
set cl_splitOverlayBars 0
wait 3
screenshotJPEG r18-zoom-2pv-before
wait 5
set cl_splitOverlayBars 1
wait 3
screenshotJPEG r18-zoom-2pv-after
wait 5
echo "=== TEST HUD shape Stretched (the cgame is told the cell and restarts; menus closed, zoom again)"
set cl_splitVertical 0
set cl_splitAspect 0
wait 240
vstr k0b
vstr k1b
wait 60
ut_weaptoggle primary
p2 ut_weaptoggle primary
wait 120
ut_zoomin
p2 ut_zoomin
wait 60
screenshotJPEG r18-zoom-2p-stretched
wait 5
set cl_splitAspect 1
quit
