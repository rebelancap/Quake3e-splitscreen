// R17: Team Arena (missionpack) team game: players come in as spectators (g_teamAutoJoin 0);
// the pause page offers Join red / Join blue / Auto join to a spectator and Spectate to a player
// on a team; "P<n> team: ..." lines log PERS_TEAM. Also a look at P1's own game menu (Esc path).
//   GAME=missionpack scripts/tests/r17-run.sh r17-team.cfg team mpq3ctf1 +set fs_game missionpack +set g_gametype 4
exec r10-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
vstr join1
vstr k1a
wait 150
echo "=== TEST both spectators? (P<n> team lines above)"
g_teamAutoJoin
g_gametype
echo "=== TEST P1's own game menu (the stock Esc path)"
vstr k0st
wait 10
screenshotJPEG r17-team-p1-pause
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0a
wait 30
screenshotJPEG r17-team-p1-gamemenu
wait 5
vstr k0st
wait 20
echo "=== TEST P1: Join red (pause row 2)"
vstr k0st
wait 5
vstr k0dn
vstr k0a
wait 60
echo "=== TEST P2: Auto join (pause row 4): the smaller team = blue"
vstr k1st
wait 10
screenshotJPEG r17-team-p2-pause
wait 5
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 90
screenshotJPEG r17-team-joined
wait 5
echo "=== TEST P2 on a team: Spectate row instead of the join rows"
vstr k1st
wait 10
screenshotJPEG r17-team-p2-spectate
wait 5
vstr k1st
echo "=== TEST P2: Spectate (pause row 5; the game allows one team change per 5 s)"
wait 300
vstr k1st
wait 10
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1dn
vstr k1a
wait 60
splitplayers
quit
