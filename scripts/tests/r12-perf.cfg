// R12 aim assist cost: 4 pad players + 6 bots, every player moving and looking a little
// (so the assist runs every frame), 600 frames of com_speeds 1 with assist Off, then Standard
// for all four; cl_aimAssistDebug -1 times every call (aimassist_stats: microseconds per call).
// scripts/tests/r12-run.sh q3 r12-perf.cfg perf q3dm7 +set com_maxfps 0 +set r_swapInterval 0
// scripts/tests/r10-perf-avg.sh work/r12-q3-perf.log
set com_maxfpsUnfocused 0
set sv_cheats 1
set cg_drawFPS 1
exec r10-keys.cfg
set com_maxfps 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
padinject 2 connect xbox guid-pad2
padinject 3 connect xbox guid-pad3
wait 5
vstr k0y
addplayer 2
wait 200
addplayer 3
wait 200
addplayer 4
wait 200
vstr k1y
vstr k2y
vstr k3y
wait 30
addbot sarge 3
addbot grunt 3
addbot visor 3
addbot ranger 3
addbot doom 3
addbot keel 3
wait 300
splitplayers
set p1_joy_aimAssist 0
set p2_joy_aimAssist 0
set p3_joy_aimAssist 0
set p4_joy_aimAssist 0
padinject 0 axis rx 0.25
padinject 1 axis rx -0.25
padinject 2 axis rx 0.25
padinject 3 axis rx -0.25
padinject 0 axis ly -0.3
padinject 1 axis ly -0.3
padinject 2 axis ly -0.3
padinject 3 axis ly -0.3
set com_maxfps 0
wait 120
echo "=== PERF assist Off"
com_speeds 1
wait 600
com_speeds 0
set p1_joy_aimAssist 2
set p2_joy_aimAssist 2
set p3_joy_aimAssist 2
set p4_joy_aimAssist 2
set cl_aimAssistDebug -1
aimassist_stats
wait 120
echo "=== PERF assist Standard"
com_speeds 1
wait 600
com_speeds 0
aimassist_stats
set cl_aimAssistDebug 0
set p1_joy_aimAssist 0
set p2_joy_aimAssist 0
set p3_joy_aimAssist 0
set p4_joy_aimAssist 0
wait 120
echo "=== PERF assist Off again"
com_speeds 1
wait 600
com_speeds 0
screenshotJPEG r12-perf
wait 5
echo "=== PERF end"
set com_maxfps 60
quit
