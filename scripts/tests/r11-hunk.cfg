// R11 UrT: hunk use for 1..8 players (each extra: its cgame QVM + its menu ui, which UrT's
// cgame opens at once for the team choice).  Look for "total hunk in use" after each "=== TEST".
// scripts/tests/r11-run.sh vk r11-hunk.cfg hunk800 ut4_casa                       (UrT's default.cfg: com_hunkMegs 800)
// scripts/tests/r11-run.sh vk r11-hunk.cfg hunk1024 ut4_casa +set com_hunkMegs 1024
set com_maxfps 60
set sv_cheats 1
set cg_drawFPS 1
echo "=== TEST players 1"
meminfo
addplayer 2
wait 150
echo "=== TEST players 2"
meminfo
addplayer 3
wait 150
echo "=== TEST players 3"
meminfo
addplayer 4
wait 150
echo "=== TEST players 4"
meminfo
addplayer 5
wait 150
echo "=== TEST players 5"
meminfo
addplayer 6
wait 150
echo "=== TEST players 6"
meminfo
addplayer 7
wait 150
echo "=== TEST players 7"
meminfo
addplayer 8
wait 150
echo "=== TEST players 8"
meminfo
splitappend exec r11-hunk-b.cfg
