// command line; the log's "urt:" lines show the detection and the hunk raise.
//   scripts/tests/r18-run.sh urtauto r18-auto.cfg auto ut4_turnpike   (fs_basepath = the UrT install)
//   scripts/tests/r18-run.sh urtdrop r18-auto.cfg drop ut4_turnpike   (exe beside a q3ut4 junction)
set com_maxfps 60
echo "=== TEST detected game"
fs_basepath
