// R8: R7's splitpads.cfg -> player 1's entries become the Guest defaults (only if no profiles / Guest defaults exist); the file is removed.
// scripts/tests/r8-migrate-setup.sh; scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r8-migrate.cfg r8-vk-migrate q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
// then: scripts/tests/r8-migrate-setup.sh keep; the same run again (r8-vk-migrate-2): profiles exist -> the file is ignored and left.
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
echo "=== TEST P1 (Guest) and a new Guest P2 start from the imported Guest defaults"
p1 joy_yawSpeed
p1 joy_aimCurve
p1 joy_crouchToggle
pbindlist 1
vstr join1
wait 20
vstr k1a
wait 300
p2 joy_yawSpeed
pbind 2 PAD_Y
profile_save 2 Mig
wait 10
set developer 0
quit
