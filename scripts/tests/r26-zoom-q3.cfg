// R26 baseq3: pad look speed follows +zoom (LT on the baseq3 pad layout, cg_zoomFov 22.5).  P1 on a virtual
// pad alone (full window), then P2 joins (Together, 2 players: wide cells, fov_x widened by the engine) and both
// zoom in their cells.  Zoom sensitivity 100 % (P1: 200 % once).  in_padDebug 2 prints "P<n> aim: ... (fov <cur>/<unzoomed>
// z ... cgame scale <cg.zoomSensitivity>) -> yaw".
// Run: scripts/tests/r18-run.sh q3 r26-zoom-q3.cfg r26-zoom-q3 q3dm17
exec r10-keys.cfg
set com_maxfps 125
set cg_fov 90
set p2_cg_fov 90
padinject 0 connect xbox guid-pad0
wait 10
vstr k0a
wait 100
set in_padDebug 2
set p1_joy_zoomSens 1
echo "=== TEST P1 alone: unzoomed"
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
echo "=== TEST P1 alone: +zoom held (LT)"
padinject 0 axis lt 1
wait 30
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
screenshotJPEG r18-r26-q3-zoom
padinject 0 axis lt 0
wait 30
echo "=== TEST P1 alone: released"
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
set p1_joy_zoomSens 2
echo "=== TEST P1 alone: +zoom held, Zoom sensitivity 200 %"
padinject 0 axis lt 1
wait 30
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
padinject 0 axis lt 0
wait 30
set p1_joy_zoomSens 1
echo "=== TEST P2 joins (Together, 2 players)"
padinject 1 connect xbox guid-pad1
wait 10
padinject 1 button PAD_A 1
wait 200
padinject 1 button PAD_A 0
wait 30
vstr k1a
wait 100
wait 100
wait 100
wait 100
wait 100
wait 100
wait 100
wait 100
wait 100
splitplayers
set p2_joy_zoomSens 1
echo "=== TEST Together: P1 unzoomed"
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
echo "=== TEST Together: P1 +zoom held"
padinject 0 axis lt 1
wait 30
padinject 0 axis rx 0.5
wait 80
padinject 0 axis rx 0
wait 5
padinject 0 axis lt 0
wait 30
echo "=== TEST Together: P2 unzoomed"
padinject 1 axis rx 0.5
wait 80
padinject 1 axis rx 0
wait 5
echo "=== TEST Together: P2 +zoom held"
padinject 1 axis lt 1
wait 30
padinject 1 axis rx 0.5
wait 80
padinject 1 axis rx 0
wait 5
screenshotJPEG r18-r26-q3-together-zoom
padinject 1 axis lt 0
wait 30
echo "=== TEST Together: P2 released"
padinject 1 axis rx 0.5
wait 80
padinject 1 axis rx 0
wait 5
set in_padDebug 0
echo "=== TEST P1 Controls page: Zoom sensitivity row"
vstr k0st
vstr k0dn
vstr k0dn
vstr k0a
wait 5
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r18-r26-controls
wait 5
vstr k0rt
vstr k0rt
wait 5
p1_joy_zoomSens
vstr k0b
vstr k0b
wait 10
quit
