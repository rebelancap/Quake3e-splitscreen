// R18 UrT pad layout: P1 on virtual pad 0 (Guest, built-in q3ut4 layout), in_padDebug 1 logs every
// pad button -> command; crouch / sprint toggles; Controls + Buttons pages; a saved profile's
// toggle lines; an untouched R11-layout profile file (r18old, made by the caller) upgraded on load.
//   scripts/tests/r18-run.sh urt r18-binds.cfg binds ut4_turnpike +set g_gametype 0 +set in_padDebug 1
set com_maxfps 60
set com_maxfpsUnfocused 60
set sv_cheats 1
exec r10-keys.cfg
set tap "wait 2"
padinject 0 connect xbox guid-pad0
wait 5
vstr k0y
wait 10
team free
wait 200
echo "=== TEST close the team / gear menu"
vstr k0b
wait 30
vstr k0b
wait 30
echo "=== TEST crouch state after the menu: release any latched crouch"
set p1_joy_crouchToggle 0
wait 5
set p1_joy_crouchToggle 1
wait 5
pbindlist 1
echo "=== TEST p1_joy_crouchToggle / p1_joy_sprintToggle / guest_ (defaults from the q3ut4 layout)"
p1_joy_crouchToggle
p1_joy_sprintToggle
guest_joy_crouchToggle
guest_joy_sprintToggle
echo "=== TEST every button once (in_padDebug 1 logs 'pad bind: p1 <cmd>')"
echo "--- A"
padinject 0 button PAD_A 1
wait 2
padinject 0 button PAD_A 0
wait 20
echo "--- X"
padinject 0 button PAD_X 1
wait 2
padinject 0 button PAD_X 0
wait 60
echo "--- Y"
padinject 0 button PAD_Y 1
wait 2
padinject 0 button PAD_Y 0
wait 20
echo "--- D-pad up"
padinject 0 button PAD_DPAD_UP 1
wait 2
padinject 0 button PAD_DPAD_UP 0
wait 20
echo "--- D-pad down"
padinject 0 button PAD_DPAD_DOWN 1
wait 2
padinject 0 button PAD_DPAD_DOWN 0
wait 20
echo "--- D-pad left"
padinject 0 button PAD_DPAD_LEFT 1
wait 2
padinject 0 button PAD_DPAD_LEFT 0
wait 20
echo "--- D-pad right"
padinject 0 button PAD_DPAD_RIGHT 1
wait 2
padinject 0 button PAD_DPAD_RIGHT 0
wait 20
echo "--- R3"
padinject 0 button PAD_R3 1
wait 2
padinject 0 button PAD_R3 0
wait 40
echo "--- LB"
padinject 0 button PAD_LB 1
wait 2
padinject 0 button PAD_LB 0
wait 20
echo "--- RB"
padinject 0 button PAD_RB 1
wait 2
padinject 0 button PAD_RB 0
wait 40
echo "--- LT"
padinject 0 axis lt 1
wait 3
padinject 0 axis lt 0
wait 20
echo "--- LB (zoom reset again)"
padinject 0 button PAD_LB 1
wait 2
padinject 0 button PAD_LB 0
wait 20
echo "--- RT"
padinject 0 axis rt 1
wait 3
padinject 0 axis rt 0
wait 20
echo "--- Back"
padinject 0 button PAD_BACK 1
wait 2
padinject 0 button PAD_BACK 0
wait 20
echo "--- Misc"
padinject 0 button PAD_MISC1 1
wait 2
padinject 0 button PAD_MISC1 0
wait 20
echo "=== TEST crouch toggle: B tap -> +movedown latched (no up at release), B tap -> up"
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 30
echo "--- B again"
padinject 0 button PAD_B 1
wait 2
padinject 0 button PAD_B 0
wait 30
echo "=== TEST crouch hold (p1_joy_crouchToggle 0): down while held, up at release"
set p1_joy_crouchToggle 0
padinject 0 button PAD_B 1
wait 20
padinject 0 button PAD_B 0
wait 20
set p1_joy_crouchToggle 1
echo "=== TEST sprint toggle: stick forward, L3 tap -> +button8 latched; still sprinting 2 s later"
padinject 0 axis ly -1
wait 10
padinject 0 button PAD_L3 1
wait 2
padinject 0 button PAD_L3 0
wait 120
echo "--- stick released: sprint ends after 0.3 s"
padinject 0 axis ly 0
wait 60
echo "=== TEST sprint toggle: L3 again while running ends it"
padinject 0 axis ly -1
wait 10
padinject 0 button PAD_L3 1
wait 2
padinject 0 button PAD_L3 0
wait 60
padinject 0 button PAD_L3 1
wait 2
padinject 0 button PAD_L3 0
wait 20
padinject 0 axis ly 0
wait 20
echo "=== TEST sprint hold (p1_joy_sprintToggle 0)"
set p1_joy_sprintToggle 0
padinject 0 button PAD_L3 1
wait 30
padinject 0 button PAD_L3 0
wait 20
set p1_joy_sprintToggle 1
echo "=== TEST Controls page"
set dn4 "vstr k0dn;vstr k0dn;vstr k0dn;vstr k0dn"
set rt1 "padinject 0 button PAD_DPAD_RIGHT 1;wait 2;padinject 0 button PAD_DPAD_RIGHT 0;wait 10"
vstr k0st
wait 20
vstr k0dn
vstr k0dn
vstr k0a
wait 20
screenshotJPEG r18-binds-controls-top
wait 5
vstr dn4
vstr dn4
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r18-binds-controls
wait 5
echo "=== TEST Crouch row: right -> Hold, right -> Toggle"
vstr rt1
p1_joy_crouchToggle
vstr rt1
p1_joy_crouchToggle
echo "=== TEST Sprint row: right -> Hold, right -> Toggle"
vstr k0dn
vstr rt1
p1_joy_sprintToggle
vstr rt1
p1_joy_sprintToggle
echo "=== TEST Buttons page"
vstr dn4
wait 10
screenshotJPEG r18-binds-controls-bottom
wait 5
vstr k0a
wait 20
screenshotJPEG r18-binds-buttons
wait 5
vstr dn4
vstr dn4
vstr dn4
vstr dn4
vstr dn4
vstr k0dn
vstr k0dn
vstr k0dn
wait 10
screenshotJPEG r18-binds-buttons2
wait 5
echo "=== TEST rebind: Interact / pick up (unbound) -> MISC"
vstr k0a
wait 10
padinject 0 button PAD_MISC1 1
wait 2
padinject 0 button PAD_MISC1 0
wait 20
pbindlist 1
screenshotJPEG r18-binds-rebound
wait 5
vstr dn4
vstr dn4
vstr dn4
vstr dn4
vstr dn4
wait 10
screenshotJPEG r18-binds-buttons3
wait 5
vstr k0st
wait 20
echo "=== TEST profile_save 1 r18prof (toggle lines in q3ut4/profiles/r18prof.cfg)"
profile_save 1 r18prof
wait 120
echo "=== TEST load r18old (an untouched R11-layout file) into P1"
profile_load 1 r18old
wait 30
pbindlist 1
p1_joy_crouchToggle
p1_joy_sprintToggle
profile_load 1 guest
wait 30

profile_delete r18old
wait 30
quit
