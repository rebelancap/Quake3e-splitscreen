// R9 polish: BUTTON_TALK while a player's overlay / mod menu is open; the mod's controls page in P2's menu
// cannot change P1's keyboard binds; KEYCATCH_CGAME pad routing; obituaries once; a name changed in the
// game's own menu renames the profile; device names; a hand-edited profile name; P1's q3config name at quit.
// scripts/tests/r9-polish-setup.sh, then
// scripts/tests/s6-run.sh build/Release/quake3e-vulkan-ss.x64.exe r9-polish.cfg r9-vk-polish q3dm1 +set in_gamepad 0 +set developer 1 +set logfile 3
exec r8-keys.cfg
set com_maxfps 60
set com_maxfpsUnfocused 60
set in_padDebug 2
padinject 0 connect xbox guid-pad0
padinject 1 connect xbox guid-pad1
wait 10
vstr k0a
echo "=== TEST profile list: alice.cfg says name Bob (listed as alice)"
profile_list
echo "=== TEST P2 joins as Guest from the picker"
vstr join1
wait 30
vstr k1a
wait 300
splitplayers
echo "=== TEST BUTTON_TALK: P2's overlay open / closed"
vstr k1st
wait 30
screenshotJPEG r9-pol-1-overlay
wait 5
vstr k1st
wait 30
echo "=== TEST BUTTON_TALK: P2's mod menu (Game menu)"
vstr k1st
vstr k1dn
vstr k1a
wait 30
screenshotJPEG r9-pol-2-modmenu
wait 5
echo "=== TEST P1 keyboard binds before P2 visits the mod's controls page"
echo "=== BINDLIST BEFORE"
bindlist
echo "=== BINDLIST END"
vstr k1dn
vstr k1dn
vstr k1dn
wait 10
screenshotJPEG r9-pol-3-setup-selected
wait 5
vstr k1a
wait 20
vstr k1dn
wait 10
screenshotJPEG r9-pol-4-controls-selected
wait 5
vstr k1a
wait 20
screenshotJPEG r9-pol-5-controls
wait 5
vstr k1dn
vstr k1a
wait 10
screenshotJPEG r9-pol-6-waitkey
wait 5
vstr k1a
wait 10
vstr k1dn
vstr k1a
wait 10
vstr k1rt
vstr k1a
wait 10
screenshotJPEG r9-pol-7-afterbind
wait 5
vstr k1b
wait 10
vstr k1b
wait 10
vstr k1b
wait 10
vstr k1b
wait 30
echo "=== BINDLIST AFTER"
bindlist
echo "=== BINDLIST END"
splitplayers
echo "=== TEST KEYCATCH_CGAME: P2's pad keys go to its cgame, B (escape) clears it"
splitdebug cgamecatch 2
vstr k1x
vstr k1a
vstr k1dn
vstr k1b
wait 10
vstr k1x
wait 10
echo "=== TEST obituaries: 3 cgames, one kill line"
addplayer 3
wait 300
p2 kill
wait 60
echo "=== TEST name changed in the game's menu renames the profile"
profile_save 2 Zed
wait 30
p2 name Zedd
wait 120
p2 name ^1Red
wait 120
p2 name
profile_list
p3 name Zed
wait 120
profile_save 3 nul
wait 30
profile_list
echo "=== TEST P1 as a named profile, then quit: q3config keeps P1's own name"
profile_load 1 alice
wait 60
name
wait 30
quit
